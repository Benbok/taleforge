# Русские описания заклинаний SRD 5.1 для tools/import_srd_spells.py: {index: {text, higher, material}}.
# Пересказ правил SRD 5.1 (CC BY 4.0) своими словами; дистанции — в футах, как в числах движка.
# После правки: python tools/import_srd_spells.py

# ---------------- Заговоры ----------------
acid-splash:
  text: |-
    Вы швыряете пузырь кислоты. Выберите одно существо в пределах дистанции или двух существ, стоящих не дальше 5 фт друг от друга. Цель совершает спасбросок Ловкости, при провале получая 1к6 урона кислотой.
  higher: |-
    Урон растёт на 1к6 на 5-м (2к6), 11-м (3к6) и 17-м (4к6) уровнях персонажа.
chill-touch:
  text: |-
    Вы создаёте призрачную скелетную руку у существа в пределах дистанции. Совершите дальнобойную атаку заклинанием: при попадании цель получает 1к8 урона некротической энергией и до начала вашего следующего хода не может восстанавливать хиты. Если цель — нежить, до конца вашего следующего хода она атакует вас с помехой.
  higher: |-
    Урон растёт на 1к8 на 5-м (2к8), 11-м (3к8) и 17-м (4к8) уровнях персонажа.
dancing-lights:
  text: |-
    Вы создаёте до четырёх огоньков размером с факел (или одну светящуюся фигуру, смутно похожую на человека). Каждый даёт тусклый свет в радиусе 10 фт. Бонусным действием вы можете переместить огоньки на расстояние до 60 фт; огонёк гаснет, если отдалится от вас больше чем на 20 фт.
druidcraft:
  text: |-
    Шёпот природы: вы предсказываете погоду на ближайшие сутки, заставляете цветок распуститься или бутон закрыться, создаёте безвредный природный эффект (листопад, запах, дуновение) или мгновенно зажигаете либо гасите свечу, факел или костёр.
eldritch-blast:
  text: |-
    К существу в пределах дистанции устремляется луч потрескивающей энергии. Совершите дальнобойную атаку заклинанием: при попадании цель получает 1к10 урона силовым полем.
  higher: |-
    Лучей становится больше: два на 5-м уровне, три на 11-м и четыре на 17-м. Лучи можно направить в одну цель или в разные, для каждого — свой бросок атаки.
fire-bolt:
  text: |-
    Вы бросаете сгусток огня в существо или предмет в пределах дистанции. Совершите дальнобойную атаку заклинанием: при попадании цель получает 1к10 урона огнём. Горючий предмет, который никто не несёт, загорается.
  higher: |-
    Урон растёт на 1к10 на 5-м (2к10), 11-м (3к10) и 17-м (4к10) уровнях персонажа.
guidance:
  text: |-
    Вы касаетесь согласного существа. Один раз до окончания заклинания цель может добавить к одной проверке характеристики 1к4 — до или после броска. После этого заклинание заканчивается.
light:
  text: |-
    Вы касаетесь предмета не больше 10 фт в поперечнике. До окончания заклинания он испускает яркий свет в радиусе 20 фт и тусклый ещё на 20 фт, любого цвета. Если предмет держит или носит враждебное существо, оно может спастись Ловкостью и избежать эффекта.
mage-hand:
  text: |-
    В пределах дистанции появляется призрачная парящая рука. Действием вы управляете ею: открываете незапертую дверь или сосуд, достаёте или кладёте предмет, выливаете содержимое флакона. Рука не атакует, не активирует магические предметы и не поднимает больше 10 фунтов. Она исчезает, если отдалится от вас больше чем на 30 фт.
mending:
  text: |-
    Вы чините одно повреждение предмета, которого касаетесь: разорванное звено цепи, половинки сломанного ключа, прореху в плаще, трещину в кувшине. Разрыв не больше 1 фута исчезает без следа. Магию предмета так не восстановить.
message:
  text: |-
    Вы указываете на существо в пределах дистанции и шепчете послание. Слышит его только цель и может так же шёпотом ответить — ответ слышите только вы. Заклинание проходит сквозь тонкие преграды, но его останавливают камень толще фута, металл, свинец или дерево толще 3 футов.
minor-illusion:
  text: |-
    Вы создаёте звук или образ предмета в пределах дистанции. Звук может быть от шёпота до крика. Образ — неподвижный предмет не больше куба 5 фт, без звука, света и запаха. Существо, потратившее действие на изучение, распознаёт иллюзию успешной проверкой Интеллекта (Анализ) против вашей сложности; сквозь образ можно пройти рукой.
poison-spray:
  text: |-
    Вы выдыхаете облако ядовитых испарений в существо в пределах дистанции. Цель совершает спасбросок Телосложения, при провале получая 1к12 урона ядом.
  higher: |-
    Урон растёт на 1к12 на 5-м (2к12), 11-м (3к12) и 17-м (4к12) уровнях персонажа.
prestidigitation:
  text: |-
    Мелкий фокус на выбор: безвредная искра или запах, зажечь или погасить свечу, очистить или испачкать предмет до 1 кубического фута, согреть, охладить или приправить еду, оставить на поверхности цветной знак, создать мелкую безделушку или иллюзорный образ в руке до конца вашего следующего хода. Одновременно действуют до трёх эффектов.
produce-flame:
  text: |-
    На вашей ладони загорается колеблющееся пламя: яркий свет 10 фт и тусклый ещё 10 фт, вам оно не вредит. Действием можно метнуть пламя в существо в пределах 30 фт — дальнобойная атака заклинанием, при попадании 1к8 урона огнём, после чего пламя гаснет.
  higher: |-
    Урон растёт на 1к8 на 5-м (2к8), 11-м (3к8) и 17-м (4к8) уровнях персонажа.
ray-of-frost:
  text: |-
    В существо в пределах дистанции бьёт холодный бело-голубой луч. Совершите дальнобойную атаку заклинанием: при попадании цель получает 1к8 урона холодом, и её скорость до начала вашего следующего хода уменьшается на 10 фт.
  higher: |-
    Урон растёт на 1к8 на 5-м (2к8), 11-м (3к8) и 17-м (4к8) уровнях персонажа.
resistance:
  text: |-
    Вы касаетесь согласного существа. Один раз до окончания заклинания цель может добавить 1к4 к одному спасброску — до или после броска. После этого заклинание заканчивается.
sacred-flame:
  text: |-
    На существо в пределах дистанции, которое вы видите, нисходит пламя, похожее на сияние. Цель совершает спасбросок Ловкости, при провале получая 1к8 урона излучением. Укрытие от этого спасброска не помогает.
  higher: |-
    Урон растёт на 1к8 на 5-м (2к8), 11-м (3к8) и 17-м (4к8) уровнях персонажа.
shillelagh:
  text: |-
    Дубинка или боевой посох в вашей руке наполняется силой природы. До окончания заклинания вы атакуете им, используя заклинательную характеристику вместо Силы, кость урона оружия становится к8, и оружие считается магическим. Заклинание заканчивается, если вы сотворите его снова или выпустите оружие из рук.
shocking-grasp:
  text: |-
    С вашей руки срывается молния. Совершите рукопашную атаку заклинанием по существу, которого можете коснуться; если на цели металлический доспех, у вас преимущество. При попадании цель получает 1к8 урона электричеством и до начала своего следующего хода не может совершать реакции.
  higher: |-
    Урон растёт на 1к8 на 5-м (2к8), 11-м (3к8) и 17-м (4к8) уровнях персонажа.
spare-the-dying:
  text: |-
    Вы касаетесь живого существа с 0 хитов. Оно становится стабильным. На нежить и конструктов не действует.
thaumaturgy:
  text: |-
    Малое чудо, знак высшей силы: голос на минуту становится втрое громче, пламя мерцает или меняет цвет, земля дрожит, звучит гром или крик, незапертая дверь или окно распахивается или захлопывается, меняется вид ваших глаз. Одновременно действуют до трёх эффектов.
true-strike:
  text: |-
    Вы указываете на существо в пределах дистанции и на миг прозреваете его защиту. В вашем следующем ходу первая атака по этой цели совершается с преимуществом, если заклинание к тому времени не закончилось.
vicious-mockery:
  text: |-
    Вы осыпаете существо, которое видите, оскорблениями, пропитанными тонкой магией. Если цель вас слышит (понимать язык не обязательно), она совершает спасбросок Мудрости: при провале получает 1к4 урона психической энергией и совершает с помехой следующую атаку до конца своего следующего хода.
  higher: |-
    Урон растёт на 1к4 на 5-м (2к4), 11-м (3к4) и 17-м (4к4) уровнях персонажа.

# ---------------- 1-й круг ----------------
alarm:
  text: |-
    Вы ставите сигнал против вторжения: дверь, окно или область не больше куба 20 фт. Пока заклинание действует, каждое крошечное и более крупное существо, коснувшееся или вошедшее в область, поднимает тревогу — кроме тех, кого вы назвали при сотворении. Тревога либо мысленная (будит вас, если вы в пределах мили), либо звуковая — звон колокольчика на 60 фт.
  material: крошечный колокольчик и кусочек тонкой серебряной проволоки
animal-friendship:
  text: |-
    Вы убеждаете зверя, что не желаете ему зла. Выберите зверя в пределах дистанции, которого видите; он должен видеть и слышать вас. Если Интеллект зверя 4 или выше, заклинание не действует. Иначе зверь совершает спасбросок Мудрости и при провале очарован вами на время действия. Заклинание заканчивается, если вы или ваши спутники причините цели вред.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё один зверь.
  material: кусочек еды
bane:
  text: |-
    До трёх существ в пределах дистанции, которых вы видите, совершают спасброски Харизмы. Каждая провалившая цель, совершая бросок атаки или спасбросок до окончания заклинания, вычитает из него 1к4.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё одна цель.
  material: капля крови
bless:
  text: |-
    Вы благословляете до трёх существ в пределах дистанции. До окончания заклинания каждая цель, совершая бросок атаки или спасбросок, добавляет к нему 1к4.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё одна цель.
  material: брызги святой воды
burning-hands:
  text: |-
    Из ваших вытянутых пальцев вырывается тонкий веер пламени. Каждое существо в конусе 15 фт совершает спасбросок Ловкости: при провале получает 3к6 урона огнём, при успехе — половину. Горючие предметы в области, которые никто не несёт, загораются.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 1-го.
charm-person:
  text: |-
    Вы пытаетесь очаровать гуманоида в пределах дистанции. Он совершает спасбросок Мудрости, с преимуществом, если вы или ваши спутники с ним сражаетесь. При провале он очарован вами, пока действует заклинание или пока вы и ваши спутники не причините ему вреда, и считает вас дружелюбным знакомым. Когда заклинание закончится, цель знает, что была очарована.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё один гуманоид; цели не дальше 30 фт друг от друга.
color-spray:
  text: |-
    Из вашей руки бьёт ослепительный веер цвета. Бросьте 6к10 — это запас хитов, которые заклинание может «погасить». Существа в конусе 15 фт по возрастанию текущих хитов слепнут до конца вашего следующего хода, пока хиты цели не превысят остаток запаса. Бессознательных и незрячих существ заклинание пропускает.
  higher: |-
    +2к10 к запасу за каждый круг ячейки выше 1-го.
  material: щепотка порошка или песка красного, жёлтого и синего цветов
command:
  text: |-
    Вы произносите одно слово-приказ существу в пределах дистанции. Цель совершает спасбросок Мудрости и при провале исполняет приказ в свой следующий ход: «подойди», «брось», «беги», «ложись», «стой» и тому подобное. Не действует на нежить, на тех, кто не понимает вашего языка, и если приказ прямо вредит цели.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё одна цель; цели не дальше 30 фт друг от друга.
comprehend-languages:
  text: |-
    До окончания заклинания вы понимаете буквальный смысл любой речи, которую слышите, и любого письма, которого касаетесь (около минуты на страницу). Тайные знаки и шифры это не раскрывает.
  material: щепотка сажи и соли
create-or-destroy-water:
  text: |-
    Вы создаёте или уничтожаете воду. Создать: до 10 галлонов чистой воды в открытом сосуде или дождём в кубе 30 фт (гасит открытый огонь). Уничтожить: до 10 галлонов воды в открытом сосуде или туман в кубе 30 фт.
  higher: |-
    +10 галлонов или +5 фт к стороне куба за каждый круг ячейки выше 1-го.
  material: капля воды, чтобы создать, или несколько песчинок, чтобы уничтожить
cure-wounds:
  text: |-
    Существо, которого вы касаетесь, восстанавливает хиты: 1к8 + модификатор вашей заклинательной характеристики. На нежить и конструктов не действует.
  higher: |-
    +1к8 за каждый круг ячейки выше 1-го.
detect-evil-and-good:
  text: |-
    До окончания заклинания вы чувствуете в пределах 30 фт аберраций, исчадий, небожителей, фей, элементалей и нежить, а также их местонахождение, и знаете, освящено или осквернено место или предмет. Преграду останавливают фут камня, дюйм металла, тонкий лист свинца или 3 фута дерева и земли.
detect-magic:
  text: |-
    До окончания заклинания вы чувствуете магию в пределах 30 фт. Действием вы видите слабое свечение вокруг видимого магического существа или предмета и узнаёте школу его магии. Преграду останавливают фут камня, дюйм металла, тонкий лист свинца или 3 фута дерева и земли.
detect-poison-and-disease:
  text: |-
    До окончания заклинания вы чувствуете в пределах 30 фт яды, ядовитых существ и болезни, их местонахождение и вид. Преграду останавливают фут камня, дюйм металла, тонкий лист свинца или 3 фута дерева и земли.
  material: лист тиса
disguise-self:
  text: |-
    Вы меняете свою внешность, одежду, доспех, оружие и снаряжение: можно стать на фут выше или ниже, толще или худее, но строение тела остаётся прежним. Иллюзия не выдерживает касания. Существо, потратившее действие на осмотр, распознаёт её успешной проверкой Интеллекта (Анализ) против вашей сложности.
divine-favor:
  text: |-
    Ваша молитва наполняет оружие сиянием. До окончания заклинания ваши атаки оружием наносят дополнительно 1к4 урона излучением при попадании.
entangle:
  text: |-
    Из земли в квадрате 20 фт с центром в выбранной точке вырастают цепкие травы и лозы; область становится труднопроходимой. Каждое существо в ней совершает спасбросок Силы и при провале опутано до окончания заклинания. Опутанное существо может действием совершить проверку Силы против вашей сложности, чтобы освободиться.
expeditious-retreat:
  text: |-
    Вы двигаетесь невероятно быстро. Сразу при сотворении и затем бонусным действием в каждом своём ходу до окончания заклинания вы можете совершить Рывок.
faerie-fire:
  text: |-
    Предметы и существа в кубе 20 фт очерчиваются синим, зелёным или фиолетовым светом (на ваш выбор). Существа, провалившие спасбросок Ловкости, светятся тусклым светом в радиусе 10 фт, не получают выгоды от невидимости, и атаки по ним совершаются с преимуществом, если нападающий их видит.
false-life:
  text: |-
    Вы подкрепляете себя некротическим подобием жизни и получаете 1к4 + 4 временных хита на время действия.
  higher: |-
    +5 временных хитов за каждый круг ячейки выше 1-го.
  material: капля спирта или крепкого вина
feather-fall:
  text: |-
    Реакцией, когда вы или существо в пределах 60 фт падаете: до пяти падающих существ замедляют падение до 60 фт в раунд. Если существо приземлится до окончания заклинания, оно не получает урона от падения и приземляется на ноги.
  material: небольшое перо или клочок пуха
find-familiar:
  text: |-
    Вы призываете духа в облике мелкого животного: летучей мыши, кошки, краба, лягушки, ястреба, ящерицы, осьминога, совы, змеи, рыбы, крысы, ворона, морского конька, паука или ласки. Фамильяр действует самостоятельно, но всегда подчиняется вам. Он не атакует, но может совершать другие действия. Пока он в пределах 100 фт, вы общаетесь с ним телепатически и можете действием видеть его глазами и слышать его ушами. Он может передавать ваши заклинания касанием.
  material: древесный уголь, благовония и травы стоимостью 10 зм, сжигаемые в латунной жаровне
floating-disk:
  text: |-
    Вы создаёте круглый горизонтальный диск силы диаметром 3 фута и толщиной в дюйм. Он парит в 3 футах над землёй и выдерживает до 500 фунтов. Диск следует за вами, держась в 20 фт, и огибает перепады высот не больше 10 фт.
  material: капля ртути
fog-cloud:
  text: |-
    Вы создаёте сферу тумана радиусом 20 фт с центром в выбранной точке. Сфера огибает углы, и область внутри сильно заслонена. Туман держится, пока действует заклинание, или пока его не рассеет сильный ветер.
  higher: |-
    +20 фт к радиусу за каждый круг ячейки выше 1-го.
goodberry:
  text: |-
    В вашей руке появляются до десяти волшебных ягод. Существо может действием съесть одну: она восстанавливает 1 хит и насыщает на целый день. Ягоды теряют силу через 24 часа.
  material: веточка омелы
grease:
  text: |-
    Квадрат 10 фт с центром в выбранной точке покрывается скользким жиром и становится труднопроходимым. Каждое существо в нём при появлении жира и каждое, кто входит в область или заканчивает там ход, совершает спасбросок Ловкости и при провале падает ничком.
  material: кусочек свиной шкуры или масла
guiding-bolt:
  text: |-
    В существо в пределах дистанции бьёт вспышка света. Совершите дальнобойную атаку заклинанием: при попадании цель получает 4к6 урона излучением, а следующая атака по ней до конца вашего следующего хода совершается с преимуществом — цель мерцает тусклым светом.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 1-го.
healing-word:
  text: |-
    Существо в пределах дистанции, которое вы видите, восстанавливает хиты: 1к4 + модификатор вашей заклинательной характеристики. На нежить и конструктов не действует.
  higher: |-
    +1к4 за каждый круг ячейки выше 1-го.
hellish-rebuke:
  text: |-
    Реакцией, когда существо в пределах 60 фт причиняет вам урон: вы указываете на него, и его окутывает адское пламя. Цель совершает спасбросок Ловкости: при провале получает 2к10 урона огнём, при успехе — половину.
  higher: |-
    +1к10 урона за каждый круг ячейки выше 1-го.
heroism:
  text: |-
    Согласное существо, которого вы касаетесь, преисполняется храбрости. До окончания заклинания оно не может быть испугано и в начале каждого своего хода получает временные хиты, равные модификатору вашей заклинательной характеристики. Когда заклинание заканчивается, оставшиеся временные хиты пропадают.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё одна цель.
hideous-laughter:
  text: |-
    Существо в пределах дистанции, которое вы видите, видит всё невыносимо смешным. Оно совершает спасбросок Мудрости и при провале падает ничком от хохота и становится недееспособным до окончания заклинания. Существо с Интеллектом 4 и ниже не подвержено эффекту. В конце каждого своего хода и всякий раз, получив урон, цель повторяет спасбросок (с преимуществом, если её задел урон) и при успехе освобождается.
  material: крошечные пирожные и перо, которым машут в воздухе
hunters-mark:
  text: |-
    Вы помечаете существо, которое видите, как свою добычу. До окончания заклинания ваши атаки оружием по нему наносят дополнительно 1к6 урона, и у вас преимущество на проверки Мудрости (Восприятие) и Мудрости (Выживание) для его поиска. Если цель падает до 0 хитов, в последующий ход бонусным действием вы можете перенести метку на другое существо.
  higher: |-
    На ячейке 3-го или 4-го круга метка держится до 8 часов, 5-го и выше — до 24 часов.
identify:
  text: |-
    Вы касаетесь предмета на протяжении всего сотворения. Если предмет магический, вы узнаёте его свойства, как им пользоваться, нужна ли настройка и сколько у него зарядов. Вы также узнаёте, какие заклинания действуют на предмет или существо, которого вы касаетесь.
  material: жемчужина стоимостью не меньше 100 зм и перо совы
illusory-script:
  text: |-
    Вы пишете на пергаменте, бумаге или другом материале, и написанное окутывается иллюзией. Для вас и указанных при сотворении существ текст читается как обычно; для остальных он выглядит как неизвестное письмо или другое сообщение по вашему выбору. Истинное видение открывает скрытый смысл.
  material: чернила на основе свинца стоимостью не меньше 10 зм, расходуются
inflict-wounds:
  text: |-
    Совершите рукопашную атаку заклинанием по существу, которого можете коснуться. При попадании цель получает 3к10 урона некротической энергией.
  higher: |-
    +1к10 урона за каждый круг ячейки выше 1-го.
jump:
  text: |-
    Вы касаетесь существа. До окончания заклинания дальность его прыжков утраивается.
  material: задняя лапка кузнечика
longstrider:
  text: |-
    Вы касаетесь существа. До окончания заклинания его скорость увеличивается на 10 фт.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё одна цель.
  material: щепотка земли
mage-armor:
  text: |-
    Вы касаетесь согласного существа без доспехов, и его окутывает защитное поле силы. До окончания заклинания его базовый класс доспеха — 13 + модификатор Ловкости. Заклинание заканчивается, если цель наденет доспех.
  material: кусочек выделанной кожи
magic-missile:
  text: |-
    Вы создаёте три светящихся дротика силы. Каждый поражает выбранное существо в пределах дистанции, которое вы видите, и наносит 1к4 + 1 урона силовым полем. Дротики бьют без промаха и одновременно; их можно направить в одну цель или в разные.
  higher: |-
    За каждый круг ячейки выше 1-го — ещё один дротик.
protection-from-evil-and-good:
  text: |-
    До окончания заклинания согласное существо, которого вы касаетесь, защищено от аберраций, исчадий, небожителей, фей, элементалей и нежити. Они атакуют его с помехой, не могут очаровать, испугать или вселиться в него; если это уже случилось, у цели преимущество на новый спасбросок.
  material: святая вода или толчёное серебро и железо, расходуются
purify-food-and-drink:
  text: |-
    Вся немагическая еда и питьё в сфере радиусом 5 фт с центром в выбранной точке очищаются от яда и болезней.
sanctuary:
  text: |-
    Вы ограждаете существо в пределах дистанции. До окончания заклинания каждый, кто пытается атаковать цель или направить на неё вредное заклинание, сначала совершает спасбросок Мудрости и при провале выбирает другую цель или теряет атаку. Урон по области заклинание не отводит. Оно заканчивается, если цель сама атакует, творит вредное заклинание или причиняет вред.
  material: маленькое серебряное зеркальце
shield:
  text: |-
    Реакцией, когда по вам попадают атакой или в вас летит «Волшебная стрела»: вокруг вас на миг встаёт невидимый барьер силы. До начала вашего следующего хода вы получаете +5 к КД, в том числе против сработавшей атаки, и не получаете урона от «Волшебной стрелы».
shield-of-faith:
  text: |-
    Существо в пределах дистанции окутывает мерцающее поле. До окончания заклинания цель получает +2 к КД.
  material: маленький пергамент с частицей священного текста
silent-image:
  text: |-
    Вы создаёте образ предмета, существа или другого видимого явления в пределах куба 15 фт. Иллюзия беззвучна, без запаха и тепла. Действием вы можете перемещать её в пределах дистанции. Физическое взаимодействие выдаёт иллюзию; существо, потратившее действие на осмотр, распознаёт её успешной проверкой Интеллекта (Анализ) против вашей сложности.
  material: клочок овечьей шерсти
sleep:
  text: |-
    Волна магической дремоты. Бросьте 5к8 — это запас хитов, которые заклинание может усыпить. Существа в пределах 20 фт от выбранной точки по возрастанию текущих хитов засыпают до окончания заклинания, пока хиты цели не превысят остаток запаса. Спящий просыпается от урона или если его растолкают действием. Нежить и те, кого нельзя очаровать, не подвержены.
  higher: |-
    +2к8 к запасу за каждый круг ячейки выше 1-го.
  material: щепотка мелкого песка, лепестки розы или сверчок
speak-with-animals:
  text: |-
    До окончания заклинания вы понимаете зверей и можете говорить с ними. Их знания и понимание ограничены их умом, но они могут рассказать о местах и чудовищах поблизости, о том, что видели за последний день.
thunderwave:
  text: |-
    От вас расходится волна громовой силы. Каждое существо в кубе 15 фт, исходящем от вас, совершает спасбросок Телосложения: при провале получает 2к8 урона звуком и отталкивается на 10 фт от вас, при успехе — половину урона без отталкивания. Незакреплённые предметы в области тоже отбрасываются, а раскат слышен за 300 фт.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 1-го.
unseen-servant:
  text: |-
    Вы создаёте невидимую безликую силу, которая выполняет простые поручения: приносит вещи, убирает, чинит, складывает одежду, разводит огонь, подаёт еду. У слуги КД 10, 1 хит, Сила 2, скорость 15 фт; он не атакует. Бонусным действием вы отдаёте ему приказ, и он выполняет его в пределах 60 фт от вас.
  material: кусочек нити и щепка дерева

# ---------------- 2-й круг ----------------
acid-arrow:
  text: |-
    В цель в пределах дистанции летит мерцающая зелёная стрела и взрывается брызгами кислоты. Совершите дальнобойную атаку заклинанием: при попадании цель получает 4к4 урона кислотой сразу и 2к4 в конце своего следующего хода; при промахе — половину начального урона и ничего потом.
  higher: |-
    +1к4 и к начальному, и к позднему урону за каждый круг ячейки выше 2-го.
  material: толчёный лист ревеня и желудок гадюки
aid:
  text: |-
    Вы укрепляете решимость до трёх союзников. До окончания заклинания максимум хитов каждой цели и её текущие хиты увеличиваются на 5.
  higher: |-
    +5 хитов за каждый круг ячейки выше 2-го.
  material: крошечная полоска белой ткани
alter-self:
  text: |-
    Вы меняете облик. На выбор, до окончания заклинания: приспособиться к воде (жабры и перепонки, скорость плавания равна обычной), изменить внешность (рост, вес, черты, голос в пределах своего вида) или отрастить природное оружие — когти, клыки, рога. Природное оружие наносит 1к6 урона и считается магическим, +1 к атаке и урону. Менять вариант можно действием.
animal-messenger:
  text: |-
    Крошечный зверь доставит ваше послание. Назовите место, которое вы видели, и получателя по описанию; зверь передаст сообщение длиной до 25 слов, двигаясь около 25 миль в день (летающий — 50). Если зверь не доберётся за время действия, послание теряется.
  higher: |-
    +48 часов действия за каждый круг ячейки выше 2-го.
  material: кусочек еды
arcane-lock:
  text: |-
    Вы касаетесь закрытой двери, окна, ворот, сундука или другого входа, и он запирается, пока действует заклинание. Вы и указанные при сотворении существа открываете его свободно; можно задать пароль. Остальным открыть его на 10 сложнее, «Открывание» подавляет запор на 10 минут.
  material: золотая пыль стоимостью не меньше 25 зм, расходуется
arcanists-magic-aura:
  text: |-
    Вы маскируете магию существа или предмета: он может казаться немагическим или магическим, с аурой любой выбранной школы, либо существо может «читаться» как другое по природе — например, нежить как живое. Заклинания обнаружения видят ложный облик.
  material: маленький квадрат шёлка
augury:
  text: |-
    Вы бросаете кости, пальцы или косточки и получаете знамение о действии, которое собираетесь совершить в ближайшие 30 минут: «удача» — к хорошему, «беда» — к плохому, «удача и беда» — и то и другое, «ничего» — ни хорошего, ни плохого. Повторные гадания до продолжительного отдыха могут дать случайный ответ.
  material: знаки для гадания стоимостью не меньше 25 зм
barkskin:
  text: |-
    Вы касаетесь согласного существа. До окончания заклинания его кожа грубеет, как древесная кора, и класс доспеха не может быть ниже 16, какой бы доспех на нём ни был.
  material: горсть дубовой коры
blindness-deafness:
  text: |-
    Выберите существо в пределах дистанции: оно совершает спасбросок Телосложения и при провале слепнет или глохнет (на ваш выбор) до окончания заклинания. В конце каждого своего хода цель повторяет спасбросок и при успехе освобождается.
  higher: |-
    За каждый круг ячейки выше 2-го — ещё одна цель.
blur:
  text: |-
    Ваше тело расплывается, колышется, его трудно разглядеть. До окончания заклинания все атаки по вам совершаются с помехой. Не действует на тех, кто не полагается на зрение — со слепым зрением или истинным видением.
branding-smite:
  text: |-
    Следующая ваша атака оружием, попавшая до окончания заклинания, вспыхивает светом и наносит дополнительно 2к6 урона излучением. Если цель невидима, она становится видимой и светится тусклым светом в 5 фт, пока действует заклинание.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 2-го.
calm-emotions:
  text: |-
    Вы гасите сильные чувства гуманоидов в сфере радиусом 20 фт. Каждая цель может спастись Харизмой. На выбор: подавить на время заклинания эффекты очарования и испуга или сделать враждебных целей безразличными к выбранным вами существам. Безразличие проходит, если цель атакуют или ей вредят.
continual-flame:
  text: |-
    Из предмета, которого вы касаетесь, поднимается пламя, светящее как факел. Оно не даёт тепла, не расходует кислород и горит, пока его не рассеют. Пламя можно спрятать или накрыть, но не задуть и не потушить водой.
  material: рубиновая пыль стоимостью 50 зм, расходуется
darkness:
  text: |-
    Из выбранной точки или предмета расползается магическая тьма — сфера радиусом 15 фт. Её не пронзает тёмное зрение, немагический свет не может её осветить. Если тьма в предмете, закрыв его, вы закрываете и её. Магический свет 2-го круга и ниже она рассеивает при пересечении.
  material: шерсть летучей мыши и капля смолы или кусочек угля
darkvision:
  text: |-
    Вы касаетесь согласного существа. До окончания заклинания оно видит в темноте на 60 фт.
  material: щепотка сушёной моркови или агат
detect-thoughts:
  text: |-
    До окончания заклинания вы можете читать мысли существ. Действием вы нацеливаетесь на существо в пределах 30 фт и видите его поверхностные мысли. Действием же можно копнуть глубже: цель совершает спасбросок Мудрости, при провале вы узнаёте её рассуждения, чувства и то, что её тревожит. Существо с Интеллектом 3 и ниже или без языка не открывает мыслей. Также вы можете искать мыслящих существ поблизости, даже невидимых.
  material: медная монета
enhance-ability:
  text: |-
    Вы касаетесь существа и даруете ему силу одного из образов на время заклинания. Бычья сила — преимущество на проверки Силы, переносимый вес удваивается. Кошачья грация — преимущество на проверки Ловкости, без урона от падения с 20 фт. Медвежья стойкость — преимущество на проверки Телосложения и 2к6 временных хитов. Орлиное величие — Харизма; лисья хитрость — Интеллект; совиная мудрость — Мудрость.
  higher: |-
    За каждый круг ячейки выше 2-го — ещё одна цель.
  material: шерсть или перо зверя
enlarge-reduce:
  text: |-
    Существо или предмет, который вы видите, растёт или уменьшается; несогласная цель может спастись Телосложением. Увеличение: размер вдвое больше по каждому измерению, вес ×8, преимущество на проверки и спасброски Силы, оружие наносит +1к4 урона. Уменьшение: размер вдвое меньше, вес ÷8, помеха на проверки и спасброски Силы, оружие наносит −1к4 урона (не меньше 1).
  material: щепотка толчёного железа
enthrall:
  text: |-
    Вы плетёте сладкие речи. Существа в пределах дистанции, которые вас слышат, совершают спасбросок Мудрости (с преимуществом, если сражаются с вами). Провалившие до окончания заклинания получают помеху на проверки Мудрости (Восприятие), чтобы заметить кого-то, кроме вас. Заклинание заканчивается, если цель перестаёт вас слышать или вы замолкаете.
find-steed:
  text: |-
    Вы призываете духа, который принимает облик верного скакуна: боевого коня, пони, верблюда, лося или мастифа. Он умнее обычного зверя (Интеллект 6), понимает вас и служит в бою как ездовое существо. Пока скакун в пределах мили, вы общаетесь с ним телепатически. Заклинания с целью «на себя» можно распространить и на скакуна.
find-traps:
  text: |-
    Вы чувствуете присутствие любой ловушки в пределах дистанции, которую видите — механической или магической, созданной, чтобы навредить. Вы узнаёте, что ловушка есть и какого она рода, но не её точное место.
flame-blade:
  text: |-
    В вашей свободной руке появляется пламенный клинок, похожий на скимитар; он светит на 10 фт. Действием вы совершаете им рукопашную атаку заклинанием: при попадании 3к6 урона огнём. Клинок можно отпустить и снова призвать бонусным действием до окончания заклинания.
  higher: |-
    +1к6 урона за каждые два круга ячейки выше 2-го.
  material: лист сумаха
flaming-sphere:
  text: |-
    В свободной клетке появляется огненная сфера диаметром 5 фт. Каждое существо, заканчивающее ход в пределах 5 фт от неё, совершает спасбросок Ловкости: при провале 2к6 урона огнём, при успехе половину. Бонусным действием вы перемещаете сферу на 30 фт; врезавшись в существо, она требует от него того же спасброска и останавливается.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 2-го.
  material: кусочек сала, щепотка серы и железные опилки
gentle-repose:
  text: |-
    Вы касаетесь трупа или других останков. На время заклинания они защищены от разложения и не могут стать нежитью. Время действия не засчитывается в срок, за который тело ещё можно вернуть к жизни (например, «Оживлением»).
  material: щепотка соли и медная монета на каждый глаз трупа
gust-of-wind:
  text: |-
    От вас бьёт линия сильного ветра длиной 60 фт и шириной 10 фт. Каждое существо, начинающее ход в линии, совершает спасбросок Силы и при провале отталкивается на 15 фт по направлению ветра. Двигаться против ветра — вдвое дороже. Ветер разгоняет газы и туман, гасит пламя. Бонусным действием можно сменить направление.
  material: семечко бобового растения
heat-metal:
  text: |-
    Металлический предмет — оружие или доспех на существе — раскаляется докрасна. Существо, касающееся его, получает 2к8 урона огнём при сотворении. Держащий предмет должен спастись Телосложением или бросить его, если может; не бросивший до вашего следующего хода совершает атаки и проверки с помехой. Бонусным действием в каждом последующем ходу вы повторяете урон.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 2-го.
  material: кусочек железа и пламя
hold-person:
  text: |-
    Выберите гуманоида в пределах дистанции. Он совершает спасбросок Мудрости и при провале парализован до окончания заклинания. В конце каждого своего хода цель повторяет спасбросок и при успехе освобождается.
  higher: |-
    За каждый круг ячейки выше 2-го — ещё один гуманоид; цели не дальше 30 фт друг от друга.
  material: маленький прямой кусочек железа
invisibility:
  text: |-
    Существо, которого вы касаетесь, становится невидимым до окончания заклинания; невидимо и всё, что оно несёт. Заклинание заканчивается, если цель атакует или творит заклинание.
  higher: |-
    За каждый круг ячейки выше 2-го — ещё одна цель.
  material: ресница в кусочке смолы
knock:
  text: |-
    Выберите предмет в пределах дистанции: дверь, сундук, кандалы, замок. Один обычный или магический запор отпирается, застрявшее открывается, засов отодвигается. «Магический замок» подавляется на 10 минут. При сотворении раздаётся громкий стук, слышный на 300 фт.
lesser-restoration:
  text: |-
    Вы касаетесь существа и снимаете с него одну болезнь или одно состояние: ослепление, глухоту, паралич или отравление.
levitate:
  text: |-
    Существо или незакреплённый предмет весом до 500 фунтов поднимается вертикально до 20 фт и висит в воздухе; несогласная цель может спастись Телосложением. Действием вы поднимаете или опускаете цель на 20 фт. Сама цель может двигаться, только отталкиваясь от опор. Когда заклинание заканчивается, цель мягко опускается на землю.
  material: кожаная петля или золотая проволока
locate-animals-or-plants:
  text: |-
    Назовите вид зверя или растения. Вы узнаёте направление и расстояние до ближайшего существа или растения этого вида в пределах 5 миль, если оно есть.
  material: клочок шерсти ищейки
locate-object:
  text: |-
    Опишите или назовите знакомый вам предмет. До окончания заклинания вы чувствуете направление на него, если он в пределах 1000 фт; если он движется, вы знаете куда. Можно искать и ближайший предмет определённого рода, если вы видели такой вблизи. Свинец даже тонким слоем блокирует заклинание.
  material: раздвоенная веточка
magic-mouth:
  text: |-
    Вы вкладываете в предмет послание до 25 слов, которое прозвучит при выполнении условия, заданного вами: кто-то подошёл, коснулся, произнёс слово. На предмете появляется волшебный рот и говорит вашим голосом. Послание звучит, пока его не рассеют; можно задать, звучит ли оно один раз или каждый раз.
  material: немного медовых сот и нефритовая пыль стоимостью 10 зм, расходуется
magic-weapon:
  text: |-
    Вы касаетесь немагического оружия. До окончания заклинания оно становится магическим и получает +1 к броскам атаки и урона.
  higher: |-
    Ячейка 4-го круга — +2, 6-го и выше — +3.
mirror-image:
  text: |-
    Вокруг вас появляются три иллюзорных двойника, повторяющих каждое движение. Когда по вам совершают атаку, бросьте к20, чтобы узнать, не выбрана ли двойник целью: с тремя двойниками — на 6+, с двумя — на 8+, с одним — на 11+. КД двойника 10 + ваш модификатор Ловкости; попадание уничтожает его. Существа, не полагающиеся на зрение, не обманываются.
misty-step:
  text: |-
    Окутанные серебристым туманом, вы телепортируетесь на расстояние до 30 фт в свободное место, которое видите. Творится бонусным действием.
moonbeam:
  text: |-
    Цилиндр лунного света радиусом 5 фт и высотой 40 фт падает в выбранную точку. Существо, впервые за ход входящее в него или начинающее там ход, совершает спасбросок Телосложения: при провале 2к10 урона излучением, при успехе половину. Перевёртыши совершают спасбросок с помехой и при провале возвращаются в исходный облик. Действием вы передвигаете луч на 60 фт.
  higher: |-
    +1к10 урона за каждый круг ячейки выше 2-го.
  material: семена лунного цветка и опалесцирующий полевой шпат
pass-without-trace:
  text: |-
    Вас окутывают тени и тишина. До окончания заклинания каждое выбранное существо в пределах 30 фт от вас (и вы сами) получает +10 к проверкам Ловкости (Скрытность), и его нельзя выследить без магии. Существо не оставляет следов.
  material: пепел сожжённого листа омелы и веточка ели
prayer-of-healing:
  text: |-
    До шести существ в пределах дистанции, которых вы видите, восстанавливают хиты: каждое 2к8 + модификатор вашей заклинательной характеристики. Сотворение занимает 10 минут, поэтому в бою его не применить. На нежить и конструктов не действует.
  higher: |-
    +1к8 за каждый круг ячейки выше 2-го.
protection-from-poison:
  text: |-
    Вы касаетесь существа. Если оно отравлено, вы нейтрализуете один яд. До окончания заклинания у цели преимущество на спасброски от отравления и сопротивление урону ядом.
ray-of-enfeeblement:
  text: |-
    Из вашего пальца бьёт чёрный луч. Совершите дальнобойную атаку заклинанием: при попадании до окончания заклинания цель наносит оружием, основанным на Силе, лишь половину урона. В конце каждого своего хода цель может спастись Телосложением и прекратить эффект.
rope-trick:
  text: |-
    Вы касаетесь верёвки длиной до 60 фт, и один её конец поднимается вверх, пока верёвка не встанет вертикально. На верху открывается невидимый вход в межпространственный карман, где помещаются до восьми существ среднего размера. Верёвку можно втянуть внутрь. Когда заклинание заканчивается, всё содержимое выпадает наружу.
  material: порошок кукурузы и скрученная петля пергамента
scorching-ray:
  text: |-
    Вы создаёте три огненных луча и направляете их в цели в пределах дистанции — в одну или в разные. Совершите дальнобойную атаку заклинанием за каждый луч: при попадании цель получает 2к6 урона огнём.
  higher: |-
    За каждый круг ячейки выше 2-го — ещё один луч.
see-invisibility:
  text: |-
    До окончания заклинания вы видите невидимых существ и предметы, как видимых, и заглядываете на Эфирный План: там всё выглядит призрачным и полупрозрачным.
  material: щепотка талька и немного серебряного порошка
shatter:
  text: |-
    Из выбранной точки раздаётся болезненно громкий звон. Каждое существо в сфере радиусом 10 фт совершает спасбросок Телосложения: при провале 3к8 урона звуком, при успехе половину. Существа из камня, кристалла или металла совершают спасбросок с помехой. Немагические предметы в области, которые никто не несёт, тоже получают урон.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 2-го.
  material: осколок слюды
silence:
  text: |-
    До окончания заклинания в сфере радиусом 20 фт с центром в выбранной точке не распространяется никакой звук. Существа в ней оглохли и неуязвимы к урону звуком. Сотворить заклинание со словесным компонентом внутри сферы нельзя.
spider-climb:
  text: |-
    Согласное существо, которого вы касаетесь, до окончания заклинания может ходить по вертикальным поверхностям и потолку вниз головой, оставляя руки свободными, и получает скорость лазания, равную обычной скорости.
  material: капля битума и паук
spike-growth:
  text: |-
    Земля в радиусе 20 фт вокруг выбранной точки покрывается твёрдыми шипами, замаскированными под обычную почву. Область труднопроходима, и существо получает 2к4 колющего урона за каждые 5 фт перемещения по ней. Заметить шипы до того, как в них вступишь, можно проверкой Мудрости (Восприятие) против вашей сложности.
  material: семь острых шипов или веточек
spiritual-weapon:
  text: |-
    В пределах дистанции появляется парящее призрачное оружие. При сотворении и затем бонусным действием в каждом ходу вы можете переместить его на 20 фт и совершить им рукопашную атаку заклинанием по существу в пределах 5 фт от оружия: при попадании 1к8 + модификатор заклинательной характеристики урона силовым полем.
  higher: |-
    +1к8 урона за каждые два круга ячейки выше 2-го.
suggestion:
  text: |-
    Вы предлагаете существу, которое вас слышит и понимает, план действий — одну-две фразы, звучащие разумно. Цель совершает спасбросок Мудрости и при провале следует внушению, пока действует заклинание. Явно самоубийственные внушения не действуют. Заклинание заканчивается, когда внушение выполнено или если вы или ваши спутники вредите цели.
  material: язык змеи и соты или капля сладкого масла
warding-bond:
  text: |-
    Вы связываете себя с согласным существом, которого касаетесь. До окончания заклинания цель получает +1 к КД и спасброскам и сопротивление всем видам урона, но всякий раз, получив урон, вы получаете столько же. Заклинание заканчивается, если вы упали до 0 хитов или отошли дальше 60 фт друг от друга.
  material: два платиновых кольца стоимостью не меньше 50 зм каждое, которые носите вы и цель
web:
  text: |-
    Вы заполняете куб 20 фт толстой липкой паутиной; область сильно заслонена и труднопроходима. Паутина должна крепиться к двум опорам, иначе она оседает. Каждое существо, начинающее ход в паутине или входящее в неё, совершает спасбросок Ловкости и при провале опутано, пока остаётся в ней или не вырвется проверкой Силы против вашей сложности. Паутина горит: куб 5 фт сгорает за раунд, нанося 2к4 урона огнём.
  material: кусочек паутины
zone-of-truth:
  text: |-
    Вы создаёте зону, защищённую от обмана, — сферу радиусом 15 фт. Существо, впервые за ход входящее в неё или начинающее там ход, совершает спасбросок Харизмы и при провале не может сознательно лгать, пока находится в зоне. Вы знаете, прошла ли цель спасбросок; цель знает о действии заклинания и может уклоняться от ответов.

# ---------------- 3-й круг ----------------
animate-dead:
  text: |-
    Вы превращаете кучу костей или труп среднего либо малого гуманоида в пределах дистанции в нежить — скелета или зомби. Бонусным действием в каждом ходу вы мысленно приказываете любому созданию в пределах 60 фт. Без приказа оно лишь защищается. Контроль держится 24 часа; чтобы продлить его, творите заклинание снова на то же существо до истечения срока.
  higher: |-
    За каждый круг ячейки выше 3-го — ещё два существа.
  material: капля крови, кусочек плоти и щепотка костяной пыли
beacon-of-hope:
  text: |-
    Вы даруете надежду и жизненную силу. Выберите любое число существ в пределах дистанции. До окончания заклинания у каждого преимущество на спасброски Мудрости и спасброски от смерти, и любое лечение восстанавливает им максимально возможное число хитов.
bestow-curse:
  text: |-
    Вы касаетесь существа, и оно совершает спасбросок Мудрости. При провале выберите проклятие на время заклинания: помеха на проверки и спасброски одной характеристики; помеха на атаки по вам; в начале каждого хода спасбросок Мудрости, при провале ход пропускается; или ваши атаки и заклинания наносят ей дополнительно 1к8 урона некротической энергией. «Снятие проклятия» заканчивает эффект.
  higher: |-
    На ячейке 4-го круга — 10 минут, 5-го — 8 часов, 7-го — 24 часа, 9-го — до рассеивания; на 5-м и выше концентрация не нужна.
blink:
  text: |-
    В конце каждого своего хода до окончания заклинания бросайте к20. На 11 и выше вы исчезаете с плана и переходите на Эфирный План до начала следующего хода, где вас не видят и не могут атаковать. В начале следующего хода вы возвращаетесь в свободное место в пределах 10 фт от того, где исчезли.
call-lightning:
  text: |-
    Над вами собирается грозовая туча — цилиндр радиусом 60 фт. При сотворении и затем действием в каждом ходу вы выбираете точку под тучей, и туда бьёт молния. Каждое существо в пределах 5 фт от точки совершает спасбросок Ловкости: при провале 3к10 урона электричеством, при успехе половину. Если сотворить в грозу, урон больше на 1к10.
  higher: |-
    +1к10 урона за каждый круг ячейки выше 3-го.
clairvoyance:
  text: |-
    В знакомом или очевидном месте в пределах 1 мили появляется невидимый датчик. До окончания заклинания вы видите или слышите (выбор при сотворении) через него, как если бы стояли там; действием можно переключаться между зрением и слухом. Существо, видящее невидимое, замечает датчик как светящийся шар размером с кулак.
  material: фокусировка стоимостью не меньше 100 зм — рог с драгоценными камнями для слуха или стеклянный глаз для зрения
conjure-animals:
  text: |-
    Вы призываете духов в облике зверей в свободные места в пределах дистанции: одного зверя с опасностью до 2, двух — до 1, четырёх — до 1/2 или восьми — до 1/4. Они дружественны вам и вашим спутникам и действуют по вашим мысленным приказам на своих ходах. Когда заклинание заканчивается или зверь падает до 0 хитов, он исчезает.
  higher: |-
    На ячейке 5-го круга — вдвое больше существ, 7-го — втрое, 9-го — вчетверо.
counterspell:
  text: |-
    Реакцией, когда существо в пределах 60 фт творит заклинание: вы пытаетесь его прервать. Заклинание 3-го круга и ниже проваливается без следа. Против более высокого круга совершите проверку заклинательной характеристики со сложностью 10 + круг его заклинания; при успехе оно тоже проваливается.
  higher: |-
    Без проверки прерывается заклинание круга не выше ячейки, которую вы потратили.
create-food-and-water:
  text: |-
    Вы создаёте 45 фунтов еды и 30 галлонов пресной воды на земле или в сосудах — этого хватит на пятнадцать гуманоидов или пять скакунов на сутки. Еда безвкусна, но питательна, и портится через 24 часа; вода не портится.
daylight:
  text: |-
    Из выбранной точки разливается свет — сфера радиусом 60 фт яркого света и ещё 60 фт тусклого. Если точка на предмете, свет перемещается с ним; закрыв предмет, вы закрываете и свет. Магическую тьму 3-го круга и ниже, пересекающуюся с ним, свет рассеивает.
dispel-magic:
  text: |-
    Выберите существо, предмет или магический эффект в пределах дистанции. Все заклинания 3-го круга и ниже на нём заканчиваются. Для каждого заклинания более высокого круга совершите проверку заклинательной характеристики со сложностью 10 + круг; при успехе оно тоже заканчивается.
  higher: |-
    Без проверки заканчиваются заклинания круга не выше потраченной ячейки.
fear:
  text: |-
    Вы насылаете призрачный образ худших страхов. Каждое существо в конусе 30 фт совершает спасбросок Мудрости и при провале роняет то, что держит, и испугано до окончания заклинания. Испуганное существо в свой ход должно Рывком уходить от вас самым безопасным путём. Если в конце хода цель вас не видит, она повторяет спасбросок и при успехе освобождается.
  material: белое перо или сердце курицы
fireball:
  text: |-
    С вашего пальца срывается яркая искра и в выбранной точке раскрывается ревущим огненным шаром. Каждое существо в сфере радиусом 20 фт совершает спасбросок Ловкости: при провале получает 8к6 урона огнём, при успехе — половину. Огонь огибает углы; горючие предметы, которые никто не несёт, загораются.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 3-го.
  material: крошечный шарик из гуано летучей мыши и серы
fly:
  text: |-
    Согласное существо, которого вы касаетесь, до окончания заклинания получает скорость полёта 60 фт. Если заклинание заканчивается в полёте, цель падает, если не может удержаться иначе.
  higher: |-
    За каждый круг ячейки выше 3-го — ещё одна цель.
  material: маховое перо из крыла любой птицы
gaseous-form:
  text: |-
    Согласное существо, которого вы касаетесь, вместе со всем, что несёт, превращается в туманное облако. Скорость полёта 10 фт, сопротивление немагическому урону, преимущество на спасброски Силы, Ловкости и Телосложения; оно проходит в щели, но не может атаковать, творить заклинания и говорить. Цель может вернуть облик действием.
  material: кусочек марли и струйка дыма
glyph-of-warding:
  text: |-
    Вы наносите на поверхность или внутрь закрываемого предмета почти невидимый глиф, срабатывающий при заданном условии. Взрывная руна: существа в сфере 20 фт спасаются Ловкостью от 5к8 урона выбранной стихии (половина при успехе). Или глиф заклинания: вы вкладываете в него заклинание 3-го круга и ниже, и оно срабатывает на нарушителя. Глиф находят проверкой Интеллекта (Анализ) против вашей сложности. Сотворение занимает час.
  higher: |-
    Урон руны растёт на 1к8, а круг вложенного заклинания — на один за каждый круг ячейки выше 3-го.
  material: ладан и толчёный алмаз стоимостью не меньше 200 зм, расходуются
haste:
  text: |-
    Выберите согласное существо в пределах дистанции. До окончания заклинания его скорость удваивается, оно получает +2 к КД, преимущество на спасброски Ловкости и в каждом ходу — дополнительное действие: одна атака оружием, Рывок, Отход, Засада или Использование предмета. Когда заклинание заканчивается, цель не может двигаться и действовать до конца своего следующего хода — её накрывает усталость.
  material: стружка корня солодки
hypnotic-pattern:
  text: |-
    Вы создаёте узор переливающихся цветов в кубе 30 фт. Каждое существо, которое его видит, совершает спасбросок Мудрости и при провале очаровано до окончания заклинания: оно недееспособно, а скорость его 0. Эффект заканчивается для цели, если она получает урон или кто-то действием приводит её в чувство.
  material: светящаяся палочка благовоний или хрустальный флакон с фосфоресцирующим веществом
lightning-bolt:
  text: |-
    От вас бьёт молния линией длиной 100 фт и шириной 5 фт. Каждое существо в линии совершает спасбросок Ловкости: при провале получает 8к6 урона электричеством, при успехе — половину. Горючие предметы, которые никто не несёт, загораются.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 3-го.
  material: мех и стеклянный или янтарный стержень
magic-circle:
  text: |-
    Вы чертите круг — цилиндр радиусом 10 фт и высотой 20 фт — против небожителей, элементалей, фей, исчадий или нежити. Такие существа не могут войти в него по своей воле, атакуют тех, кто внутри, с помехой, и не могут очаровать, испугать или вселиться в них. Круг можно обратить наоборот — чтобы удержать существо внутри. Сотворение занимает минуту.
  higher: |-
    +1 час действия за каждый круг ячейки выше 3-го.
  material: святая вода или порошок серебра и железа стоимостью не меньше 100 зм, расходуются
major-image:
  text: |-
    Вы создаёте образ предмета, существа или явления в кубе 20 фт — со звуком, запахом и теплом по вашему выбору. Действием вы двигаете образ и меняете звук, заставляя его говорить и жить естественно. Физическое взаимодействие выдаёт иллюзию; существо, потратившее действие на осмотр, распознаёт её проверкой Интеллекта (Анализ) против вашей сложности.
  higher: |-
    На ячейке 6-го круга и выше иллюзия держится без концентрации, пока её не рассеют.
  material: клочок овечьей шерсти
mass-healing-word:
  text: |-
    Вы произносите слова восстановления. До шести существ в пределах дистанции, которых вы видите, восстанавливают хиты: каждое 1к4 + модификатор вашей заклинательной характеристики. На нежить и конструктов не действует.
  higher: |-
    +1к4 за каждый круг ячейки выше 3-го.
meld-into-stone:
  text: |-
    Вы вместе со снаряжением погружаетесь в каменную поверхность или предмет, достаточно большой, чтобы вас вместить. Внутри вас не видно и не слышно; вы слышите снаружи, но видеть не можете. Урон от разрушения камня выталкивает вас наружу. Заклинание можно творить ритуалом.
nondetection:
  text: |-
    На время заклинания вы скрываете существо или предмет весом до 10 фунтов от магии прорицания. Цель не видна через магические датчики и не может быть обнаружена заклинаниями прорицания.
  material: щепотка алмазной пыли стоимостью 25 зм, посыпанная на цель, расходуется
phantom-steed:
  text: |-
    В свободном месте появляется крупное полуреальное существо, похожее на коня, с экипировкой. Скорость 100 фт, за час оно проходит 10 миль. Ездить на нём можете вы или назначенное вами существо. Скакун исчезает, если получает урон, и когда заклинание заканчивается — всадник мягко оказывается на земле.
plant-growth:
  text: |-
    Растения в области пышно разрастаются. Мгновенно: в круге радиусом 100 фт заросли становятся настолько густыми, что на каждые 5 фт движения нужно 20 фт. Либо за 8 часов сотворения растения в радиусе полумили обогащаются, давая урожай вдвое больше на год вперёд.
protection-from-energy:
  text: |-
    До окончания заклинания согласное существо, которого вы касаетесь, получает сопротивление одному виду урона на ваш выбор: кислоте, холоду, огню, электричеству или звуку.
remove-curse:
  text: |-
    От вашего касания заканчиваются все проклятия на существе или предмете. Если предмет — проклятый магический, проклятие остаётся, но разрывается настройка владельца, и тот может избавиться от предмета.
revivify:
  text: |-
    Вы касаетесь существа, умершего не больше минуты назад. Оно возвращается к жизни с 1 хитом. Так не вернуть умершего от старости и не восстановить утраченные части тела.
  material: алмазы стоимостью 300 зм, расходуются
sending:
  text: |-
    Вы отправляете короткое послание до 25 слов знакомому существу. Оно слышит его в голове, узнаёт вас, если знакомо с вами, и может сразу ответить так же коротко. Послание достигает цели на любом расстоянии; существо с Интеллектом 1 понимает смысл, но не может ответить.
  material: короткий отрезок тонкой медной проволоки
sleet-storm:
  text: |-
    В цилиндре радиусом 40 фт и высотой 20 фт идёт ледяной дождь со снегом. Область сильно заслонена, земля покрывается льдом и становится труднопроходимой, открытое пламя гаснет. Существо, входящее в область впервые за ход или начинающее там ход, совершает спасбросок Ловкости и при провале падает ничком. Заклинатель, начинающий ход в буре, спасается Телосложением, чтобы не потерять концентрацию.
  material: щепотка пыли и несколько капель воды
slow:
  text: |-
    Вы меняете течение времени для до шести существ в кубе 40 фт. Каждое совершает спасбросок Мудрости и при провале до окончания заклинания: скорость вдвое меньше, −2 к КД и спасброскам Ловкости, нет реакций, в ход — либо действие, либо бонусное действие, не больше одной атаки. Творя заклинание с временем действием, цель может потерять его. В конце каждого своего хода цель повторяет спасбросок.
  material: капля патоки
speak-with-dead:
  text: |-
    Вы даруете подобие жизни трупу с ртом, который не стал нежитью. До окончания заклинания вы можете задать ему до пяти вопросов. Труп знает лишь то, что знал при жизни, отвечает кратко, загадочно или односложно и не обязан говорить правду, если был враждебен к вам. Одно тело — не чаще раза в 10 дней.
  material: горящие благовония
speak-with-plants:
  text: |-
    Растения в пределах 30 фт обретают подобие разума. Вы можете расспрашивать их о том, что происходило рядом за последний день, и просить: обычные растения могут сделать заросли проходимыми или наоборот, растительные существа — говорить с вами.
spirit-guardians:
  text: |-
    Вас окружают духи-хранители. Выбранные вами существа не затронуты. Для остальных в пределах 15 фт скорость уменьшается вдвое, а существо, впервые за ход входящее в область или начинающее там ход, совершает спасбросок Мудрости: при провале 3к8 урона излучением (или некротической энергией, если вы злы), при успехе половину.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 3-го.
  material: священный символ
stinking-cloud:
  text: |-
    Вы создаёте сферу тошнотворного жёлтого газа радиусом 20 фт; область сильно заслонена. Каждое существо, начинающее ход в облаке, совершает спасбросок Телосложения и при провале тратит ход на рвоту: без действия и бонусного действия. Существа, которым не нужно дышать, и невосприимчивые к яду спасаются автоматически. Сильный ветер разгоняет облако.
  material: тухлое яйцо или листья капусты
tiny-hut:
  text: |-
    Над вами поднимается неподвижный купол силы радиусом 10 фт; внутри помещаются до девяти существ среднего размера. Снаружи ничто не проникает внутрь — ни существа, ни предметы, ни магия; изнутри вы можете выходить свободно. Внутри сухо и комфортно при любой погоде. Купол непрозрачен снаружи. Заклинание заканчивается, если вы выходите наружу.
  material: маленькая хрустальная бусина
tongues:
  text: |-
    Существо, которого вы касаетесь, до окончания заклинания понимает любой услышанный язык, а его речь понимает любое существо, знающее хоть какой-нибудь язык.
  material: маленькая глиняная модель зиккурата
vampiric-touch:
  text: |-
    Касание вашей окутанной тенью руки вытягивает жизнь. Совершите рукопашную атаку заклинанием: при попадании цель получает 3к6 урона некротической энергией, а вы восстанавливаете хиты в размере половины нанесённого урона. До окончания заклинания вы можете повторять атаку действием в каждом ходу.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 3-го.
water-breathing:
  text: |-
    До десяти согласных существ в пределах дистанции, которых вы видите, до окончания заклинания могут дышать под водой, сохраняя обычное дыхание.
  material: короткая тростинка или соломинка
water-walk:
  text: |-
    До десяти согласных существ в пределах дистанции, которых вы видите, до окончания заклинания могут ходить по любой жидкости — воде, кислоте, грязи, снегу, песку-плывуну, лаве — как по твёрдой земле (урон от горячей жидкости они всё равно получают). Существо, погружённое в жидкость, поднимается на поверхность со скоростью 60 фт в раунд.
  material: кусочек пробки
wind-wall:
  text: |-
    Из земли поднимается стена сильного ветра длиной до 50 фт, высотой 15 фт и толщиной 1 фут. Каждое существо в её области при появлении совершает спасбросок Силы: при провале 3к8 дробящего урона, при успехе половину. Ветер разгоняет туман и газы, сбивает мелких летунов, а стрелы, болты и другие обычные снаряды не пролетают сквозь стену.
  material: крошечный веер и перо экзотической птицы

# ---------------- 4-й круг ----------------
arcane-eye:
  text: |-
    В пределах дистанции появляется невидимый парящий глаз. Вы мысленно видите через него, в том числе в темноте на 30 фт. Действием вы перемещаете глаз на 30 фт в любом направлении; он проходит в щели не меньше дюйма, но не сквозь сплошные преграды.
  material: немного шерсти летучей мыши
banishment:
  text: |-
    Вы пытаетесь изгнать существо, которое видите. Оно совершает спасбросок Харизмы и при провале исчезает в безвредный карман иного плана, где недееспособно. Если цель родом с иного плана и заклинание продержится минуту, она не вернётся; иначе по окончании заклинания цель возвращается в прежнее место.
  higher: |-
    За каждый круг ячейки выше 4-го — ещё одна цель.
  material: вещь, отвратительная для цели
black-tentacles:
  text: |-
    В квадрате 20 фт извиваются чёрные щупальца; область труднопроходима. Существо, впервые за ход входящее туда или начинающее там ход, совершает спасбросок Ловкости: при провале 3к6 дробящего урона и опутано. Опутанное существо в начале своего хода снова получает 3к6 урона и может действием вырваться проверкой Силы или Ловкости против вашей сложности.
  material: щупальце гигантского осьминога или гигантского кальмара
blight:
  text: |-
    Некромантическая энергия вытягивает влагу и жизнь из существа, которое вы видите. Цель совершает спасбросок Телосложения: при провале 8к8 урона некротической энергией, при успехе половину. На нежить и конструктов не действует. Растительные существа совершают спасбросок с помехой и получают максимальный урон; немагическое растение просто засыхает.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 4-го.
compulsion:
  text: |-
    Существа по вашему выбору в пределах дистанции, которые вас слышат, совершают спасбросок Мудрости. До окончания заклинания бонусным действием вы указываете направление, и каждая провалившая цель в свой ход тратит всё перемещение, чтобы двигаться туда самым безопасным путём. После перемещения цель повторяет спасбросок.
confusion:
  text: |-
    Существа в сфере радиусом 10 фт совершают спасбросок Мудрости. Провалившие до окончания заклинания в начале каждого хода бросают к10: 1 — бредут в случайную сторону; 2–6 — стоят и ничего не делают; 7–8 — атакуют случайное существо рядом; 9–10 — действуют как хотят. В конце хода цель повторяет спасбросок.
  higher: |-
    +5 фт к радиусу за каждый круг ячейки выше 4-го.
  material: три ореховые скорлупки
conjure-minor-elementals:
  text: |-
    Вы призываете элементалей в свободные места в пределах дистанции: одного с опасностью до 2, двух — до 1, четырёх — до 1/2 или восьми — до 1/4. Они дружественны вам и вашим спутникам и подчиняются мысленным приказам. Исчезают, когда падают до 0 хитов или заканчивается заклинание.
  higher: |-
    На ячейке 6-го круга — вдвое больше существ, 8-го — втрое.
conjure-woodland-beings:
  text: |-
    Вы призываете фей в свободные места в пределах дистанции: одну с опасностью до 2, двух — до 1, четырёх — до 1/2 или восьми — до 1/4. Они дружественны вам и вашим спутникам и подчиняются мысленным приказам. Исчезают, когда падают до 0 хитов или заканчивается заклинание.
  higher: |-
    На ячейке 6-го круга — вдвое больше существ, 8-го — втрое.
  material: одна ягода остролиста на каждое существо
control-water:
  text: |-
    Вы управляете стоячей или текущей водой в кубе до 100 фт. Действием в каждом ходу вы выбираете эффект: наводнение (уровень воды поднимается на 20 фт), расступление (вода расходится, открывая проход), перенаправление течения или водоворот, втягивающий существ и наносящий им 2к8 дробящего урона.
  material: капля воды и щепотка пыли
death-ward:
  text: |-
    Вы касаетесь существа и даруете защиту от смерти. Первый раз, когда до окончания заклинания хиты цели упали бы до 0 от урона, у неё остаётся 1 хит, и заклинание заканчивается. Если эффект убил бы цель мгновенно, не нанося урона, он не срабатывает, и заклинание тоже заканчивается.
dimension-door:
  text: |-
    Вы телепортируетесь в любое место в пределах 500 фт — видимое или описанное направлением и расстоянием. Можно взять с собой одно согласное существо своего размера или меньше, которого вы касаетесь. Если место занято, вы оба получаете 4к6 силового урона, и телепортация не происходит.
divination:
  text: |-
    Ваше гадание связывает вас с божеством или слугой силы. Вы задаёте один вопрос о конкретной цели, событии или деле в ближайшие 7 дней и получаете правдивый ответ — короткую фразу, загадку или знамение. Повторные гадания до продолжительного отдыха могут дать случайный ответ.
  material: благовония и подношение, подобающее вашей вере, стоимостью не меньше 25 зм, расходуются
dominate-beast:
  text: |-
    Зверь в пределах дистанции совершает спасбросок Мудрости (с преимуществом, если вы или спутники с ним сражаетесь) и при провале очарован на время заклинания. Пока вы на одном плане, вы мысленно отдаёте ему общие приказы, а действием можете полностью управлять им до конца следующего хода. Всякий раз, получив урон, зверь повторяет спасбросок.
  higher: |-
    На ячейке 5-го круга — до 10 минут, 6-го — до часа, 7-го и выше — до 8 часов.
fabricate:
  text: |-
    Вы превращаете сырьё в изделия из того же материала: брёвна — в мост, лён — в одежду, пеньку — в верёвку. Объём — до куба 10 фт (или куба 5 фт для минералов). Качество соответствует материалу; сложное оружие, доспехи и тонкие изделия требуют владения нужными инструментами.
faithful-hound:
  text: |-
    Вы призываете невидимого для всех, кроме вас, призрачного сторожевого пса. Он не двигается и лает, когда в пределах 30 фт появляется существо, не названное вами. В начале каждого вашего хода пёс кусает врага в пределах 5 фт от себя: атака +(ваш бонус атаки заклинаниями), при попадании 4к8 колющего урона. Пёс видит невидимое и Эфирный План.
  material: крошечный серебряный свисток, кусочек кости и нить
fire-shield:
  text: |-
    Ваше тело окутывает тонкое пламя — тёплое (сопротивление холоду) или холодное (сопротивление огню). Каждый раз, когда существо в пределах 5 фт попадает по вам рукопашной атакой, щит вспыхивает, и нападавший получает 2к8 урона огнём (тёплый щит) или холодом (холодный).
  material: кусочек фосфора или светлячок
freedom-of-movement:
  text: |-
    Согласное существо, которого вы касаетесь, до окончания заклинания не подвержено труднопроходимой местности, а заклинания и магия не могут уменьшить его скорость, парализовать или опутать. Оно может 5 фт перемещения освободиться из немагических пут или захвата и двигаться под водой без штрафов.
  material: кожаный ремешок, обёрнутый вокруг руки
giant-insect:
  text: |-
    Вы превращаете до десяти многоножек, трёх пауков, пяти ос или одного скорпиона в гигантские версии. Они подчиняются вашим мысленным приказам и дружественны вам. Когда заклинание заканчивается или существо падает до 0 хитов, оно становится прежним.
greater-invisibility:
  text: |-
    Существо, которого вы касаетесь, становится невидимым до окончания заклинания вместе со всем, что несёт. В отличие от обычной невидимости, заклинание не заканчивается, когда цель атакует или творит заклинания.
guardian-of-faith:
  text: |-
    В свободном месте появляется призрачный страж огромного размера. Враждебное вам существо, впервые за ход приблизившееся к стражу на 10 фт, совершает спасбросок Ловкости: при провале 20 урона излучением, при успехе половину. Страж исчезает, нанеся в сумме 60 урона.
hallucinatory-terrain:
  text: |-
    Природная местность в кубе 150 фт выглядит, звучит и пахнет как другая: поле — как лес, тропа — как болото. Постройки, снаряжение и существа не меняются. Касание не развеивает иллюзию; существо, заметившее её, может распознать обман проверкой Интеллекта (Анализ) против вашей сложности. Сотворение занимает 10 минут.
  material: камень, веточка и кусочек зелёного растения
ice-storm:
  text: |-
    На цилиндр радиусом 20 фт и высотой 40 фт обрушивается град. Каждое существо в нём совершает спасбросок Ловкости: при провале 2к8 дробящего урона и 4к6 урона холодом, при успехе половину. До конца вашего следующего хода земля в области труднопроходима.
  higher: |-
    +1к8 дробящего урона за каждый круг ячейки выше 4-го.
  material: щепотка пыли и несколько капель воды
locate-creature:
  text: |-
    Опишите или назовите знакомое вам существо. До окончания заклинания вы чувствуете направление на него, если оно в пределах 1000 фт. Можно искать ближайшее существо определённого вида, если вы видели такое вблизи. Текущая вода шириной от 10 фт блокирует заклинание.
  material: клочок шерсти ищейки
phantasmal-killer:
  text: |-
    Вы вплетаете в разум существа образ его худшего страха, видимый только ему. Цель совершает спасбросок Мудрости и при провале испугана до окончания заклинания. В конце каждого своего хода цель повторяет спасбросок: при провале получает 4к10 урона психической энергией, при успехе заклинание заканчивается.
  higher: |-
    +1к10 урона за каждый круг ячейки выше 4-го.
polymorph:
  text: |-
    Существо, которое вы видите, превращается в зверя с опасностью не выше своей (или своего уровня). Несогласная цель спасается Мудростью; перевёртыши и существа с 0 хитов неподвластны. Цель получает хиты, характеристики и умения зверя, сохраняя мировоззрение и личность. Урон сверх хитов зверя переходит на исходную форму, когда зверь падает до 0.
  material: кокон гусеницы
private-sanctum:
  text: |-
    Вы защищаете область до куба 100 фт: на выбор, звук не проходит сквозь границы, область темна и туманна снаружи, датчики прорицания не проникают внутрь, существа не могут телепортироваться внутрь и наружу, а межпланарные путешествия в ней запрещены. Сотворение занимает 10 минут; если творить ежедневно год, эффект становится постоянным.
  higher: |-
    Сторона куба увеличивается на 100 фт за каждый круг ячейки выше 4-го.
  material: тонкий лист свинца, кусочек мутного стекла, вата и хризолитовая пыль
resilient-sphere:
  text: |-
    Существо или предмет среднего размера и меньше заключается в мерцающую сферу силы; несогласная цель может спастись Ловкостью. Ничто — ни существа, ни атаки, ни заклинания — не проходит сквозь сферу ни внутрь, ни наружу. Заключённое существо может действием толкать сферу, перекатывая её с половинной скоростью. «Распад» уничтожает сферу.
  material: полусфера из прозрачного хрусталя и такая же полусфера из гуммиарабика
secret-chest:
  text: |-
    Вы прячете сундук со всем содержимым на Эфирном Плане, оставляя себе крошечную копию. Пока копия у вас, действием вы можете вернуть сундук к себе. Через 60 дней связь может оборваться.
  material: изящный сундук стоимостью не меньше 5000 зм и его крошечная копия стоимостью 50 зм
stone-shape:
  text: |-
    Вы касаетесь каменного предмета или участка камня не больше 5 фт в любом измерении и придаёте ему любую форму: оружие, фигуру, сундук, проход в стене. Можно создать простые двери или засовы, но не сложные механизмы.
  material: мягкая глина, которой придают примерную форму будущего предмета
stoneskin:
  text: |-
    Плоть согласного существа, которого вы касаетесь, до окончания заклинания становится твёрдой, как камень. Цель получает сопротивление немагическому дробящему, колющему и рубящему урону.
  material: алмазная пыль стоимостью 100 зм, расходуется
wall-of-fire:
  text: |-
    Вы создаёте стену огня на твёрдой поверхности — прямую до 60 фт длиной, 20 фт высотой и 1 фут толщиной или кольцо диаметром до 20 фт. Существа в области стены при её появлении совершают спасбросок Ловкости: при провале 5к8 урона огнём, при успехе половину. Выбранная сторона стены жжёт: существо, заканчивающее ход в пределах 10 фт от неё или внутри, получает 5к8 урона огнём.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 4-го.
  material: небольшой кусочек фосфора

# ---------------- 5-й круг ----------------
animate-objects:
  text: |-
    До десяти немагических предметов в пределах дистанции, которые никто не несёт, оживают и становятся вашими слугами (крупный предмет считается за несколько). Бонусным действием вы отдаёте мысленные приказы всем оживлённым в пределах 500 фт. Предметы атакуют и наносят урон в зависимости от размера.
  higher: |-
    За каждый круг ячейки выше 5-го — ещё два предмета.
antilife-shell:
  text: |-
    Вокруг вас встаёт мерцающий барьер радиусом 10 фт, движущийся с вами. Он не пропускает живых существ, кроме нежити и конструктов. Существа могут атаковать и творить заклинания сквозь барьер, но не пройти его. Если вы толкаете барьер на существо, заклинание заканчивается.
arcane-hand:
  text: |-
    Вы создаёте огромную светящуюся руку силы. У неё КД 20 и хиты, равные вашему максимуму. Бонусным действием вы перемещаете её на 60 фт и выбираете эффект: сжатый кулак (атака заклинанием, 4к8 урона силовым полем), силовая ладонь (толкает существо), хватка (захватывает и сдавливает) или заслон (укрытие между вами и врагом).
  higher: |-
    Урон кулака +2к8, урон хватки +2к6 за каждый круг ячейки выше 5-го.
  material: яичная скорлупа и перчатка из змеиной кожи
awaken:
  text: |-
    За 8 часов вы наделяете разумом зверя или растение огромного размера и меньше: Интеллект становится 10, существо учит один известный вам язык. Пробуждённое растение получает возможность двигаться и чувствовать. Цель очарована вами 30 дней или пока вы ей не навредите, а затем сама решает, остаться ли с вами.
  material: агат стоимостью не меньше 1000 зм, расходуется
cloudkill:
  text: |-
    Вы создаёте сферу ядовитого жёлто-зелёного тумана радиусом 20 фт; область сильно заслонена. Существо, впервые за ход входящее в неё или начинающее там ход, совершает спасбросок Телосложения: при провале 5к8 урона ядом, при успехе половину. Туман стелется по земле и в начале каждого вашего хода отползает на 10 фт от вас.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 5-го.
commune:
  text: |-
    Вы связываетесь со своим божеством или его посланником и задаёте до трёх вопросов, на которые можно ответить «да» или «нет». Ответы правдивы; если вопрос непонятен, ответ может быть «неясно». Повторные обращения до продолжительного отдыха могут не получить ответа.
  material: благовония и флакон святой или нечестивой воды
commune-with-nature:
  text: |-
    На краткий миг вы становитесь частью природы и узнаёте о местности в радиусе 3 миль (в подземельях — 300 фт): до трёх фактов на выбор — о воде, растениях, зверях, минералах, поселениях, сильной магии или существах неестественного происхождения.
cone-of-cold:
  text: |-
    С ваших рук срывается ледяной вихрь. Каждое существо в конусе 60 фт совершает спасбросок Телосложения: при провале 8к8 урона холодом, при успехе половину. Существо, убитое этим заклинанием, превращается в ледяную статую.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 5-го.
  material: маленький хрустальный или стеклянный конус
conjure-elemental:
  text: |-
    Вы призываете элементаля с опасностью до 5 из куба 10 фт воздуха, земли, огня или воды. Он дружественен вам и подчиняется, пока вы держите концентрацию. Если концентрация прервётся, элементаль станет враждебным и останется на время действия заклинания.
  higher: |-
    Опасность элементаля растёт на 1 за каждый круг ячейки выше 5-го.
  material: горящие благовония для воздуха, мягкая глина для земли, сера и фосфор для огня, вода и песок для воды
contact-other-plane:
  text: |-
    Вы мысленно обращаетесь к сущности иного плана и задаёте до пяти вопросов. Сначала совершите спасбросок Интеллекта со сложностью 15: при провале вы получаете 6к6 урона психической энергией и становитесь безумным до продолжительного отдыха. Ответы — одно слово: «да», «нет», «возможно», «никогда», «неважно» или «неясно».
contagion:
  text: |-
    Ваше касание разносит болезнь. Совершите рукопашную атаку заклинанием: при попадании цель отравлена. В конце каждого своего хода она спасается Телосложением; после трёх провалов подряд болезнь овладевает ею на 7 дней, после трёх успехов — отступает. Болезнь выбирается из списка: ослепляющая, трясучка, гниение плоти, мозговая лихорадка и другие.
creation:
  text: |-
    Вы вытягиваете из Царства Теней материю и создаёте немагический предмет из растительного материала или минерала объёмом до куба 5 фт. Чем прочнее материал, тем короче он держится: растения — сутки, камень — 12 часов, драгоценные металлы — час, самоцветы — 10 минут. Созданное нельзя использовать как материальный компонент.
  higher: |-
    Сторона куба увеличивается на 5 фт за каждый круг ячейки выше 5-го.
  material: крошечный кусочек материала того типа, который вы создаёте
dispel-evil-and-good:
  text: |-
    Вас окутывает мерцающая энергия. До окончания заклинания небожители, элементали, феи, исчадия и нежить атакуют вас с помехой. Можно закончить заклинание досрочно: снять с существа очарование, испуг или одержимость такими созданиями или изгнать одно из них на родной план (спасбросок Харизмы).
  material: святая вода или порошок серебра и железа
dominate-person:
  text: |-
    Гуманоид в пределах дистанции совершает спасбросок Мудрости (с преимуществом, если вы или спутники с ним сражаетесь) и при провале очарован на время заклинания. Вы мысленно отдаёте ему приказы, а действием можете полностью управлять им до конца следующего хода. Всякий раз, получив урон, цель повторяет спасбросок.
  higher: |-
    На ячейке 6-го круга — до 10 минут, 7-го — до часа, 8-го и выше — до 8 часов.
dream:
  text: |-
    Вы или согласное существо входите в сон знакомого существа на том же плане и говорите с ним. Если цель не спит, посланник ждёт, пока она уснёт. Можно сделать сон кошмаром: цель спасается Мудростью, а при провале не получает пользы от отдыха и получает 3к6 урона психической энергией при пробуждении.
  material: горсть песка, капля чернил и перо из спящей птицы
flame-strike:
  text: |-
    С неба в выбранную точку обрушивается столп божественного огня — цилиндр радиусом 10 фт и высотой 40 фт. Каждое существо в нём совершает спасбросок Ловкости: при провале 4к6 урона огнём и 4к6 урона излучением, при успехе половину.
  higher: |-
    +1к6 урона огнём или излучением за каждый круг ячейки выше 5-го.
  material: щепотка серы
geas:
  text: |-
    Вы налагаете магический приказ на существо, которое вас понимает. Оно совершает спасбросок Мудрости и при провале очаровано на 30 дней: оно должно выполнять поручение или воздерживаться от действия. Всякий раз, поступая против приказа, цель получает 5к10 урона психической энергией (не чаще раза в день).
  higher: |-
    На ячейке 7-го или 8-го круга — год, 9-го — до снятия.
greater-restoration:
  text: |-
    Вы касаетесь существа и снимаете одно из ослабляющих воздействий: истощение на одну ступень, очарование или окаменение, одно проклятие, уменьшение характеристики или уменьшение максимума хитов.
  material: алмазная пыль стоимостью не меньше 100 зм, расходуется
hallow:
  text: |-
    Вы освящаете место радиусом до 60 фт за 24 часа. Небожители, элементали, феи, исчадия и нежить не могут войти в область, очаровывать, пугать или вселяться в существ внутри. Дополнительно вы привязываете к месту один эффект: бесстрашие, тьму, свет, защиту от вида урона, уязвимость, тишину, язык или помеху существам определённого рода.
  material: травы, масла и благовония стоимостью не меньше 1000 зм, расходуются
hold-monster:
  text: |-
    Существо в пределах дистанции, которое вы видите, совершает спасбросок Мудрости и при провале парализовано до окончания заклинания. На нежить не действует. В конце каждого своего хода цель повторяет спасбросок и при успехе освобождается.
  higher: |-
    За каждый круг ячейки выше 5-го — ещё одна цель; цели не дальше 30 фт друг от друга.
  material: маленький прямой кусочек железа
insect-plague:
  text: |-
    Рой кусачей саранчи заполняет сферу радиусом 20 фт; область слабо заслонена и труднопроходима. Существо, впервые за ход входящее в неё или начинающее там ход, совершает спасбросок Телосложения: при провале 4к10 колющего урона, при успехе половину.
  higher: |-
    +1к10 урона за каждый круг ячейки выше 5-го.
  material: несколько крупинок сахара, зёрна и капля жира
legend-lore:
  text: |-
    Назовите или опишите знаменитое существо, место или предмет. В вашем разуме всплывают сведения о нём — предания, забытые слухи, старые песни. Чем легендарнее цель и чем больше вы знаете, тем точнее и полнее сведения.
  material: благовония стоимостью не меньше 250 зм и четыре костяные пластинки стоимостью 50 зм каждая, благовония расходуются
mass-cure-wounds:
  text: |-
    Волна целительной силы расходится из точки в пределах дистанции. До шести существ в сфере радиусом 30 фт восстанавливают хиты: каждое 3к8 + модификатор вашей заклинательной характеристики. На нежить и конструктов не действует.
  higher: |-
    +1к8 за каждый круг ячейки выше 5-го.
mislead:
  text: |-
    Вы становитесь невидимым, а на вашем месте появляется иллюзорный двойник. До окончания заклинания он двигается и говорит по вашей воле, а вы можете бонусным действием переключаться на его зрение и слух. Невидимость пропадает, если вы атакуете или творите заклинание.
modify-memory:
  text: |-
    Вы пытаетесь переделать воспоминания существа. Оно совершает спасбросок Мудрости (с преимуществом, если вы сражаетесь с ним) и при провале очаровано. Пока заклинание действует, вы можете изменить или стереть его воспоминания о событии последних 24 часов длительностью до 10 минут. Бессмысленные изменения цель отбросит как сон.
  higher: |-
    Можно менять более давние воспоминания: 6-й круг — до 7 дней, 7-й — до 30 дней, 8-й — до года, 9-й — любые.
  material: заряд вещества воспоминаний
passwall:
  text: |-
    На деревянной, каменной или оштукатуренной поверхности в пределах дистанции открывается проход шириной 5 фт, высотой 8 фт и глубиной до 20 фт. Когда заклинание заканчивается, существа и предметы внутри безопасно выталкиваются наружу.
  material: щепотка кунжута
planar-binding:
  text: |-
    Вы пытаетесь связать небожителя, элементаля, фею или исчадие, находящееся в пределах дистанции на протяжении всего часового сотворения. Цель совершает спасбросок Харизмы и при провале служит вам 24 часа, выполняя ваши приказы.
  higher: |-
    На ячейке 6-го круга — 10 дней, 7-го — 30 дней, 8-го — 180 дней, 9-го — год и день.
  material: драгоценный камень стоимостью не меньше 1000 зм, расходуется
raise-dead:
  text: |-
    Вы возвращаете к жизни существо, умершее не больше 10 дней назад, если его душа согласна и свободна. Оно возвращается с 1 хитом; заклинание нейтрализует яды и немагические болезни, но не возвращает утраченные части тела. Вернувшийся получает −4 к броскам атаки, спасброскам и проверкам; штраф уменьшается на 1 после каждого продолжительного отдыха. Сотворение занимает час.
  material: алмаз стоимостью не меньше 500 зм, расходуется
reincarnate:
  text: |-
    Вы касаетесь мёртвого гуманоида или его останков, умершего не больше 10 дней назад. Если душа согласна, для неё создаётся новое взрослое тело — случайного народа. Существо сохраняет разум, воспоминания и умения, но получает новые физические черты. Сотворение занимает час.
  material: редкие масла и притирания стоимостью не меньше 1000 зм, расходуются
scrying:
  text: |-
    Вы видите и слышите выбранное существо на том же плане. Оно совершает спасбросок Мудрости с модификатором, зависящим от того, насколько хорошо вы его знаете и какая у вас с ним связь. При провале в пределах 10 фт от цели появляется невидимый датчик, следующий за ней. Можно наблюдать и за знакомым местом. Сотворение занимает 10 минут.
  material: фокусировка стоимостью не меньше 1000 зм — хрустальный шар, серебряное зеркало или купель святой воды
seeming:
  text: |-
    Вы меняете облик любого числа существ в пределах дистанции, которых видите: одежду, доспехи, черты, голос. Несогласная цель спасается Харизмой. Иллюзия не выдерживает касания; существо, потратившее действие на осмотр, распознаёт её проверкой Интеллекта (Анализ) против вашей сложности.
telekinesis:
  text: |-
    Вы силой мысли двигаете существ и предметы. Действием в каждом ходу выберите цель в пределах дистанции. Существо огромного размера и меньше: состязание вашей заклинательной характеристики против его Силы, при победе вы перемещаете его на 30 фт и держите опутанным. Предмет до 1000 фунтов: перемещаете на 30 фт или тонко им управляете.
telepathic-bond:
  text: |-
    Вы связываете до восьми согласных существ телепатической связью. До окончания заклинания они могут мысленно общаться друг с другом на любом расстоянии в пределах плана, даже не зная общего языка.
  material: скорлупки двух разных видов яиц
teleportation-circle:
  text: |-
    Вы чертите на земле круг из рун и открываете в нём портал к постоянному кругу телепортации, чьи знаки вы знаете, на том же плане. Портал держится до конца вашего следующего хода; любое существо, вошедшее в него, мгновенно оказывается у назначения. Сотворение занимает минуту; если творить в одном месте ежедневно год, круг становится постоянным.
  material: редкие мелки и чернила с драгоценными камнями стоимостью 50 зм, расходуются
tree-stride:
  text: |-
    Вы можете входить в дерево и выходить из другого дерева той же породы в пределах 500 фт. Оба дерева должны быть живыми и не меньше вас. Один переход стоит 5 фт перемещения. До окончания заклинания так можно перемещаться раз в ход.
wall-of-force:
  text: |-
    Вы создаёте невидимую стену силы — плоскость из десяти панелей 10×10 фт или купол радиусом до 10 фт. Ничто физическое не проходит сквозь стену, она невосприимчива к урону и не рассеивается «Рассеиванием магии»; её уничтожает только «Распад». Стена проникает и на Эфирный План.
  material: щепотка порошка прозрачного самоцвета
wall-of-stone:
  text: |-
    Из земли поднимается каменная стена толщиной 6 дюймов из десяти панелей 10×10 фт. Существа в её области при появлении спасаются Ловкостью, чтобы оказаться с выбранной стороны. Если продержать концентрацию всё время действия, стена становится постоянной. Каждая панель — КД 15 и 30 хитов на дюйм толщины.
  material: небольшой каменный блок

# ---------------- 6-й круг ----------------
blade-barrier:
  text: |-
    Вы создаёте вертикальную стену из вращающихся лезвий — прямую до 100 фт длиной или кольцо диаметром до 60 фт, высотой 20 фт и толщиной 5 фт. Она даёт укрытие на три четверти, область труднопроходима. Существо, впервые за ход входящее в стену или начинающее там ход, совершает спасбросок Ловкости: при провале 6к10 рубящего урона, при успехе половину.
chain-lightning:
  text: |-
    Молния бьёт в цель в пределах дистанции, а затем перескакивает ещё в три цели, каждая в пределах 30 фт от первой. Каждая цель совершает спасбросок Ловкости: при провале 10к8 урона электричеством, при успехе половину.
  higher: |-
    За каждый круг ячейки выше 6-го — ещё один прыжок молнии.
  material: клочок меха, кусочек янтаря, стекла или хрусталя и три серебряные булавки
circle-of-death:
  text: |-
    Из выбранной точки расходится сфера отрицательной энергии радиусом 60 фт. Каждое существо в ней совершает спасбросок Телосложения: при провале 8к6 урона некротической энергией, при успехе половину.
  higher: |-
    +2к6 урона за каждый круг ячейки выше 6-го.
  material: порошок толчёной чёрной жемчужины стоимостью не меньше 500 зм
conjure-fey:
  text: |-
    Вы призываете фею с опасностью до 6 или духа в облике зверя. Она дружественна вам и подчиняется, пока вы держите концентрацию. Если концентрация прервётся, фея станет враждебной и останется на время действия заклинания.
  higher: |-
    Опасность растёт на 1 за каждый круг ячейки выше 6-го.
contingency:
  text: |-
    Вы связываете с собой заклинание 5-го круга и ниже, которое можно сотворить на себя, и задаёте условие. Когда условие наступает, вложенное заклинание срабатывает мгновенно. Одновременно может действовать только одно такое условие. Сотворение занимает 10 минут.
  material: ваша статуэтка из слоновой кости стоимостью не меньше 1500 зм
create-undead:
  text: |-
    Ночью вы превращаете до трёх трупов средних или малых гуманоидов в упырей. Бонусным действием вы мысленно приказываете любому созданию в пределах 120 фт. Контроль держится 24 часа; чтобы продлить его, творите заклинание снова.
  higher: |-
    7-й круг — четыре упыря, 8-й — пять упырей или два вурдалака либо мумии, 9-й — шесть или три.
  material: глиняный горшок с кладбищенской землёй, солёной водой и чёрный оникс на каждый труп стоимостью 150 зм
disintegrate:
  text: |-
    Из вашего пальца бьёт тонкий зелёный луч. Цель совершает спасбросок Ловкости и при провале получает 10к6 + 40 урона силовым полем. Цель, упавшая до 0 хитов, распадается в пыль вместе со всем, что на ней было, кроме магических предметов. Луч мгновенно уничтожает крупный или меньший немагический предмет или участок 10×10 фт силового поля.
  higher: |-
    +3к6 урона за каждый круг ячейки выше 6-го.
  material: магнит и щепотка пыли
eyebite:
  text: |-
    До окончания заклинания ваши глаза становятся чёрными провалами. При сотворении и затем действием в каждом ходу выберите существо в пределах 60 фт, которое видите: оно спасается Мудростью, а при провале засыпает, в панике бежит от вас или болеет — помеха на атаки и проверки.
find-the-path:
  text: |-
    Вы чувствуете самый прямой путь к названному месту, известному вам, на том же плане. До окончания заклинания вы знаете, сколько до него осталось и куда идти, в том числе на каждой развилке.
  material: гадальные принадлежности стоимостью не меньше 100 зм и предмет из места назначения
flesh-to-stone:
  text: |-
    Вы пытаетесь обратить существо в камень. Цель совершает спасбросок Телосложения и при провале опутана, а плоть начинает каменеть. В конце каждого своего хода цель повторяет спасбросок: три провала — окаменение, три успеха — избавление. Если продержать концентрацию всё время, окаменение становится постоянным.
  material: щепотка извести, вода и земля
forbiddance:
  text: |-
    Вы ограждаете область до 40 000 квадратных фут от магических перемещений: в неё нельзя телепортироваться и проходить межпланарными путями. Выберите типы существ — небожителей, элементалей, фей, исчадий, нежить; такие существа, впервые за ход входя в область или начиная там ход, получают 5к10 урона излучением или некротической энергией. Если творить ежедневно 30 дней, эффект становится постоянным.
  material: брызги святой воды, редкие благовония и толчёный рубин стоимостью не меньше 1000 зм
freezing-sphere:
  text: |-
    Вы бросаете шар ледяной энергии, и он взрывается в выбранной точке. Каждое существо в сфере радиусом 60 фт совершает спасбросок Телосложения: при провале 10к6 урона холодом, при успехе половину. Попав в воду, шар замораживает её. Можно задержать шар в руке и метнуть позже.
  higher: |-
    +1к6 урона за каждый круг ячейки выше 6-го.
  material: маленькая хрустальная сфера
globe-of-invulnerability:
  text: |-
    Вокруг вас встаёт неподвижный мерцающий барьер радиусом 10 фт. Заклинания 5-го круга и ниже, сотворённые снаружи, не действуют на существ и предметы внутри. Изнутри колдовать можно.
  higher: |-
    Барьер останавливает заклинания на круг выше за каждый круг ячейки выше 6-го.
  material: стеклянная или хрустальная бусина, которая раскалывается по окончании
guards-and-wards:
  text: |-
    Вы ограждаете здание площадью до 2500 квадратных фут: коридоры заполняет туман, двери запечатаны, лестницы опутаны паутиной, на развилках путники теряют направление. Можно добавить эффекты: танцующие огни, волшебный рот, облако вони, порыв ветра, внушение. Действует 24 часа; ежедневно год — постоянно.
  material: горящие благовония, щепотка серы и масла, узелковая верёвка, кровь бурой гиены и серебряный жезл стоимостью не меньше 10 зм
harm:
  text: |-
    Вы насылаете на существо болезнь. Цель совершает спасбросок Телосложения: при провале 14к6 урона некротической энергией, при успехе половину. Урон не может опустить хиты цели ниже 1. При провале её максимум хитов уменьшается на столько же на 1 час.
heal:
  text: |-
    Существо, которое вы видите, восстанавливает 70 хитов. Заклинание также снимает слепоту, глухоту и все болезни. На нежить и конструктов не действует.
  higher: |-
    +10 хитов за каждый круг ячейки выше 6-го.
heroes-feast:
  text: |-
    Вы накрываете пир для двенадцати существ; трапеза длится час. После неё каждый участник излечивается от болезней и ядов, получает невосприимчивость к яду и испугу, преимущество на спасброски Мудрости, а его максимум и текущие хиты увеличиваются на 2к10 на 24 часа.
  material: инкрустированная самоцветами чаша стоимостью не меньше 1000 зм, расходуется
instant-summons:
  text: |-
    Вы отмечаете предмет весом до 10 фунтов невидимым знаком и раскалываете сапфир. Позже, раздавив сапфир и назвав предмет, вы мгновенно получаете его в руку, где бы он ни был на том же плане. Если предмет у другого существа, вы узнаёте, кто его держит и где.
  material: сапфир стоимостью 1000 зм
irresistible-dance:
  text: |-
    Существо в пределах дистанции, которое вы видите, начинает комично плясать до окончания заклинания. Пока оно танцует, оно тратит всё перемещение на пляску, атакует с помехой и спасается Ловкостью с помехой, а атаки по нему совершаются с преимуществом. Действием цель спасается Мудростью, чтобы вернуть контроль.
magic-jar:
  text: |-
    Ваше тело впадает в оцепенение, а душа переходит в сосуд — драгоценный камень, кристалл или реликварий. Из сосуда вы можете попытаться вселиться в гуманоида в пределах 100 фт (спасбросок Харизмы). Захватив тело, вы используете его характеристики, сохраняя свой Интеллект, Мудрость и Харизму.
  material: самоцвет, кристалл или реликварий стоимостью не меньше 500 зм
mass-suggestion:
  text: |-
    Вы внушаете план действий до двенадцати существам, которые вас слышат и понимают. Каждая цель совершает спасбросок Мудрости и при провале следует внушению до 24 часов. Явно самоубийственные внушения не действуют.
  higher: |-
    7-й круг — 10 дней, 8-й — 30 дней, 9-й — год и день.
  material: язык змеи и соты или капля сладкого масла
move-earth:
  text: |-
    Вы переделываете рельеф в квадрате до 40 фт: поднимаете или опускаете землю, копаете ров, насыпаете вал. Каждые 10 минут действия заклинания вы можете выбрать новый участок. Камень и постройки заклинание не двигает, но они могут сместиться вместе с землёй.
  material: железный клинок и мешочек смеси почв — глины, суглинка и песка
planar-ally:
  text: |-
    Вы просите своё божество или другую силу прислать союзника — небожителя, элементаля или исчадие. Существо появляется и выслушивает просьбу; оно не обязано помогать и ожидает платы — подношений, услуг, золота. Сотворение занимает 10 минут.
programmed-illusion:
  text: |-
    Вы создаёте иллюзию в кубе 30 фт, которая включается при заданном условии: образ предмета, существа или явления со звуком, длящийся до 5 минут. Потом иллюзия затихает до следующего срабатывания. Существо, потратившее действие на осмотр, распознаёт её проверкой Интеллекта (Анализ).
  material: клочок овечьей шерсти и нефритовая пыль стоимостью не меньше 25 зм
sunbeam:
  text: |-
    Из вашей руки бьёт луч яркого света линией длиной 60 фт и шириной 5 фт. Каждое существо в линии совершает спасбросок Телосложения: при провале 6к8 урона излучением и слепнет до вашего следующего хода, при успехе половину без слепоты. Нежить и слизи спасаются с помехой. До окончания заклинания действием можно повторить луч.
  material: увеличительное стекло
transport-via-plants:
  text: |-
    Вы соединяете крупное растение в пределах дистанции с другим растением на любом расстоянии на том же плане, которое видели или касались. До конца вашего следующего хода любое существо может шагнуть в первое растение и выйти из второго, потратив 5 фт перемещения.
true-seeing:
  text: |-
    Согласное существо, которого вы касаетесь, до окончания заклинания получает истинное зрение на 120 фт: видит в любой темноте, видит невидимое, распознаёт иллюзии, видит истинный облик перевёртышей и заглядывает на Эфирный План.
  material: мазь для глаз из грибного порошка, шафрана и жира стоимостью 25 зм, расходуется
wall-of-ice:
  text: |-
    Вы создаёте стену льда толщиной 1 фут из десяти панелей 10×10 фт или купол радиусом до 10 фт. Существа в её области при появлении спасаются Ловкостью: при провале 10к6 урона холодом, при успехе половину. Каждая панель — КД 12 и 30 хитов; разбитая панель оставляет морозный воздух, наносящий 5к6 урона холодом тем, кто сквозь него проходит.
  higher: |-
    Урон при появлении +2к6, урон морозного воздуха +1к6 за каждый круг ячейки выше 6-го.
  material: маленький кусочек кварца
wall-of-thorns:
  text: |-
    Вы создаёте стену из переплетённых колючих ветвей длиной до 60 фт, высотой 10 фт и толщиной 5 фт или кольцо диаметром 20 фт. Она перекрывает обзор. Существа в её области при появлении спасаются Ловкостью: при провале 7к8 колющего урона, при успехе половину. Пробираться сквозь стену очень медленно, и каждый раз, впервые за ход входя в неё, существо получает тот же урон.
  higher: |-
    +1к8 урона за каждый круг ячейки выше 6-го.
  material: горсть шипов
wind-walk:
  text: |-
    Вы и до десяти согласных существ превращаетесь в облака, похожие на пар. В облике облака скорость полёта 300 фт, сопротивление немагическому урону; атаковать и колдовать нельзя. Обратное превращение занимает минуту, во время которой существо недееспособно.
  material: огонь и святая вода
word-of-recall:
  text: |-
    Вы и до пяти согласных существ в пределах 5 фт мгновенно переноситесь в заранее освящённое вами святилище. Для этого нужно сначала подготовить святилище, сотворив там заклинание.

# ---------------- 7-й круг ----------------
arcane-sword:
  text: |-
    Вы создаёте парящий меч силы в пределах дистанции. При сотворении и затем бонусным действием в каждом ходу вы перемещаете меч на 20 фт и совершаете им рукопашную атаку заклинанием по существу в пределах 5 фт от него: при попадании 3к10 урона силовым полем.
  material: миниатюрный платиновый меч с рукоятью из меди и цинка стоимостью 250 зм
conjure-celestial:
  text: |-
    Вы призываете небожителя с опасностью до 4. Он дружественен вам и вашим спутникам и подчиняется мысленным приказам. Исчезает, когда падает до 0 хитов или заканчивается заклинание.
  higher: |-
    На ячейке 9-го круга — небожитель с опасностью до 5.
delayed-blast-fireball:
  text: |-
    Из пальца вылетает жёлтый луч и сжимается в светящуюся бусину, которая растёт, пока вы держите концентрацию. Когда концентрация заканчивается, бусина взрывается: существа в сфере 20 фт спасаются Ловкостью от 12к6 урона огнём (половина при успехе). Каждый ход, пока бусина цела, урон растёт на 1к6. Коснувшийся бусины может её бросить.
  higher: |-
    +1к6 базового урона за каждый круг ячейки выше 7-го.
  material: крошечный шарик из гуано летучей мыши и серы
divine-word:
  text: |-
    Вы произносите слово силы творения. Каждое выбранное существо, которое вас слышит, спасается Харизмой; при провале эффект зависит от оставшихся хитов: 50 и меньше — оглохло на минуту; 40 и меньше — оглохло и ослепло на 10 минут; 30 и меньше — ослепло, оглохло и ошеломлено на час; 20 и меньше — умирает. Небожители, элементали, феи и исчадия при провале изгоняются на родной план.
etherealness:
  text: |-
    Вы переходите на границу Эфирного Плана, пересекающегося с текущим. На Эфирном Плане вы видите и слышите план, откуда пришли, на 60 фт, в сером мареве. Вы можете проходить сквозь стены и существ того плана, но не можете на них влиять.
  higher: |-
    За каждый круг ячейки выше 7-го — ещё до трёх согласных существ.
finger-of-death:
  text: |-
    Вы направляете отрицательную энергию в существо, которое видите. Цель совершает спасбросок Телосложения: при провале 7к8 + 30 урона некротической энергией, при успехе половину. Гуманоид, убитый этим заклинанием, в начале вашего следующего хода встаёт зомби, навсегда подчинённым вам.
fire-storm:
  text: |-
    Буря ревущего пламени: до десяти кубов по 10 фт, каждый соприкасается хотя бы с одним другим. Каждое существо в области совершает спасбросок Ловкости: при провале 7к10 урона огнём, при успехе половину. Растения в области можно пощадить.
forcecage:
  text: |-
    Вы создаёте неподвижную невидимую клетку силы — решётку кубом 20 фт или сплошной ящик 10 фт. Существо внутри не может выйти немагическим путём; телепортация и межпланарные перемещения требуют спасброска Харизмы. Клетку не рассеять «Рассеиванием магии».
  material: рубиновая пыль стоимостью 1500 зм
magnificent-mansion:
  text: |-
    Вы создаёте вход в межпространственный особняк — роскошный дом с сотней слуг, столами и изысканной пищей на сто человек. Вход мерцает в воздухе и виден только вам. Когда заклинание заканчивается, все внутри оказываются снаружи в свободных местах возле входа.
  material: миниатюрная портальная арка из слоновой кости, кусочек мрамора и серебряная ложечка стоимостью по 5 зм
mirage-arcane:
  text: |-
    Местность в квадрате до мили выглядит, звучит, пахнет и даже ощущается как другая: равнина — горами, болото — дорогой. Иллюзия затрагивает и постройки, но не существ. Существа с истинным зрением видят обман. Действует 10 дней.
plane-shift:
  text: |-
    Вы и до восьми согласных существ, взявшихся за руки, переноситесь на другой план бытия. Можно также попытаться отправить несогласное существо (рукопашная атака заклинанием, затем спасбросок Харизмы).
  material: раздвоенный металлический жезл стоимостью не меньше 250 зм, настроенный на нужный план
prismatic-spray:
  text: |-
    Из вашей руки бьют восемь разноцветных лучей в конусе 60 фт. Каждое существо в конусе спасается Ловкостью и получает эффект случайного луча: красный — огонь, оранжевый — кислота, жёлтый — электричество, зелёный — яд (по 10к6, половина при успехе), синий — холод; индиго — опутывание и окаменение, фиолетовый — слепота и изгнание, восьмой — два луча сразу.
project-image:
  text: |-
    Вы создаёте иллюзорную копию себя в знакомом месте на том же плане. Действием вы видите её глазами и слышите её ушами, говорите через неё. Копия двигается по вашей воле, но не выдерживает касания.
  material: ваша небольшая статуэтка стоимостью не меньше 5 зм
regenerate:
  text: |-
    Вы касаетесь существа. Оно восстанавливает 4к8 + 15 хитов, а до окончания заклинания — ещё 1 хит в начале каждого своего хода. Утраченные части тела отрастают за 2 минуты.
  material: молитвенное колесо и святая вода
resurrection:
  text: |-
    Вы возвращаете к жизни существо, умершее не больше века назад, если его душа согласна и свободна. Оно возвращается со всеми хитами, от ядов и болезней излечено, утраченные части тела восстанавливаются. Вернувшийся получает −4 к броскам атаки, спасброскам и проверкам; штраф уходит по 1 за продолжительный отдых. Сотворение занимает час.
  material: алмаз стоимостью не меньше 1000 зм, расходуется
reverse-gravity:
  text: |-
    Гравитация в цилиндре радиусом 50 фт и высотой 100 фт переворачивается. Все существа и незакреплённые предметы в области падают вверх. Существо может спастись Ловкостью, ухватившись за опору. Когда заклинание заканчивается, всё падает вниз.
  material: магнит и железные опилки
sequester:
  text: |-
    Вы прячете согласное существо или предмет от обнаружения: цель становится невидимой и недоступной для прорицаний. Существо погружается в спячку без старения и нужды в еде и воздухе. Можно задать условие, при котором заклинание заканчивается.
  material: порошок из алмазов, изумрудов, рубинов и сапфиров стоимостью не меньше 5000 зм, расходуется
simulacrum:
  text: |-
    Вы создаёте из снега или льда иллюзорного двойника зверя или гуманоида. Он подчиняется вам, обладает теми же характеристиками, но половиной максимума хитов, не может восстанавливать ячейки и отдыхом не лечится. Одновременно может существовать только один симулякр. Сотворение занимает 12 часов.
  material: снег или лёд, достаточный для копии в натуральную величину, частица цели и толчёный рубин стоимостью 1500 зм
symbol:
  text: |-
    Вы наносите на поверхность вредоносный глиф, срабатывающий при заданном условии. Глиф почти невидим. При срабатывании выбранный эффект действует на существ в сфере 60 фт: смерть, раздор, страх, безнадёжность, безумие, боль, сон или оглушение — каждому свой спасбросок.
  material: ртуть, фосфор и порошок алмаза и опала стоимостью не меньше 1000 зм
teleport:
  text: |-
    Вы и до восьми согласных существ или один предмет мгновенно переноситесь в выбранное место на том же плане. Точность зависит от того, насколько хорошо вы знаете место: при слабом знакомстве можно промахнуться, попасть в похожее место или получить урон при сбое.

# ---------------- 8-й круг ----------------
animal-shapes:
  text: |-
    Вы превращаете любое число согласных существ в пределах дистанции в зверей крупного размера и меньше с опасностью до 4. Действием в последующих ходах вы можете сменить их облик. Урон сверх хитов зверя переходит на исходную форму. Превращённые сохраняют свою личность и разум, но не могут говорить и колдовать.
antimagic-field:
  text: |-
    Вокруг вас встаёт невидимая сфера антимагии радиусом 10 фт. Внутри нельзя творить заклинания, магические предметы становятся обычными, эффекты заклинаний подавлены, призванные существа исчезают на время. Боги и артефакты этому не подвержены.
  material: щепотка порошка железа или железных опилок
antipathy-sympathy:
  text: |-
    Вы делаете существо или предмет отталкивающим (антипатия) или притягательным (симпатия) для выбранного вида существ или мировоззрения. При антипатии такие существа, увидев цель, спасаются Мудростью или испуганы и бегут. При симпатии они стремятся приблизиться к цели. Действует 10 дней.
  material: кусочек квасцов, вымоченный в уксусе, для антипатии или капля мёда для симпатии
clone:
  text: |-
    Вы выращиваете в сосуде инертную копию живого существа. Через 120 дней клон созревает; если оригинал умрёт, его душа переходит в клон — если согласна и свободна. Клон сохраняет память, личность и умения, но не снаряжение.
  material: алмаз стоимостью 1000 зм и кубический дюйм плоти существа, расходуются, и запечатанный сосуд стоимостью 2000 зм
control-weather:
  text: |-
    Вы управляете погодой в радиусе 5 миль в течение 8 часов. Нужно находиться под открытым небом. Вы меняете осадки, температуру и ветер на один шаг за раз; перемена занимает 1к4 × 10 минут.
  material: горящие благовония и немного земли и дерева, смешанные с водой
demiplane:
  text: |-
    На плоской поверхности вы создаёте тёмную дверь, ведущую в пустую полупространственную комнату 30×30×30 фт из дерева или камня. Когда заклинание заканчивается, дверь исчезает, а всё внутри остаётся в полуплане. Каждый раз можно создать новый полуплан или вернуться в прежний.
dominate-monster:
  text: |-
    Существо в пределах дистанции совершает спасбросок Мудрости (с преимуществом, если вы или спутники с ним сражаетесь) и при провале очаровано на время заклинания. Вы мысленно отдаёте ему приказы, а действием можете полностью управлять им до конца следующего хода. Всякий раз, получив урон, цель повторяет спасбросок.
  higher: |-
    На ячейке 9-го круга — до 8 часов.
earthquake:
  text: |-
    Вы вызываете сильное землетрясение в круге радиусом 100 фт. Земля становится труднопроходимой, существа на земле спасаются Ловкостью или падают ничком, концентрация сбивается, в земле открываются трещины. Постройки получают 50 дробящего урона в начале каждого вашего хода и могут обрушиться.
  material: щепотка земли, кусочек камня и комок глины
feeblemind:
  text: |-
    Вы разбиваете разум существа. Цель получает 4к6 урона психической энергией и совершает спасбросок Интеллекта; при провале её Интеллект и Харизма становятся 1. Она не может колдовать, пользоваться магическими предметами, понимать язык и общаться осмысленно. Каждые 30 дней цель повторяет спасбросок.
  material: горсть глиняных, хрустальных, стеклянных или минеральных шариков
glibness:
  text: |-
    До окончания заклинания, совершая проверку Харизмы, вы можете заменить выпавшее на кости значение на 15. Магия, определяющая ложь, показывает, что вы говорите правду.
holy-aura:
  text: |-
    Вас окружает сияние святости в радиусе 30 фт. До окончания заклинания выбранные существа в сиянии совершают спасброски с преимуществом, а атаки по ним — с помехой. Исчадие или нежить, попавшее по такому существу рукопашной атакой, спасается Телосложением или слепнет.
  material: крошечный реликварий стоимостью не меньше 1000 зм со священной реликвией
incendiary-cloud:
  text: |-
    Клубящееся облако дыма и искр заполняет сферу радиусом 20 фт; область сильно заслонена. Существо, впервые за ход входящее в облако или начинающее там ход, спасается Ловкостью: при провале 10к8 урона огнём, при успехе половину. В начале каждого вашего хода облако смещается на 10 фт в выбранном направлении.
maze:
  text: |-
    Вы изгоняете существо в лабиринт полуплана. Цель остаётся там до окончания заклинания или пока не выберется: действием она совершает проверку Интеллекта со сложностью 20. Когда цель выбирается, она возвращается в то место, откуда исчезла.
mind-blank:
  text: |-
    До окончания заклинания согласное существо, которого вы касаетесь, невосприимчиво к психическому урону, чтению мыслей, прорицаниям и очарованию. Даже желание не может узнать о нём ничего.
power-word-stun:
  text: |-
    Вы произносите слово силы, от которого разум существа меркнет. Если у цели 150 хитов или меньше, она ошеломлена; в конце каждого своего хода она спасается Телосложением, чтобы прийти в себя. Иначе заклинание не действует.
sunburst:
  text: |-
    В выбранной точке вспыхивает ослепительный солнечный свет радиусом 60 фт. Каждое существо в нём совершает спасбросок Телосложения: при провале 12к6 урона излучением и слепнет на минуту, при успехе половину урона без слепоты. Нежить и слизи спасаются с помехой. Свет рассеивает магическую тьму.
  material: огонь и кусочек солнечного камня

# ---------------- 9-й круг ----------------
astral-projection:
  text: |-
    Вы и до восьми согласных существ проецируете свои астральные тела на Астральный План, оставляя физические тела в оцепенении. Астральное тело связано с физическим серебряной нитью; если её перерезать, существо умирает.
  material: для каждого участника — гиацинт стоимостью не меньше 1000 зм и серебряный слиток 100 зм
foresight:
  text: |-
    Согласное существо, которого вы касаетесь, получает способность видеть ближайшее будущее. На 8 часов оно не может быть застигнуто врасплох, совершает с преимуществом броски атаки, проверки и спасброски, а атаки по нему — с помехой.
  material: перо колибри
gate:
  text: |-
    Вы открываете портал, соединяющий ваше место с точкой на другом плане бытия. Если назвать существо, портал может притянуть его к вам.
  material: алмаз стоимостью не меньше 5000 зм
imprisonment:
  text: |-
    Вы заключаете существо в магическую темницу: погребение, цепи, крошечную сферу, спячку или камень. Цель спасается Мудростью; при провале она заключена навсегда, пока условие освобождения не будет выполнено.
  material: пергамент с изображением или статуэтка цели и особый компонент в зависимости от темницы стоимостью не меньше 500 зм за каждую кость хитов цели
mass-heal:
  text: |-
    Волна целительной силы восстанавливает до 700 хитов, распределённых между любым числом существ, которых вы видите. Излечиваются также слепота, глухота и все болезни. На нежить и конструктов не действует.
meteor-swarm:
  text: |-
    С неба падают четыре пылающих метеора в выбранные точки. Каждое существо в сфере радиусом 40 фт от каждой точки спасается Ловкостью: при провале 20к6 урона огнём и 20к6 дробящего, при успехе половину. Существо в нескольких сферах получает урон только один раз.
power-word-kill:
  text: |-
    Вы произносите слово силы, которое мгновенно убивает существо, если у него 100 хитов или меньше. Иначе заклинание не действует.
prismatic-wall:
  text: |-
    Вы создаёте мерцающую многоцветную стену или сферу из семи слоёв. Каждый слой отражает свой эффект: огонь, кислота, электричество, яд, холод, окаменение, слепота и изгнание. Каждый слой снимается только особым способом.
shapechange:
  text: |-
    Вы принимаете облик существа с опасностью не выше вашего уровня, которое видели. Вы получаете его характеристики и умения, сохраняя свой разум. Действием можно менять облик до окончания заклинания.
  material: нефритовый обруч стоимостью не меньше 1500 зм
storm-of-vengeance:
  text: |-
    Над вами собирается бурлящая грозовая туча радиусом 360 фт. Каждый раунд она обрушивает новые бедствия: гром и глухоту, кислотный дождь, молнии, град, ледяной ветер.
time-stop:
  text: |-
    Вы на короткое время останавливаете время для всех, кроме себя, и совершаете 1к4 + 1 ходов подряд. Заклинание заканчивается, если вы влияете на другое существо или предмет, который оно несёт.
true-polymorph:
  text: |-
    Вы превращаете существо в другое существо, существо в предмет или предмет в существо. Если держать концентрацию всё время действия, превращение становится постоянным.
  material: капля ртути, кусочек гуммиарабика и струйка дыма
true-resurrection:
  text: |-
    Вы возвращаете к жизни существо, умершее не больше 200 лет назад, от любой причины, кроме старости. Тело восстанавливается полностью, даже если его не осталось.
  material: алмазы стоимостью не меньше 25 000 зм, расходуются
weird:
  text: |-
    Вы вызываете в разумах существ в сфере 30 фт образы их худших страхов. Каждая цель спасается Мудростью; при провале испугана и в конце каждого хода получает 4к10 урона психической энергией, пока не спасётся.
wish:
  text: |-
    Самое могущественное заклинание смертного: повторяет любое заклинание 8-го круга и ниже без компонентов или исполняет желание, которое мастер толкует по-своему. Попытка сотворить что-то сверх повторения заклинания может лишить вас способности творить его снова.
