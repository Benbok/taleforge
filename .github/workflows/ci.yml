name: CI

# Проверки идут параллельными работами: пока тесты на SQLite считаются, рядом идут PostgreSQL, образ и клиент.
# Внутри каждой работы pytest сам запускается в несколько процессов (addopts = -n auto в pyproject.toml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты на SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m app.content validate content/dnd5e-srd --strict

  postgres:
    name: Миграции и тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taleforge
          POSTGRES_PASSWORD: taleforge
          POSTGRES_DB: taleforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taleforge" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://taleforge:taleforge@localhost/taleforge_test
      TEST_DATABASE_URL: postgresql+asyncpg://taleforge:taleforge@localhost/taleforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Миграции
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      # У каждого процесса pytest своя база taleforge_test_gwN, она создаётся сама (tests/conftest.py)
      - run: pytest -q

  image:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t taleforge:ci .

  web:
    name: Клиент
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Тесты клиента
        run: npm test
      - name: Проверка типов и сборка
        run: npm run build
