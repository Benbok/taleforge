<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e232b"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c98a4b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c98a4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a303c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#12161c" stop-opacity="0.85"/>
