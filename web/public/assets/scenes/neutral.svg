  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#torch)"/>
  <!-- Subtle stone vaults and architecture silhouette -->
  <path d="M-50 320 V120 Q150 40 350 120 V320 Z M350 320 V120 Q550 40 750 120 V320 Z M750 320 V120 Q950 40 1150 120 V320 Z" fill="url(#arch)" opacity="0.45"/>
  <path d="M50 320 V160 Q200 100 350 160 V320 Z M450 320 V160 Q600 100 750 160 V320 Z M850 320 V160 Q1000 100 1150 160 V320 Z" fill="#090b0e" opacity="0.6"/>
  <!-- Fine horizontal stone cornice -->
