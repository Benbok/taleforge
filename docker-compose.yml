# Локальный запуск: docker compose up
# С публичной ссылкой для друзей: docker compose --profile tunnel up   (адрес — в логах сервиса tunnel)
# С голосовыми репликами (локальный Whisper на видеокарте NVIDIA): docker compose --profile voice up
#   и STT_API_BASE=http://stt:8000/v1 в .env. Профили складываются: --profile voice --profile tunnel
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taleforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taleforge}
      POSTGRES_DB: taleforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taleforge"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://taleforge:${POSTGRES_PASSWORD:-taleforge}@db/taleforge
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /srv/media
      AUDIO_DIR: /srv/audio
      SFX_ENABLED: ${SFX_ENABLED:-1}
      SFX_WORKER_EMBEDDED: "0"
      SFX_MODEL_DIR: /srv/models/sfx
      SFX_MODEL_REVISION: ${SFX_MODEL_REVISION:-main}
      SFX_DEVICE: cpu
      SILERO_API_BASE: ${SILERO_API_BASE:-http://silero:8001}
    ports:
      - "8000:8000"
    volumes:
      - ./content:/srv/content:ro
      - media:/srv/media  # голосовые реплики игроков
      - ./audio:/srv/audio  # библиотека звука: на запись, админка кладёт треки прямо в папку проекта
      - sfx-models:/srv/models:ro
      - ./app/web/dist:/srv/app/web/dist  # фронтенд веб-клиента
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      sfx:
        condition: service_started

  # Starts with Taleforge automatically. One CPU inference; GPU remains available to Whisper/Voice Studio.
  # First startup downloads gated weights with HF_TOKEN; later startups use the persistent local snapshot.
  sfx:
    build:
      context: .
      dockerfile: docker/sfx/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://taleforge:${POSTGRES_PASSWORD:-taleforge}@db/taleforge
      AUDIO_DIR: /srv/audio
      SFX_ENABLED: ${SFX_ENABLED:-1}
      SFX_DEVICE: cpu
      SFX_WORKER_EMBEDDED: "0"
      SFX_MODEL_DIR: /srv/models/sfx
      SFX_MODEL_REVISION: ${SFX_MODEL_REVISION:-main}
      HF_HOME: /srv/models/huggingface
      SFX_THREADS: ${SFX_THREADS:-2}
    volumes:
      - ./audio:/srv/audio
      - sfx-models:/srv/models
    cpus: ${SFX_CPUS:-2}
    mem_limit: ${SFX_MEMORY_LIMIT:-6g}
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on: [app]

  # Сервер расшифровки речи (Speaches, faster-whisper) с OpenAI-совместимым /v1/audio/transcriptions.
  # Модель скачивается при первом запуске и остаётся в томе whisper-models. Без видеокарты NVIDIA — образ
  # ghcr.io/speaches-ai/speaches:latest-cpu, секцию deploy уберите, а STT_MODEL лучше взять поменьше
  # (Systran/faster-whisper-small) и указать её же в PRELOAD_MODELS.
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    profiles: ["voice"]
    environment:
      PRELOAD_MODELS: '["${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}"]'
      WHISPER__TTL: "-1"  # модель всё время в памяти: первая реплика не ждёт загрузки
      WHISPER__COMPUTE_TYPE: int8_float16
      ENABLE_UI: "false"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Сервер озвучки речи (Kokoro-FastAPI TTS) с OpenAI-совместимым /v1/audio/speech.
  # Локальная озвучка через Silero TTS (быстрая модель для русского языка)
  # API будет доступен на 8001 порту
volumes:
  pgdata:
  media:
  whisper-models:
  sfx-models:
  

