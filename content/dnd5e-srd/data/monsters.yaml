# Монстры SRD 5.1 (Monsters, Creatures, NPCs). Имена — по-русски, srd_ref.name — английское имя SRD.
# Числа: cr (0.125 = 1/8), xp, ac (ac_note — источник КД), hp {average, dice}, скорость и чувства в футах.
# saves / skills — итоговые бонусы. damage_* — только чистые типы урона; условные («from nonmagical attacks»)
# лежат в damage_notes {kind, text}. Действия: kind melee_weapon | ranged_weapon | melee_spell | ranged_spell |
# save | multiattack | other; «Melee or Ranged Weapon Attack» — melee_weapon с reach_ft и range.
# usage — ограничение: {recharge: N} (перезарядка N–6), {per_day: N}, {recharge_after: [short, long]}.
# Если у действия несколько вариантов (дыхание, выбор урона, варианты мультиатаки) — в поля взят первый,
# полный текст — в description.
# behavior — эвристика генератора: звери (не рои) с cr <= 1/4 и int <= 3 — {cowardly, 0.5},
# все остальные — {aggressive, 0.25}. Пакет мира переопределяет по месту.
# This work includes material taken from the System Reference Document 5.1 ("SRD 5.1") by Wizards of the
# Coast LLC, licensed under CC BY 4.0. Данные: 5e-bits/5e-database, коммит bce51b3958573819e3b842fbc0cd9524fe4bc2e1.
# Файл сгенерирован tools/import_srd.py — не править руками, правьте генератор.
kind: creature_template
items:
  - id: creature.aboleth
    name: Аболет
    status: canon
    doc: 'SRD 5.1: Monsters'
    tags: [srd, aberration]
    srd_ref: {type: monster, name: Aboleth}
    size: large
    creature_type: aberration
    alignment: lawful evil
    cr: 10
    xp: 5900
    ac: 17
    ac_note: natural armor
    hp: {average: 135, dice: 18d10+36}
    speed: {walk: 10, swim: 40}
    abilities: {str: 21, dex: 9, con: 15, int: 18, wis: 15, cha: 18}
    saves: {con: 6, int: 8, wis: 6}
    skills: {history: 12, perception: 10}
    senses: {darkvision: 120, passive_perception: 20}
    languages: Deep Speech, telepathy 120 ft.
    traits:
    - {name: Amphibious, description: The aboleth can breathe air and water.}
    - name: Mucous Cloud
      description: While underwater, the aboleth is surrounded by transformative mucus. A creature that touches the aboleth or that hits it with a melee attack while within 5 ft. of it must make a DC 14 Constitution saving throw. On a failure, the creature is diseased for 1d4 hours. The diseased creature can breathe only underwater.
    - name: Probing Telepathy
      description: If a creature communicates telepathically with the aboleth, the aboleth learns the creature's greatest desires if the aboleth can see the creature.
    actions:
    - key: multiattack
      name: Multiattack
      kind: multiattack
      multiattack:
      - {action: tentacle, count: 3}
      description: The aboleth makes three tentacle attacks.
    - key: tentacle
      name: Tentacle
      kind: melee_weapon
      attack_bonus: 9
      reach_ft: 10
      damage:
      - {dice: 2d6+5, type: bludgeoning}
      - {dice: 1d12, type: acid}
      save: {ability: con, dc: 14, success: none}
      description: 'Melee Weapon Attack: +9 to hit, reach 10 ft., one target. Hit: 12 (2d6 + 5) bludgeoning damage. If the target is a creature, it must succeed on a DC 14 Constitution saving throw or become diseased. The disease has no effect for 1 minute and can be removed by any magic that cures disease. After 1 minute, the diseased creature''s skin becomes translucent and slimy, the creature can''t regain hit points unless it is underwater, and the disease can be removed only by heal or another disease-curing spell of 6th level or higher. When the creature is outside a body of water, it takes 6 (1d12) acid damage every 10 minutes unless moisture is applied to the skin before 10 minutes have passed.'
    - key: tail
      name: Tail
      kind: melee_weapon
      attack_bonus: 9
      reach_ft: 10
      damage:
      - {dice: 3d6+5, type: bludgeoning}
      description: 'Melee Weapon Attack: +9 to hit, reach 10 ft., one target. Hit: 15 (3d6 + 5) bludgeoning damage.'
    - key: enslave
      name: Enslave
      kind: save
      save: {ability: wis, dc: 14, success: none}
      usage: {per_day: 3}
      description: |-
        The aboleth targets one creature it can see within 30 ft. of it. The target must succeed on a DC 14 Wisdom saving throw or be magically charmed by the aboleth until the aboleth dies or until it is on a different plane of existence from the target. The charmed target is under the aboleth's control and can't take reactions, and the aboleth and the target can communicate telepathically with each other over any distance.
        Whenever the charmed target takes damage, the target can repeat the saving throw. On a success, the effect ends. No more than once every 24 hours, the target can also repeat the saving throw when it is at least 1 mile away from the aboleth.
    legendary_actions:
    - {name: Detect, description: The aboleth makes a Wisdom (Perception) check.}
    - {name: Tail Swipe, description: The aboleth makes one tail attack.}
    - name: Psychic Drain (Costs 2 Actions)
      description: One creature charmed by the aboleth takes 10 (3d6) psychic damage, and the aboleth regains hit points equal to the damage the creature takes.
    behavior: {profile: aggressive, flee_threshold: 0.25}
  - id: creature.acolyte
    name: Послушник
    status: canon
    doc: 'SRD 5.1: Monsters'
    tags: [srd, humanoid, any_race]
    srd_ref: {type: monster, name: Acolyte}
    size: medium
    creature_type: humanoid
    alignment: any alignment
    cr: 0.25
    xp: 50
    ac: 10
    hp: {average: 9, dice: 2d8}
    speed: {walk: 30}
    abilities: {str: 10, dex: 10, con: 10, int: 10, wis: 14, cha: 11}
    skills: {medicine: 4, religion: 2}
    senses: {passive_perception: 12}
    languages: any one language (usually Common)
    traits:
    - name: Spellcasting
      description: |-
        The acolyte is a 1st-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 12, +4 to hit with spell attacks). The acolyte has following cleric spells prepared:

        - Cantrips (at will): light, sacred flame, thaumaturgy
        - 1st level (3 slots): bless, cure wounds, sanctuary
    actions:
    - key: club
      name: Club
      kind: melee_weapon
      attack_bonus: 2
      reach_ft: 5
      damage:
      - {dice: 1d4, type: bludgeoning}
      description: 'Melee Weapon Attack: +2 to hit, reach 5 ft., one target. Hit: 2 (1d4) bludgeoning damage.'
    behavior: {profile: aggressive, flee_threshold: 0.25}
