    features:
    - key: divine_sense
      name: Divine Sense
      level: 1
      description: |-
        The presence of strong evil registers on your senses like a noxious odor, and powerful good rings like heavenly music in your ears. As an action, you can open your awareness to detect such forces. Until the end of your next turn, you know the location of any celestial, fiend, or undead within 60 feet of you that is not behind total cover. You know the type (celestial, fiend, or undead) of any being whose presence you sense, but not its identity. Within the same radius, you also detect the presence of any place or object that has been consecrated or desecrated, as with the hallow spell.
        You can use this feature a number of times equal to 1 + your Charisma modifier. When you finish a long rest, you regain all expended uses.
    - key: lay_on_hands
      name: Lay on Hands
      level: 1
      description: |-
        Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you take a long rest. With that pool, you can restore a total number of hit points equal to your paladin level x 5.
        As an action, you can touch a creature and draw power from the pool to restore a number of hit points to that creature, up to the maximum amount remaining in your pool.
        Alternatively, you can expend 5 hit points from your pool of healing to cure the target of one disease or neutralize one poison affecting it. You can cure multiple diseases and neutralize multiple poisons with a single use of Lay on Hands, expending hit points separately for each one.
        This feature has no effect on undead and constructs.
    - key: divine_smite
      name: Divine Smite
      level: 2
      description: Starting at 2nd level, when you hit a creature with a melee weapon attack, you can expend one spell slot to deal radiant damage to the target, in addition to the weapon's damage. The extra damage is 2d8 for a 1st-level spell slot, plus 1d8 for each spell level higher than 1st, to a maximum of 5d8. The damage increases by 1d8 if the target is an undead or a fiend.
    - key: paladin_fighting_style
      name: Fighting Style
      level: 2
      description: At 2nd level, you adopt a style of fighting as your specialty. Choose one of the following options. You can't take a Fighting Style option more than once, even if you later get to choose again.
    - key: spellcasting_paladin
      name: 'Spellcasting: Paladin'
      level: 2
      description: By 2nd level, you have learned to draw on divine magic through meditation and prayer to cast spells as a cleric does.
    - key: fighting_style_defense
      name: 'Fighting Style: Defense'
      level: 2
      parent: paladin_fighting_style
      description: While you are wearing armor, you gain a +1 bonus to AC.
    - key: fighting_style_dueling
      name: 'Fighting Style: Dueling'
      level: 2
      parent: paladin_fighting_style
      description: When you are wielding a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon.
    - key: fighting_style_great_weapon_fighting
      name: 'Fighting Style: Great Weapon Fighting'
      level: 2
      parent: paladin_fighting_style
      description: When you roll a 1 or 2 on a damage die for an attack you make with a melee weapon that you are wielding with two hands, you can reroll the die and must use the new roll. The weapon must have the two-handed or versatile property for you to gain this benefit.
    - key: fighting_style_protection
      name: 'Fighting Style: Protection'
      level: 2
      parent: paladin_fighting_style
      description: When a creature you can see attacks a target other than you that is within 5 feet of you, you can use your reaction to impose disadvantage on the attack roll. You must be wielding a shield.
    - key: channel_divinity
      name: Channel Divinity
      level: 3
      description: |-
        Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.
        When you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again.
        Some Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your paladin spell save DC.
    - key: divine_health
      name: Divine Health
      level: 3
      description: By 3rd level, the divine magic flowing through you makes you immune to disease.
    - key: oath_spells
      name: Oath Spells
      level: 3
      description: |-
        Each oath has a list of associated spells. You gain access to these spells at the levels specified in the oath description. Once you gain access to an oath spell, you always have it prepared. Oath spells don't count against the number of spells you can prepare each day.
        If you gain an oath spell that doesn't appear on the paladin spell list, the spell is nonetheless a paladin spell for you.
    - key: sacred_oath
      name: Sacred Oath
      level: 3
      description: |-
        When you reach 3rd level, you swear the oath that binds you as a paladin forever. Up to this time you have been in a preparatory stage, committed to the path but not yet sworn to it. Now you choose an oath, such as the Oath of Devotion.
        Your choice grants you features at 3rd level and again at 7th, 15th, and 20th level. Those features include oath spells and the Channel Divinity feature.
    - key: paladin_ability_score_improvement_1
      name: Ability Score Improvement
      level: 4
      description: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
    - key: paladin_extra_attack
      name: Extra Attack
      level: 5
      description: Beginning at 5th level, you can attack twice, instead of once, whenever you take the Attack action on your turn.
    - key: aura_of_protection
      name: Aura of Protection
      level: 6
      description: |-
        Starting at 6th level, whenever you or a friendly creature within 10 feet of you must make a saving throw, the creature gains a bonus to the saving throw equal to your Charisma modifier (with a minimum bonus of +1). You must be conscious to grant this bonus.
        At 18th level, the range of this aura increases to 30 feet.
    - key: sacred_oath_improvement_1
      name: Sacred Oath feature
      level: 7
      description: |-
        When you reach 3rd level, you swear the oath that binds you as a paladin forever. Up to this time you have been in a preparatory stage, committed to the path but not yet sworn to it. Now you choose an oath, such as the Oath of Devotion.
        Your choice grants you features at 3rd level and again at 7th, 15th, and 20th level. Those features include oath spells and the Channel Divinity feature.
    - key: paladin_ability_score_improvement_2
      name: Ability Score Improvement
      level: 8
      description: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
    - key: aura_of_courage
      name: Aura of Courage
      level: 10
      description: |-
        Starting at 10th level, you and friendly creatures within 10 feet of you can't be frightened while you are conscious.
        At 18th level, the range of this aura increases to 30 feet.
    - key: improved_divine_smite
      name: Improved Divine Smite
      level: 11
      description: By 11th level, you are so suffused with righteous might that all your melee weapon strikes carry divine power with them. Whenever you hit a creature with a melee weapon, the creature takes an extra 1d8 radiant damage. If you also use your Divine Smite with an attack, you add this damage to the extra damage of your Divine Smite.
    - key: paladin_ability_score_improvement_3
      name: Ability Score Improvement
      level: 12
      description: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
    - key: cleansing_touch
      name: Cleansing Touch
      level: 14
      description: |-
        Beginning at 14th level, you can use your action to end one spell on yourself or on one willing creature that you touch.
        You can use this feature a number of times equal to your Charisma modifier (a minimum of once). You regain expended uses when you finish a long rest.
    - key: sacred_oath_improvement_2
      name: Sacred Oath feature
      level: 15
      description: |-
        When you reach 3rd level, you swear the oath that binds you as a paladin forever. Up to this time you have been in a preparatory stage, committed to the path but not yet sworn to it. Now you choose an oath, such as the Oath of Devotion.
        Your choice grants you features at 3rd level and again at 7th, 15th, and 20th level. Those features include oath spells and the Channel Divinity feature.
    - key: paladin_ability_score_improvement_4
      name: Ability Score Improvement
      level: 16
      description: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
    - key: aura_improvements
      name: Aura improvements
      level: 18
      description: At 18th level, the range of your auras increase to 30 feet.
    - key: paladin_ability_score_improvement_5
      name: Ability Score Improvement
      level: 19
      description: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
