# Свитки заклинаний SRD 5.1 (Magic Items: Spell Scroll) для частых заклинаний 1–3-го круга.
# spell_scroll: {spell_ref, slot_level} — use_item творит заклинание по правилам cast_spell без ячейки;
# сложность и бонус атаки — по кругу свитка (1–2-й круг: сл. 13 / +5, 3-й: сл. 15 / +7).
# Цены — ориентир по редкости, в SRD у свитков цены нет.
kind: item_template
items:
- id: item.scroll_magic_missile
  name: 'Свиток: Волшебная стрела'
  status: canon
  doc: 'SRD 5.1: Magic Items (Spell Scroll)'
  description: Свиток с заклинанием «Волшебная стрела». Прочесть может заклинатель, у которого оно в списке класса; круг выше
    доступного — проверка заклинательной характеристики, сл. 10 + круг. После прочтения свиток рассыпается.
  tags:
  - scroll
  - srd
  - magic_item
  category: consumable
  rarity: common
  price:
    gp: 50
  weight: 0
  spell_scroll:
    spell_ref: spell.magic_missile
    slot_level: 1
