# Шаблоны сюжетов для архитектора кампании (проект «Подготовка кампании»). Это структура, а не сюжет:
# архитектор берёт шаги (beats) как опору и наполняет их лором мира и анкетой владельца.
# pillars — насколько структура подходит под акценты анкеты (0–2), emotions — какие эмоции даёт естественно.
kind: plot_structure
items:
  - id: plot.investigation
    name: Расследование
    status: canon
    description: Преступление или тайна, которую нужно раскрыть по уликам, пока виновный заметает следы.
    pillars: {combat: 0, exploration: 1, social: 2, mystery: 2, puzzles: 2}
    emotions: [mystery, fear, moral]
    beats:
      - "Завязка: преступление или странное событие, у героев есть причина вмешаться."
      - "Улики: несколько путей к правде, свидетели лгут, у каждого свой интерес."
      - "Ложный след: очевидный подозреваемый оказывается не тем, противник отвечает."
      - "Прозрение: главная тайна раскрыта, становится ясно, кто стоит за всем."
      - "Развязка: столкновение с виновным и выбор, что делать с правдой."
  - id: plot.heist
    name: Ограбление
    status: canon
    description: Добыть охраняемую ценность — план, подготовка, проникновение и всё, что пошло не так.
    pillars: {combat: 1, exploration: 1, social: 2, mystery: 0, puzzles: 2}
    emotions: [adventure, humor, moral]
    beats:
      - "Заказ: цель, награда и почему это почти невозможно."
      - "Подготовка: разведка, нужные люди и вещи, у каждого своя цена."
      - "Проникновение: план встречает реальность, всплывает неучтённое."
      - "Поворот: предательство, ловушка или цель оказывается не тем, чем казалась."
      - "Отход: уйти с добычей и решить, кому она достанется."
  - id: plot.journey
    name: Путешествие
    status: canon
    description: Дойти из точки А в точку Б через опасные земли, и дорога меняет героев.
    pillars: {combat: 1, exploration: 2, social: 1, mystery: 1, puzzles: 0}
    emotions: [adventure, heroism, tragedy]
    beats:
      - "Зов: зачем идти и почему именно сейчас."
      - "Первый рубеж: выход в опасные земли, первая потеря или испытание."
      - "Дорога: встречи, союзники, враг идёт по следу."
      - "Худший час: путь отрезан, приходится платить."
      - "Цель: прибытие, и оказывается, что главное испытание здесь."
  - id: plot.siege
    name: Осада
    status: canon
    description: Удержать место против превосходящей силы — оборона, вылазки, предатель внутри.
    pillars: {combat: 2, exploration: 0, social: 1, mystery: 1, puzzles: 1}
    emotions: [heroism, fear, tragedy]
    beats:
      - "Угроза: враг идёт, времени на подготовку мало."
      - "Подготовка: укрепления, союзники, трудные решения о людях и запасах."
      - "Первый штурм: цена обороны, слабое место найдено."
      - "Внутренний враг: предатель, голод или раскол."
      - "Решающая ночь: вылазка, прорыв или последний бой."
  - id: plot.survival
    name: Выживание
    status: canon
    description: Герои отрезаны от мира и должны выбраться, пока нечто охотится на них.
    pillars: {combat: 1, exploration: 2, social: 0, mystery: 2, puzzles: 1}
    emotions: [fear, mystery, tragedy]
    beats:
      - "Ловушка: герои отрезаны, пути назад нет."
      - "Первые признаки: что-то не так, кто-то пропадает."
      - "Природа угрозы: становится ясно, с чем имеют дело."
      - "Отчаяние: ресурсы кончаются, выбор кого спасать."
      - "Выход: побег, изгнание угрозы или жертва."
  - id: plot.intrigue
    name: Придворная интрига
    status: canon
    description: Борьба за власть, где оружие — слова, союзы и тайны, а ошибка стоит головы.
    pillars: {combat: 0, exploration: 0, social: 2, mystery: 2, puzzles: 1}
    emotions: [moral, mystery, tragedy]
    beats:
      - "Приглашение: герои попадают в игру сильных, не зная правил."
      - "Стороны: у каждой фракции своё предложение и свой скелет в шкафу."
      - "Компромат: тайна, способная изменить расклад, и цена её раскрытия."
      - "Измена: союзник предаёт или враг предлагает сделку."
      - "Переворот: кто окажется у власти, решают герои."
  - id: plot.monster_hunt
    name: Охота на чудовище
    status: canon
    description: Чудовище терзает округу — выследить, понять и одолеть его.
    pillars: {combat: 2, exploration: 2, social: 1, mystery: 1, puzzles: 0}
    emotions: [heroism, fear, adventure]
    beats:
      - "Беда: нападения, страх и награда за голову твари."
      - "Следы: изучить жертв, места и повадки."
      - "Первая встреча: чудовище сильнее, чем думали."
      - "Слабость: легенда, оружие или обряд, которые дадут шанс."
      - "Логово: решающая схватка и правда о том, откуда чудовище взялось."
