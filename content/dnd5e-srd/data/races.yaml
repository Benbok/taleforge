# Расы SRD 5.1 как происхождения героя: подраса — отдельная запись, в неё слиты прибавки и черты базовой расы.
# srd_ref.name — английское имя расы SRD (Dwarf, Elf...), srd_subrace — имя подрасы. ability_bonuses — фиксированные
# прибавки {характеристика: число}; ability_choose — прибавки на выбор игрока (полуэльф).
# languages — английские названия; languages_choose — сколько языков выбрать дополнительно.
# proficiencies: skills / weapons (id пакета) / tools, *_choose — выбор. darkvision — футы.
# features — черты расы (английский текст SRD); options — варианты выбора (драконье происхождение).
# This work includes material taken from the System Reference Document 5.1 ("SRD 5.1") by Wizards of the
# Coast LLC, licensed under CC BY 4.0. Данные: 5e-bits/5e-database, коммит bce51b3958573819e3b842fbc0cd9524fe4bc2e1.
# Файл сгенерирован tools/import_srd.py — не править руками, правьте генератор.
kind: origin
items:
  - id: origin.dwarf_hill
    name: Холмовой дварф
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Dwarf}
    srd_subrace: Hill Dwarf
    size: medium
    speed: 25
    ability_bonuses: {con: 2, wis: 1}
    languages: [Common, Dwarvish]
    proficiencies:
      weapons: [item.battleaxe, item.handaxe, item.light_hammer, item.warhammer]
      tools_choose:
        count: 1
        from: [smiths_tools, brewers_supplies, masons_tools]
    darkvision: 60
    damage_resistances: [poison]
    features:
    - key: darkvision
      name: Darkvision
      description: You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray.
    - key: dwarven_resilience
      name: Dwarven Resilience
      description: You have advantage on saving throws against poison, and you have resistance against poison damage.
    - key: stonecunning
      name: Stonecunning
      description: Whenever you make an Intelligence (History) check related to the origin of stonework, you are considered proficient in the History skill and add double your proficiency bonus to the check, instead of your normal proficiency bonus.
    - key: dwarven_combat_training
      name: Dwarven Combat Training
      description: You have proficiency with the battleaxe, handaxe, light hammer, and warhammer.
    - key: tool_proficiency
      name: Tool Proficiency
      description: 'You gain proficiency with the artisan''s tools of your choice: smith''s tools, brewer''s supplies, or mason''s tools.'
    - key: dwarven_toughness
      name: Dwarven Toughness
      description: Your hit point maximum increases by 1, and it increases by 1 every time you gain a level.
  - id: origin.elf_high
    name: Высший эльф
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Elf}
    srd_subrace: High Elf
    size: medium
    speed: 30
    ability_bonuses: {dex: 2, int: 1}
    languages: [Common, Elvish]
    languages_choose: 1
    proficiencies:
      skills: [perception]
      weapons: [item.longsword, item.shortsword, item.shortbow, item.longbow]
    darkvision: 60
    features:
    - key: darkvision
      name: Darkvision
      description: You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray.
    - key: fey_ancestry
      name: Fey Ancestry
      description: You have advantage on saving throws against being charmed, and magic cannot put you to sleep.
    - key: trance
      name: Trance
      description: Elves do not need to sleep. Instead, they meditate deeply, remaining semiconscious, for 4 hours a day. (The Common word for such meditation is "trance.") While meditating, you can dream after a fashion; such dreams are actually mental exercises that have become reflexive through years of practice. After resting this way, you gain the same benefit that a human does from 8 hours of sleep.
    - {key: keen_senses, name: Keen Senses, description: You have proficiency in the Perception skill.}
    - key: elf_weapon_training
      name: Elf Weapon Training
      description: You have proficiency with the longsword, shortsword, shortbow, and longbow.
    - key: high_elf_cantrip
      name: High Elf Cantrip
      description: You know one cantrip of your choice form the wizard spell list. Intelligence is your spellcasting ability for it.
      spell_choose:
        count: 1
        from:
        - Light
        - Mage Hand
        - Mending
        - Message
        - Minor Illusion
        - Acid Splash
        - Prestidigitation
        - Ray of Frost
        - Shocking Grasp
        - True Strike
        - Chill Touch
        - Dancing Lights
        - Fire Bolt
        - Poison Spray
    - key: extra_language
      name: Extra Language
      description: You can speak, read, and write one extra language of your choice.
  - id: origin.halfling_lightfoot
    name: Легконогий полурослик
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Halfling}
    srd_subrace: Lightfoot Halfling
    size: small
    speed: 25
    ability_bonuses: {dex: 2, cha: 1}
    languages: [Common, Halfling]
    features:
    - key: brave
      name: Brave
      description: You have advantage on saving throw against being frightened.
    - key: halfling_nimbleness
      name: Halfling Nimbleness
      description: You can move through the space of any creature that is of a size larger than yours.
    - key: lucky
      name: Lucky
      description: When you roll a 1 on the d20 for an attack roll, ability check, or saving throw, you can reroll the die and must use the new roll.
    - key: naturally_stealthy
      name: Naturally Stealthy
      description: You can attempt to hide even when you are obscured only by a creature that is at least one size larger than you.
  - id: origin.human
    name: Человек
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Human}
    size: medium
    speed: 30
    ability_bonuses: {str: 1, dex: 1, con: 1, int: 1, wis: 1, cha: 1}
    languages: [Common]
    languages_choose: 1
    features: []
  - id: origin.dragonborn
    name: Драконорождённый
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Dragonborn}
    size: medium
    speed: 30
    ability_bonuses: {str: 2, cha: 1}
    languages: [Common, Draconic]
    features:
    - key: draconic_ancestry
      name: Draconic Ancestry
      description: You have draconic ancestry. Choose one type of dragon from the Draconic Ancestry table. Your breath weapon and damage resistance are determined by the dragon type, as shown in the table.
      options:
      - key: draconic_ancestry_black
        name: Draconic Ancestry (Black)
        damage_type: acid
        breath: {area: line, size_ft: 30, save: dex}
      - key: draconic_ancestry_blue
        name: Draconic Ancestry (Blue)
        damage_type: lightning
        breath: {area: line, size_ft: 30, save: dex}
      - key: draconic_ancestry_brass
        name: Draconic Ancestry (Brass)
        damage_type: fire
        breath: {area: line, size_ft: 30, save: dex}
      - key: draconic_ancestry_bronze
        name: Draconic Ancestry (Bronze)
        damage_type: lightning
        breath: {area: line, size_ft: 30, save: dex}
      - key: draconic_ancestry_copper
        name: Draconic Ancestry (Copper)
        damage_type: acid
        breath: {area: line, size_ft: 30, save: dex}
      - key: draconic_ancestry_gold
        name: Draconic Ancestry (Gold)
        damage_type: fire
        breath: {area: cone, size_ft: 15, save: dex}
      - key: draconic_ancestry_green
        name: Draconic Ancestry (Green)
        damage_type: poison
        breath: {area: cone, size_ft: 15, save: con}
      - key: draconic_ancestry_red
        name: Draconic Ancestry (Red)
        damage_type: fire
        breath: {area: cone, size_ft: 15, save: dex}
      - key: draconic_ancestry_silver
        name: Draconic Ancestry (Silver)
        damage_type: cold
        breath: {area: cone, size_ft: 15, save: con}
      - key: draconic_ancestry_white
        name: Draconic Ancestry (White)
        damage_type: cold
        breath: {area: cone, size_ft: 15, save: con}
    - key: breath_weapon
      name: Breath Weapon
      description: |-
        You can use your action to exhale destructive energy. Your draconic ancestry determines the size, shape, and damage type of the exhalation.
        When you use your breath weapon, each creature in the area of the exhalation must make a saving throw, the type of which is determined by your draconic ancestry. The DC for this saving throw equals 8 + your Constitution modifier + your proficiency bonus. A creature takes 2d6 damage on a failed save, and half as much damage on a successful one. The damage increases to 3d6 at 6th level, 4d6 at 11th level, and 5d6 at 16th level.
        After you use your breath weapon, you cannot use it again until you complete a short or long rest.
    - key: damage_resistance
      name: Damage Resistance
      description: You have resistance to the damage type associated with your draconic ancestry.
  - id: origin.gnome_rock
    name: Скальный гном
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Gnome}
    srd_subrace: Rock Gnome
    size: small
    speed: 25
    ability_bonuses: {int: 2, con: 1}
    languages: [Common, Gnomish]
    proficiencies:
      tools: [tinkers_tools]
    darkvision: 60
    features:
    - key: darkvision
      name: Darkvision
      description: You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray.
    - key: gnome_cunning
      name: Gnome Cunning
      description: You have advantage on all Intelligence, Wisdom, and Charisma saving throws against magic.
    - key: artificers_lore
      name: Artificer's Lore
      description: Whenever you make an Intelligence (History) check related to magic items, alchemical objects, or technological devices, you can add twice your proficiency bonus, instead of any proficiency bonus you normally apply.
    - key: tinker
      name: Tinker
      description: |-
        You have proficiency with artisan's tools (tinker's tools). Using those tools, you can spend 1 hour and 10 gp worth of materials to construct a Tiny clockwork device (AC 5, 1 hp). The device ceases to function after 24 hours (unless you spend 1 hour repairing it to keep the device functioning), or when you use your action to dismantle it; at that time, you can reclaim the materials used to create it. You can have up to three such devices active at a time.
        When you create a device, choose one of the following options:
        Clockwork Toy: This toy is a clockwork animal, monster, or person, such as a frog, mouse, bird, dragon, or soldier. When placed on the ground, the toy moves 5 feet across the ground on each of your turns in a random direction. It makes noises as appropriate to the creature it represents.
        Fire Starter: The device produces a miniature flame, which you can use to light a candle, torch, or campfire. Using the device requires your action.
        Music Box: When opened, this music box plays a single song at a moderate volume. The box stops playing when it reaches the song's end or when it is closed.
  - id: origin.half_elf
    name: Полуэльф
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Half-Elf}
    size: medium
    speed: 30
    ability_bonuses: {cha: 2}
    ability_choose:
      count: 2
      bonus: 1
      exclude: [cha]
    languages: [Common, Elvish]
    languages_choose: 1
    proficiencies:
      skills_choose:
        count: 2
        from:
        - acrobatics
        - animal_handling
        - arcana
        - athletics
        - deception
        - history
        - insight
        - intimidation
        - investigation
        - medicine
        - nature
        - perception
        - performance
        - persuasion
        - religion
        - sleight_of_hand
        - stealth
        - survival
    darkvision: 60
    features:
    - key: darkvision
      name: Darkvision
      description: You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray.
    - key: fey_ancestry
      name: Fey Ancestry
      description: You have advantage on saving throws against being charmed, and magic cannot put you to sleep.
    - key: skill_versatility
      name: Skill Versatility
      description: You gain proficiency in two skills of your choice.
  - id: origin.half_orc
    name: Полуорк
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Half-Orc}
    size: medium
    speed: 30
    ability_bonuses: {str: 2, con: 1}
    languages: [Common, Orc]
    proficiencies:
      skills: [intimidation]
    darkvision: 60
    features:
    - key: darkvision
      name: Darkvision
      description: You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray.
    - key: savage_attacks
      name: Savage Attacks
      description: When you score a critical hit with a melee weapon attack, you can roll one of the weapon's damage dice one additional time and add it to the extra damage of the critical hit.
    - key: relentless_endurance
      name: Relentless Endurance
      description: When you are reduced to 0 hit points but not killed outright, you can drop to 1 hit point instead. you cannot use this feature again until you finish a long rest.
    - {key: menacing, name: Menacing, description: You gain proficiency in the Intimidation skill.}
  - id: origin.tiefling
    name: Тифлинг
    status: canon
    doc: 'SRD 5.1: Races'
    tags: [race, srd]
    srd_ref: {type: race, name: Tiefling}
    size: medium
    speed: 30
    ability_bonuses: {int: 1, cha: 2}
    languages: [Common, Infernal]
    darkvision: 60
    damage_resistances: [fire]
    features:
    - key: darkvision
      name: Darkvision
      description: You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray.
    - key: hellish_resistance
      name: Hellish Resistance
      description: You have resistance to fire damage.
    - key: infernal_legacy
      name: Infernal Legacy
      description: You know the thaumaturgy cantrip. When you reach 3rd level, you can cast the hellish rebuke spell as a 2nd-level spell once with this trait and regain the ability to do so when you finish a long rest. When you reach 5th level, you can cast the darkness spell once with this trait and regain the ability to do so when you finish a long rest. Charisma is your spellcasting ability for these spells.
