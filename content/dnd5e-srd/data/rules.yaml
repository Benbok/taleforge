# Фрагменты правил для поиска мастером (ТЗ, раздел 9: «Релевантные фрагменты правил»). Пересказ SRD 5.1 по-русски,
# приведённый к движку Taleforge: вместо клеток — зоны «вплотную» (5 фт), «близко» (до 30 фт), «далеко» (до 120 фт).
# Числа считает сервер; здесь — что делать мастеру и какой инструмент звать.
kind: rule_section
items:
  - id: rule.ability_checks
    keywords: проверка навык взломать вспомнить заметить осмотреть найти check inspect search interact
    name: Проверки характеристик
    status: canon
    doc: "SRD 5.1: Using Ability Scores"
    tags: [rule, check]
    topic: checks
    text: >-
      Когда исход действия не очевиден, персонаж делает проверку: d20 + модификатор характеристики (+ бонус мастерства,
      если владеет навыком) против сложности. Сложность — только из шкалы сложностей или шаблона объекта.
      Навык выбирается по сути действия: взломать замок — Ловкость рук, вспомнить легенду — История, заметить засаду — Внимательность.
      Инструмент: roll_check. Если провал ничем не грозит и время не важно, проверка не нужна — auto_success.

  - id: rule.advantage
    keywords: преимущество помеха
    name: Преимущество и помеха
    status: canon
    doc: "SRD 5.1: Advantage and Disadvantage"
    tags: [rule, check, attack]
    topic: checks
    text: >-
      С преимуществом бросают два d20 и берут больший, с помехой — меньший. Несколько преимуществ не складываются;
      преимущество и помеха вместе отменяют друг друга. Преимущество дают выгодное положение, помощь союзника,
      невидимость атакующего; помеху — плохая видимость, дальний выстрел, состояния. Эффекты сервер учитывает сам.

  - id: rule.saving_throws
    keywords: спасбросок яд ловушка save
    name: Спасброски
    status: canon
    doc: "SRD 5.1: Saving Throws"
    tags: [rule, save]
    topic: checks
    text: >-
      Спасбросок — реакция на угрозу: яд, ловушку, заклинание. d20 + модификатор характеристики (+ мастерство, если класс
      им владеет) против сложности источника. Сложность и характеристику задаёт шаблон опасности, эффекта или заклинания.
      Инструменты: apply_hazard, apply_effect — сервер сам бросает спасбросок, если он указан в шаблоне.

  - id: rule.contests
    keywords: состязание перетянуть вырваться
    name: Состязания
    status: canon
    doc: "SRD 5.1: Contests"
    tags: [rule, check]
    topic: checks
    text: >-
      Когда двое тянут в разные стороны (перетянуть канат, вырваться из захвата, спрятаться от стража), оба делают
      проверки, и выигрывает больший результат; при равенстве остаётся как было. Каждая сторона — отдельный roll_check,
      сравнение — в повествовании по результатам.

  - id: rule.combat_order
    keywords: бой инициатива раунд ход очередь combat
    name: Порядок боя
    status: canon
    doc: "SRD 5.1: The Order of Combat"
    tags: [rule, combat]
    topic: combat
    text: >-
      Бой начинается броском инициативы: set_scene_mode с режимом combat. Дальше участники ходят по очереди, раунд — 6 секунд
      игрового времени. В свой ход существо может переместиться и совершить одно действие, иногда бонусное действие;
      реакция — одна за раунд, в том числе вне своего хода. Ходы существ сервер проводит сам по профилю поведения;
      мастер обрабатывает только действие героя, чей ход. Бой заканчивается, когда врагов или стоящих героев не осталось,
      или мастер переводит сцену в свободный режим.

  - id: rule.surprise
    keywords: засада внезапно врасплох незаметно напасть
    name: Внезапность
    status: canon
    doc: "SRD 5.1: Surprise"
    tags: [rule, combat, stealth]
    topic: combat
    text: >-
      Если одна сторона не заметила другую, её участники застигнуты врасплох: в первом раунде они не двигаются, не действуют
      и не реагируют. Заметил ли — сравнение Скрытности нападающих с пассивной Внимательностью (10 + модификатор). Состояние
      condition.surprised накладывается через apply_effect до начала боя.

  - id: rule.actions_in_combat
    keywords: атаковать ударить рывок бежать отход отступить уклониться помочь подготовить dash disengage dodge help attack
    name: Действия в бою
    status: canon
    doc: "SRD 5.1: Actions in Combat"
    tags: [rule, combat, action]
    topic: combat
    text: >-
      Основные действия: Атака (resolve_attack), Заклинание, Рывок (двойное перемещение), Отход (перемещение без атак
      по возможности), Уклонение (атаки по нему с помехой до его следующего хода), Помощь (союзник получает преимущество
      на следующую проверку или атаку), Засада (спрятаться — Скрытность), Подготовка (действие по условию, тратит реакцию),
      Поиск, Использование предмета (use_item). Нестандартное действие относи к ближайшему из этих типов.

  - id: rule.movement_zones
    keywords: подойти подбежать приблизиться отойти отбежать сблизиться move зона
    name: Перемещение и зоны
    status: canon
    doc: "SRD 5.1: Movement and Position"
    tags: [rule, combat, movement]
    topic: combat
    text: >-
      Вместо клеток — три зоны относительно героев: «вплотную» (5 фт, рукопашная), «близко» (до 30 фт — за один ход
      обычной скоростью), «далеко» (до 120 фт — дальнобойное оружие и заклинания). Сдвиг на одну зону — перемещение
      за ход. Сближение или отход существа — update_entity с новой зоной, уход в другую локацию — move.

  - id: rule.opportunity_attack
    keywords: убегает сбежать вдогонку реакция
    name: Атака по возможности
    status: canon
    doc: "SRD 5.1: Opportunity Attacks"
    tags: [rule, combat, reaction]
    topic: combat
    text: >-
      Когда враг покидает ближний бой, не совершив Отход, можно ударить его реакцией одной рукопашной атакой. Для героев
      сервер сам предлагает игроку кнопку реакции; для существ атака по возможности не проводится автоматически.

  - id: rule.attack_rolls
    keywords: атака удар бью рублю стреляю выстрел критический attack
    name: Броски атаки и критическое попадание
    status: canon
    doc: "SRD 5.1: Making an Attack"
    tags: [rule, combat, attack]
    topic: combat
    text: >-
      Атака: d20 + модификатор (Сила для рукопашной, Ловкость для дальнобойной и фехтовального оружия) + мастерство против
      КД цели. Натуральная 20 — критическое попадание: кости урона бросаются дважды. Натуральная 1 — промах.
      Дальнобойная атака, когда враг вплотную, — с помехой. Всё считает resolve_attack.

  - id: rule.cover
    keywords: укрытие спрятаться за стеной колонна
    name: Укрытие
    status: canon
    doc: "SRD 5.1: Cover"
    tags: [rule, combat]
    topic: combat
    text: >-
      Половинное укрытие (низкая стена, другое существо) даёт +2 к КД и спасброскам Ловкости, укрытие на три четверти
      (бойница, толстый ствол) — +5, полное укрытие — цель нельзя атаковать напрямую. Укрытие задаётся эффектом из шаблонов,
      если он есть; если нет — решай помехой через описание и не вводи новые числа.

  - id: rule.damage_resistance
    keywords: урон сопротивление иммунитет уязвимость
    name: Урон, сопротивление и уязвимость
    status: canon
    doc: "SRD 5.1: Damage and Healing"
    tags: [rule, damage]
    topic: damage
    text: >-
      У урона есть вид: колющий, рубящий, дробящий, огонь, холод, яд и другие. Сопротивление делит урон пополам,
      уязвимость удваивает, иммунитет обнуляет. Временные хиты теряются первыми. Сервер учитывает всё это по шаблону
      существа; мастер описывает, как удар пришёлся.

  - id: rule.dropping_to_zero
    keywords: умирает смерть без сознания упал хиты death
    name: Ноль хитов и спасброски от смерти
    status: canon
    doc: "SRD 5.1: Dropping to 0 Hit Points"
    tags: [rule, death]
    topic: death
    text: >-
      Герой на 0 хитов падает без сознания и в начале каждого своего хода делает спасбросок от смерти (death_save):
      10 и больше — успех, меньше — провал; натуральная 20 — приходит в себя с 1 хитом, натуральная 1 — два провала.
      Три успеха — стабилизирован, три провала — смерть. Урон по лежащему — провал, критический — два. Если остаток урона
      после падения до 0 не меньше максимума хитов — мгновенная смерть. Существа на 0 хитов просто погибают.

  - id: rule.stabilize
    keywords: стабилизировать перевязать лечить поднять раненого медицина
    name: Стабилизация и лечение упавшего
    status: canon
    doc: "SRD 5.1: Stabilizing a Creature"
    tags: [rule, death, healing]
    topic: death
    text: >-
      Союзник может стабилизировать упавшего проверкой Мудрости (Медицина) сложности 10 или набором целителя.
      Любое лечение поднимает героя с 0 хитов. Стабилизированный через 1d4 часа приходит в себя с 1 хитом.

  - id: rule.resting
    keywords: отдых отдохнуть отдыхаем поспать сон ночлег привал лагерь rest
    name: Отдых
    status: canon
    doc: "SRD 5.1: Resting"
    tags: [rule, rest]
    topic: rest
    text: >-
      Короткий отдых — не меньше часа: герой тратит кости хитов и восстанавливает хиты, часть умений перезаряжается.
      Долгий отдых — 8 часов, не чаще раза в сутки: все хиты, половина костей хитов, ячейки заклинаний, снимается
      один уровень истощения. Прерванный боем или часом тяжёлой работы отдых не засчитывается. Инструмент: rest.

  - id: rule.grapple_shove
    keywords: схватить захватить толкнуть толкаю сбить повалить grapple
    name: Захват и толчок
    status: canon
    doc: "SRD 5.1: Grappling, Shoving a Creature"
    tags: [rule, combat, grapple]
    topic: combat
    text: >-
      Захват и толчок заменяют одну атаку. Захват: Атлетика нападающего против Атлетики или Акробатики цели; при успехе
      цель схвачена (condition.grappled), её скорость 0. Толчок: то же состязание, при успехе цель сбита с ног
      (condition.prone) или отброшена на зону. Размер цели — не больше чем на одну категорию крупнее.

  - id: rule.falling
    keywords: упасть прыгнуть прыгаю спрыгнуть обрыв высота
    name: Падение
    status: canon
    doc: "SRD 5.1: Falling"
    tags: [rule, hazard]
    topic: hazards
    text: >-
      Упавший получает 1d6 дробящего урона за каждые 10 футов высоты, не больше 20d6, и оказывается сбит с ног.
      Инструмент: apply_hazard с hazard.falling и высотой.

  - id: rule.suffocating
    keywords: нырнуть под водой утонуть дыхание дым
    name: Удушье и задержка дыхания
    status: canon
    doc: "SRD 5.1: Suffocating"
    tags: [rule, hazard]
    topic: hazards
    text: >-
      Задержать дыхание можно на 1 + модификатор Телосложения минут (не меньше 30 секунд). Потом существо выдерживает
      столько раундов, каков модификатор Телосложения (не меньше одного), и падает до 0 хитов. Учитывай через время
      сцены (advance_time) и шаблоны опасностей.

  - id: rule.vision_light
    keywords: темнота темно свет факел видеть
    name: Зрение и свет
    status: canon
    doc: "SRD 5.1: Vision and Light"
    tags: [rule, exploration]
    topic: exploration
    text: >-
      В слабом свете проверки Внимательности, завязанные на зрение, — с помехой. В темноте существо фактически ослеплено.
      Тёмное зрение позволяет видеть в темноте как в слабом свете, без цветов. Источник света — предмет из снаряжения
      или описание локации.

  - id: rule.hiding
    keywords: спрятаться прятаться прячусь красться крадусь скрытно тень hide stealth
    name: Скрытность и поиск
    status: canon
    doc: "SRD 5.1: Hiding"
    tags: [rule, exploration, stealth]
    topic: exploration
    text: >-
      Спрятаться можно, только если тебя не видно: укрытие, темнота, отвлечение. Проверка Скрытности против
      пассивной Внимательности наблюдателей (10 + модификатор) или их активного поиска. Атака или шум выдают
      спрятавшегося. Спрятанный атакует с преимуществом.

  - id: rule.social
    keywords: убедить убеждаю уговорить обмануть обманываю запугать угрожаю торговаться persuade deceive intimidate talk
    name: Социальное взаимодействие
    status: canon
    doc: "SRD 5.1: Social Interaction"
    tags: [rule, social]
    topic: social
    text: >-
      Отношение NPC — враждебное, нейтральное или дружелюбное. Убеждение, Обман или Запугивание решают исход, когда
      NPC сомневается; сложность зависит от отношения и цены просьбы: дружелюбный соглашается на простое без броска,
      враждебный — только на выгодное ему. Изменение отношения — update_entity с attitude.

  - id: rule.travel_time
    keywords: путешествие дорога идти идём время часов
    name: Время и путешествие
    status: canon
    doc: "SRD 5.1: Time, Travel Pace"
    tags: [rule, exploration, time]
    topic: exploration
    text: >-
      Игровое время идёт в движке: раунд — 6 секунд, короткий отдых — час, долгий — 8 часов. Путь пешком — около
      3 миль в час обычным шагом; быстрый шаг — помеха на пассивную Внимательность, медленный позволяет красться.
      Время сдвигает advance_time, эффекты с длительностью снимаются сами.

  - id: rule.spellcasting
    keywords: заклинание колдую магия концентрация ячейка cast
    name: Заклинания
    status: canon
    doc: "SRD 5.1: Casting a Spell"
    tags: [rule, magic]
    topic: magic
    text: >-
      Заклинание тратит ячейку своего круга или выше (заговоры — без ячеек). Концентрация: одно концентрационное заклинание
      за раз; при уроне — спасбросок Телосложения со сложностью 10 или половина урона, если больше, провал рвёт
      концентрацию. Сложность спасброска от заклинания — 8 + мастерство + модификатор заклинательной характеристики.
      Заклинания существуют только те, что есть в пакете.

  - id: rule.improvised
    keywords: кулак кулаком без оружия бросить предмет импровизированное
    name: Импровизированное оружие и безоружный удар
    status: canon
    doc: "SRD 5.1: Improvised Weapons, Unarmed Strike"
    tags: [rule, combat, attack]
    topic: combat
    text: >-
      Безоружный удар — 1 + модификатор Силы дробящего урона, мастерство применяется. Предмет, похожий на оружие,
      бьёт как это оружие; прочие предметы — 1d4 без бонуса мастерства. Нестандартный приём («сбить врага люстрой»)
      относи к атаке, толчку или проверке — новых чисел не вводи.
