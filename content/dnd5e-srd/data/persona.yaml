# Таблицы характера: черта, идеал, привязанность, слабость. Кнопка «Из таблиц пакета» в анкете характера
# (этап 9б) берёт по строке в пустые поля. Общие фэнтезийные таблицы для любого мира на базе SRD; пакет
# мира может дать свои таблицы того же слота, тогда берутся его строки.
# slot: trait — черта (в свободный текст), ideal — идеал (поле «Чего хочет»), bond — привязанность
# (поле «Тайна или долг»), flaw — слабость (поле «Противоречие»). for — только для героев с этими class_id
# или origin_id; без for — для всех.
kind: persona_table
items:
  - id: persona.traits
    name: Черты характера
    status: canon
    slot: trait
    rows:
      - Всегда говорит прямо, даже когда лучше промолчать.
      - Шутит в самый неподходящий момент, чтобы не показать страх.
      - Собирает мелкие безделушки из каждого места, где побывал.
      - Сначала слушает, потом говорит, и говорит мало.
      - Верит приметам и не начинает дела, не постучав по дереву.
      - Помнит каждое оскорбление и каждую услугу.
      - Не может пройти мимо чужой беды, даже если это ловушка.
      - Любит поесть и считает, что на голодный желудок дел не решают.
  - id: persona.ideals
    name: Идеалы
    status: canon
    slot: ideal
    rows:
      - Свобода. Никто не должен носить цепи, ни железные, ни долговые.
      - Честь. Данное слово дороже жизни.
      - Знание. Любую тайну можно и нужно раскрыть.
      - Семья. Всё, что я делаю, я делаю для своих.
      - Сила. Мир принадлежит тем, кто может его удержать.
      - Милосердие. Даже враг заслуживает второго шанса.
      - Слава. Хочу, чтобы обо мне пели в тавернах через сто лет.
      - Порядок. Без законов люди становятся зверьми.
  - id: persona.bonds
    name: Привязанности
    status: canon
    slot: bond
    rows:
      - Должен крупную сумму человеку, который не прощает долгов.
      - Ищет брата или сестру, пропавших много лет назад.
      - Хранит письмо, которое нельзя вскрывать до определённого дня.
      - Поклялся отомстить тому, кто сжёг родной дом.
      - Обязан жизнью наставнику и всё ещё выполняет его последнее поручение.
      - Скрывает, что когда-то служил тем, против кого теперь сражается.
      - Носит чужое имя, потому что своё опасно произносить.
      - Защищает место или людей, которых больше никто не защитит.
  - id: persona.flaws
    name: Слабости
    status: canon
    slot: flaw
    rows:
      - Храбр в бою, но боится принимать решения за других.
      - Не умеет отказывать, даже когда просьба явно вредна.
      - Презирает власть, но сам хочет командовать.
      - Добр к незнакомцам и груб с теми, кто рядом.
      - Не терпит, когда в нём сомневаются, и рискует, чтобы доказать своё.
      - Верит в честную игру, но жульничает, когда проигрывает.
      - Мечтает о покое и сам ищет неприятности.
      - Скрывает страх за гордостью и не просит помощи.
