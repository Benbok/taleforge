# Таблицы характера мира «Эхо Левиафанов» (этап 9б): развитие Claude по канону, действует, пока Arty не поправит.
# Заменяют общие таблицы SRD того же слота. Слоты и поля анкеты — как в dnd5e-srd/data/persona.yaml.
kind: persona_table
items:
  - id: persona.traits
    name: Черты характера
    status: canon
    doc: canon.md
    tags: [claude_draft]
    slot: trait
    rows:
      - Прислушивается к скрипу туши под ногами и по нему угадывает погоду.
      - Считает каждую каплю ликвора и не терпит, когда его проливают зря.
      - Звонит в карманный колокольчик, когда нервничает, и сам этого не замечает.
      - Говорит короткими фразами, как на шахте, где воздух дорог.
      - "Не спит без света: в темноте ему слышится эхо."
      - Держит при себе горсть пепла с Черты и никому не объясняет зачем.
      - Торгуется за всё, даже за то, что ему дарят.
      - Молится Исполинам вслух, но в чудеса не верит.
  - id: persona.ideals
    name: Идеалы
    status: canon
    doc: canon.md
    tags: [claude_draft]
    slot: ideal
    rows:
      - Выжить. Люди держались сорок лет одни и продержатся ещё.
      - Правда. Синдикаты лгут о том, что кормит Резонанс, и кто-то должен сказать это вслух.
      - Долг Кордону. Пока держится Пепельная черта, живут все остальные.
      - Свобода от шахт. Ни один ребёнок больше не спустится в забой.
      - Знание Левиафанов. Корабли помнят то, чего не помнят люди.
      - Богатство. Ликвор — это власть, а власть — это безопасность.
      - Милосердие к Сломленным. Они ещё люди, пока не стали матерями.
      - Тишина. Меньше желаний — меньше эха, меньше пищи для голода.
  - id: persona.bonds
    name: Привязанности
    status: canon
    doc: canon.md
    tags: [claude_draft]
    slot: bond
    rows:
      - Должен Синдикату Крови за лекарство, которое спасло сестру.
      - Ищет товарища по Кордону, который ушёл за Черту и не вернулся.
      - Хранит обломок живой обшивки, который иногда тёплый на ощупь.
      - Однажды слышал голос из глубины туши и поклялся узнать, чей он.
      - Тайно помогает Шахтёрскому подполью, хотя служит Гильдии.
      - Скрывает, что в нём уже звучит эхо Резонанса.
      - Обязан жизнью Кормчему и не знает, чем расплатится.
      - Мать ушла в Обитель Звона и дала обет молчания; он хочет услышать её ещё раз.
  - id: persona.flaws
    name: Слабости
    status: canon
    doc: canon.md
    tags: [claude_draft]
    slot: flaw
    rows:
      - Ненавидит Резонанс так, что готов сжечь и своих, лишь бы задеть его.
      - Не может пройти мимо ликвора, даже чужого.
      - Верит Церкви Исполинов, но боится, что Исполины давно мертвы.
      - Презирает шахтовладельцев, но сам мечтает о своей доле.
      - Боится тишины и заполняет её словами.
      - Жалеет Отзвучных и из-за этого медлит в бою.
      - Считает себя в долгу перед всеми и не умеет брать.
      - Храбрится перед отрядом и прячет, что эхо уже шепчет ему.
