# Тайны опорных туш и их NPC (скрытый уровень). Источник: locations.md#2.1–2.4.
# known_by_refs — кто знает с начала кампании (фракции или NPC). Раскрытие — через reveal_knowledge.
# Общие тайны мира (Протокол, спящие экипажи, сигнал флоту, причастие) — в secrets.yaml; здесь ссылки на них.
kind: campaign_secret
items:
# ================================================================ Тайны туш
- id: secret.old_mother_brood_ship
  name: Старая Мать — матка-носитель
  status: proposal
  doc: locations.md#2.1
  tags: [secret, old_mother, carcass]
  location_ref: location.old_mother
  text: 'Старая Мать — не транспорт, а матка-носитель передовой волны: в утробе она растила бортовые организмы для всего флота. Прилив — не пульс, а схватки. Она до сих пор рождает санитаров и нитевиков, поэтому в жилах их всегда больше, чем выжигают. У Сердца в коконе растёт Старшая.'
  known_by_refs: []
  reveal_hints: ['Санитаров в жилах всегда больше, чем выжигают', 'Прилив похож на схватки, а не на пульс', 'Кокон у Сердечной насосной']
  consequences: 'Проснувшись на стороне Резонанса, Старая Мать станет фабрикой выводков размером с город. На стороне экипажа — вернёт флоту рабочие организмы, и корабли Кольца начнут чинить себя.'
  related_secret_refs: [secret.carcasses_alive, secret.waking_choice]
- id: secret.drowned_relay
  name: Утопленник — ретранслятор
  status: proposal
  doc: locations.md#2.2
  tags: [secret, drowned, carcass, fleet]
  location_ref: location.drowned
  text: 'Утопленник — ретранслятор передовой волны. Его резонатор в хвосте лежит ближе всех к флоту в разломах. Если в его рубке проснётся экипаж или резонатор оживёт сам, сигнал услышит весь основной флот. Солёная мать знает это и растёт к резонатору.'
  known_by_refs: [creature.npc_salt_mother]
  reveal_hints: ['Обрывки сигналов из хвоста', 'Валик Яна Крохи', 'Приказ Протокола взорвать хвост']
  consequences: 'Если Солёная мать возьмёт корабль, сигнал подаст Резонанс, и флот поднимется навстречу голоду. Взрыв хвоста по Протоколу может сам стать сигналом: никто не знает.'
  related_secret_refs: [secret.fleet_signal]
- id: secret.whisperer_relics_are_cocoons
  name: Мощи ангелов — коконы Кормчих
  status: proposal
  doc: locations.md#2.3
  tags: [secret, whisperer, carcass, helmsmen]
  location_ref: location.whisperer_reliquary
  text: '«Мощи ангелов» в Ковчеге — коконы Кормчих. Из девяти трое живы. Ликвор для причастия качают из того же желудочка, где они спят. Возвышальня — гнездо: Иоаким растёт в мать прямо в мозжечке корабля. Хор, сам того не зная, глушит и Резонанс, и Спящих.'
  known_by_refs: []
  reveal_hints: ['Одна из мощей дышит', 'Стекло Ковчега запотевает изнутри', 'Записи кантора Филиппа']
  consequences: 'Закончив возвышение, Иоаким окажется ближе к рубке, чем любая мать в истории, и сможет перехватить корабль у экипажа. Если хор замолкнет, оба голоса станут громче.'
  related_secret_refs: [secret.communion_keeps_sleep, secret.sleeping_crews]
- id: secret.rib_forest_self_repair
  name: Рёберный лес чинит себя
  status: proposal
  doc: locations.md#2.4
  tags: [secret, rib_forest, carcass]
  location_ref: location.rib_forest
  text: 'Добычу бросили сто лет назад, и корабль чинит себя: грибница — бортовые ремонтники, которые наращивают новые ткани на старые кости, а в Костномозговом канале заново растёт нервный ствол. В канале есть кокон с живым пилотом, и Лиса говорит именно с ним. Корабль ещё не выбрал хозяина.'
  known_by_refs: [creature.npc_olkha, creature.npc_lisa]
  reveal_hints: ['Грибница светится в такт', 'Позвоночная тропа меняет форму за ночь', 'Санитары ремонта уносят всё чужое из канала']
  consequences: 'Живое доказательство, что без добычи корабли оживают. Савва ведёт в канал будущих Глубинных, чтобы голос Резонанса стал громче голоса пилота.'
  related_secret_refs: [secret.waking_choice, secret.carcasses_alive]
# ================================================================ Тайны NPC: Старая Мать
- id: secret.npc_agrafena_sold_towers
  name: Аграфена продаёт башни
  status: proposal
  doc: locations.md#2.1
  tags: [secret, npc, old_mother, cordon]
  location_ref: location.old_mother
  text: 'Аграфена Кострищева платит офицеру Кордона, чтобы тот сдавал башни: после каждой потери цена желе растёт.'
  known_by_refs: [creature.npc_agrafena_kostrishcheva]
  reveal_hints: ['Цена желе растёт после каждой потерянной башни', 'Платежи офицеру Кордона в книгах Дома']
  consequences: Кордон может порвать с Кострищевыми и с Синдикатами.
  related_secret_refs: [secret.war_as_market]
- id: secret.npc_miron_wants_sleeper
  name: Мирон слышит Спящего
  status: proposal
  doc: locations.md#2.1
  tags: [secret, npc, old_mother, sleeper]
  location_ref: location.old_mother_skull
  text: 'Мирон Лад, смотритель Тихого этажа, на Перемене 4. Он слышит Спящего из кокона под биржей и тайно хочет его разбудить.'
  known_by_refs: [creature.npc_miron_lad]
  reveal_hints: ['Стук из Тихого этажа во время прилива', 'Мирон нанимает чужаков вынести «оборудование»']
  consequences: Хранитель Протокола сам становится угрозой для него.
- id: secret.npc_efrosinya_diluted_reserves
  name: Разбавленные резервы
  status: proposal
  doc: locations.md#2.1
  tags: [secret, npc, old_mother, economy]
  location_ref: location.old_mother_skull
  text: 'Резервы банка Лимфатической компании разбавлены: половина флаконов в хранилище — подкрашенная лимфа.'
  known_by_refs: [creature.npc_efrosinya_velk]
  reveal_hints: ['Героям платят флаконами, которые оказываются лимфой']
  consequences: Раскрытие обрушит ФК.
- id: secret.npc_ulita_informant
  name: Улита выводит детей
  status: proposal
  doc: locations.md#2.1
  tags: [secret, npc, old_mother, underground]
  location_ref: location.old_mother_womb
  text: Улита Кривая — информатор подполья. Раз в месяц она выводит одного ребёнка из артели через стоки.
  known_by_refs: [creature.npc_ulita_krivaya, faction.miners_underground]
  reveal_hints: ['В артели Улиты раз в месяц не хватает одного', 'Следы в стоках Утробы']
  consequences: Если Дом узнает, Улиту казнят, а канал подполья закроют.
- id: secret.npc_pavel_herald
  name: Павел — Глашатай
  status: proposal
  doc: locations.md#2.1
  tags: [secret, npc, old_mother, herald]
  location_ref: location.old_mother_skull
  text: 'Счетовод биржи Павел Ровный — Глашатай стадии I. Его глазами видит мать из Сердечной насосной.'
  known_by_refs: [creature.npc_pavel_rovny, creature.npc_eldest]
  reveal_hints: ['Паника на торгах вспыхивает там, где стоит Павел', 'Проба ликвором']
  consequences: Мать знает всё, что происходит на бирже.
  note: 'В locations.md «мать из Сердечной насосной», а Старшая там ещё растёт в коконе. Видимо, речь о ней; нужно уточнение.'
# ================================================================ Тайны NPC: Утопленник
- id: secret.npc_varvara_island_chart
  name: Лоция Варвары
  status: proposal
  doc: locations.md#2.2
  tags: [secret, npc, drowned, islands]
  location_ref: location.drowned_rib_harbor
  text: 'Варвара Мель тайно вывозит беглецов на острова. У неё есть лоция до островов, которой нет больше ни у кого.'
  known_by_refs: [creature.npc_varvara_mel]
  reveal_hints: ['Беглецы на борту «Терпения»', 'Ида с Островов знает Варвару']
  consequences: Лоцию захотят все, кто ищет путь к островам.
- id: secret.npc_taras_charges
  name: Заряды в хвосте
  status: proposal
  doc: locations.md#2.2
  tags: [secret, npc, drowned, protocol]
  location_ref: location.drowned_abyss_tail
  text: 'У Тараса Горького приказ по Протоколу: если сигнал из хвоста повторится, взорвать хвост. Заряды уже заложены.'
  known_by_refs: [creature.npc_taras_gorky, faction.house_liquor]
  reveal_hints: ['Батискафы Дома возят ящики к хвосту', 'Приказ с печатью Совета']
  consequences: Взрыв затопит полпорта и, может быть, сам станет сигналом флоту.
  related_secret_refs: [secret.protocol_silence, secret.drowned_relay]
- id: secret.npc_yan_answer
  name: Ответ из разлома
  status: proposal
  doc: locations.md#2.2
  tags: [secret, npc, drowned, fleet, listeners]
  location_ref: location.drowned_flooded_womb
  text: 'Ян Кроха, тайный Слушатель, записал на валик ответ из разлома: флот что-то услышал.'
  known_by_refs: [creature.npc_yan_kroha]
  reveal_hints: ['Валик Яна', 'Слушатели Гильдии ищут батискафщика']
  consequences: 'Валик хотят Дом Ликвора, Гильдия и Кордон.'
  related_secret_refs: [secret.fleet_signal]
- id: secret.npc_ida_envoy
  name: Ида — посланница
  status: proposal
  doc: locations.md#2.2
  tags: [secret, npc, drowned, islands]
  location_ref: location.drowned_throat
  text: 'Ида с Островов — посланница общин. Она решает, можно ли помочь материку и кого из материковых можно пустить на острова.'
  known_by_refs: [creature.npc_ida_islands, faction.islanders]
  reveal_hints: ['Островитянка слишком долго не возвращается домой', 'Она расспрашивает о людях, а не о товаре']
  consequences: От её суждения о героях зависит, откроется ли путь к островам.
- id: secret.npc_salt_mother_origin
  name: Жена рыбака
  status: proposal
  doc: locations.md#2.2
  tags: [secret, npc, drowned, mother]
  location_ref: location.drowned_flooded_womb
  text: Солёная мать — бывшая жена рыбака, ушедшая к голоду 90 лет назад. Стражи клапанов служат ей.
  known_by_refs: []
  reveal_hints: ['Старые портовые записи о пропавшей', 'Стражи клапанов ведут себя слишком организованно']
  consequences: Мать — человек, а не просто чудовище.
# ================================================================ Тайны NPC: Шепчущий
- id: secret.npc_ioakim_mother
  name: Иоаким растёт в мать
  status: proposal
  doc: locations.md#2.3
  tags: [secret, npc, whisperer, invited]
  location_ref: location.whisperer_ascension
  text: 'Первосвященник Иоаким — Приглашённый. Его Скверна давно перешла Порог. Он хочет стать матерью внутри мозга корабля и отдать корабль Резонансу.'
  known_by_refs: [creature.npc_ioakim, creature.npc_anna_pilgrim]
  reveal_hints: ['Великое возвышение', 'Проба ликвором', 'Кресло в Возвышальне, которое держит']
  consequences: 'При раскрытии он принимает облик матери (Aboleth). Капитул раскалывается.'
  related_secret_refs: [secret.church_top_invited, secret.whisperer_relics_are_cocoons]
- id: secret.npc_malasha_registry
  name: Реестр Малаши
  status: proposal
  doc: locations.md#2.3
  tags: [secret, npc, whisperer, children]
  location_ref: location.whisperer_neck_cells
  text: Сестра Малаша ведёт тайный реестр детей, ушедших в Хоры и не вернувшихся.
  known_by_refs: [creature.npc_malasha]
  reveal_hints: ['Семеро детей ушли в Хоры за месяц']
  consequences: Реестр ведёт к Глубинным в слуховых каналах, которые кого-то зовут.
- id: secret.npc_demyan_breathing_relic
  name: Дышащая мощь
  status: proposal
  doc: locations.md#2.3
  tags: [secret, npc, whisperer, sleeper]
  location_ref: location.whisperer_reliquary
  text: 'Демьян Скала, страж Ковчега, на Перемене 3. Он видит, что одна из «мощей» дышит, и молчит.'
  known_by_refs: [creature.npc_demyan_skala]
  reveal_hints: ['Демьян просит тайно вскрыть витрину']
  consequences: Первая ниточка к правде о коконах Кормчих.
- id: secret.npc_filipp_choir_mutes
  name: Хор глушит мозг
  status: proposal
  doc: locations.md#2.3
  tags: [secret, npc, whisperer, listeners]
  location_ref: location.whisperer_choirs
  text: 'Кантор Филипп — Слушатель Гильдии. Он понял, что хор глушит шёпот мозга, и записывает то, что проходит сквозь пение.'
  known_by_refs: [creature.npc_filipp_cantor, faction.guild_listeners]
  reveal_hints: ['Записи кантора', 'Кантор против праздника Великого возвышения']
  consequences: 'Филипп знает: в день Великого возвышения хор должен замолчать.'
- id: secret.npc_anna_herald
  name: Анна — Глашатай
  status: proposal
  doc: locations.md#2.3
  tags: [secret, npc, whisperer, herald]
  location_ref: location.whisperer_porch
  text: 'Паломница Анна — Глашатай стадии II. Под одеждой у неё пластины. Она ищет в толпе Сломленных.'
  known_by_refs: [creature.npc_anna_pilgrim]
  reveal_hints: ['Пластины под одеждой', 'Приведённые ею паломники не возвращаются с возвышения']
  consequences: Раскрытие Анны выводит на Иоакима.
# ================================================================ Тайны NPC: Рёберный лес
- id: secret.npc_olkha_knows
  name: Ольха знает
  status: proposal
  doc: locations.md#2.4
  tags: [secret, npc, rib_forest]
  location_ref: location.rib_forest_thicket
  text: Ольха Тихая знает, что лес растёт на живом корабле, и скрывает это даже от Круга.
  known_by_refs: [creature.npc_olkha]
  reveal_hints: ['Ольха срывает обряды слушания']
  consequences: Круг расколется, если узнает, что старейшина молчала.
  related_secret_refs: [secret.rib_forest_self_repair]
- id: secret.npc_savva_invited
  name: Савва — Приглашённый
  status: proposal
  doc: locations.md#2.4
  tags: [secret, npc, rib_forest, invited]
  location_ref: location.rib_forest_marrow_canal
  text: 'Савва Гремучий — Приглашённый. Он уговаривает беглых детей «уйти к своим» в Костномозговой канал.'
  known_by_refs: [creature.npc_savva]
  reveal_hints: ['Беглые дети пропадают у входа в канал', 'Проба ликвором']
  consequences: 'Савва ведёт в канал будущих Глубинных. Дети — NPC: их спасают и прячут, в бою они не участвуют.'
  related_secret_refs: [secret.deepkin_are_children]
- id: secret.npc_lisa_sleeper_talks
  name: Лиса говорит со Спящим
  status: proposal
  doc: locations.md#2.4
  tags: [secret, npc, rib_forest, sleeper]
  location_ref: location.rib_forest_skull_chapel
  text: 'Лиса Сновидица каждую ночь говорит со Спящим из канала. Он просит ликвора и обещает «тишину без боли».'
  known_by_refs: [creature.npc_lisa]
  reveal_hints: ['Обряды слушания', 'Лиса носит ликвор в канал']
  consequences: 'Если пилот проснётся, Лиса станет Безмолвной.'
- id: secret.npc_praskovya_protocol_copy
  name: Копия донесения
  status: proposal
  doc: locations.md#2.4
  tags: [secret, npc, rib_forest, protocol]
  location_ref: location.rib_forest_spore_lowlands
  text: Мать Прасковья хранит копию донесения о Протоколе Тишины, которую ей передал человек Дома Ликвора.
  known_by_refs: [creature.npc_praskovya]
  reveal_hints: ['Прасковье нужен курьер в Старую Мать']
  consequences: Путь к решающему перелому «Протокол раскрыт».
  related_secret_refs: [secret.protocol_silence]
- id: secret.npc_prokhor_brand
  name: Клеймо Прохора
  status: proposal
  doc: locations.md#2.4
  tags: [secret, npc, rib_forest, broken]
  location_ref: location.rib_forest_spine_path
  text: Прохор Ржавый — сам бывший шахтёр и Сломленный. Он скрывает клеймо под перчатками.
  known_by_refs: [creature.npc_prokhor]
  reveal_hints: ['Он не снимает перчаток', 'Прохор узнаёт старые шахтёрские жесты']
  consequences: Охотника можно переманить или сломать.
