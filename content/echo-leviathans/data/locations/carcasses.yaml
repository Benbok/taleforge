# ================================================================ Рёберный лес
- id: location.rib_forest
  name: Рёберный лес
  description: 'Скелет корабля длиной 5 миль, выработанный больше ста лет назад. Рёбра до 600 футов стоят как стволы, между ними поднялась грибница: белые шляпки с дом, светящиеся нити, споровые туманы.'
  status: proposal
  canon_parts: [Рёберный лес — приют Сломленных (canon.md#7), Круг из трёх течений Сломленных (canon.md#5.4)]
  doc: locations.md#2.4; canon.md#7
  tags: [hulk, anchor, skeleton, refuge]
  location_type: hulk
  belt: old_lands
  parent_ref: location.belt_old_lands
  distance_from_rim_miles: 470
  direction: юго-запад
  size: {length_miles: 5, rib_height_ft: 600}
  population: 3000
  ruler: 'Никто. Решает Круг — совет Сломленных трёх течений: те, кто хочет лечения; кто слушает зов Резонанса; кто слушает сны экипажей. Шахтёрское подполье держит здесь базу. Синдикаты посылают охотников за беглыми, Гильдия — вербовщиков.'
  faction_ref: faction.broken
  faction_refs: [faction.miners_underground, faction.house_kostrishchev, faction.guild]
  district_refs: [location.rib_forest_thicket, location.rib_forest_spine_path, location.rib_forest_pelvic_bowl, location.rib_forest_skull_chapel, location.rib_forest_marrow_canal, location.rib_forest_spore_lowlands]
  adjacency:
  - [location.rib_forest_spine_path, location.rib_forest_thicket]
  - [location.rib_forest_spine_path, location.rib_forest_skull_chapel]
  - [location.rib_forest_spine_path, location.rib_forest_pelvic_bowl]
  - [location.rib_forest_spine_path, location.rib_forest_marrow_canal]
  - [location.rib_forest_thicket, location.rib_forest_spore_lowlands]
  - [location.rib_forest_pelvic_bowl, location.rib_forest_spore_lowlands]
  hazard_refs: [hazard.spore_fog, hazard.sleeper_cocoon, hazard.parasite_nest]
  encounter_table_ref: encounter.rib_forest
  encounter_check: {every_hours: 6, on_d6: [1], deep_zones: {district_refs: [location.rib_forest_spore_lowlands, location.rib_forest_marrow_canal], every_hours: 2, on_d6: [1, 2]}}
  npc_refs: [creature.npc_olkha, creature.npc_savva, creature.npc_lisa, creature.npc_praskovya, creature.npc_prokhor]
  secret_refs: [secret.rib_forest_self_repair]
  lore_refs: [lore.loc_rib_forest_circle, lore.loc_rib_forest_pelvic_lake]
  hooks:
  - name: Облава
    text: 'Прохор с отрядом стоит у Позвоночной тропы и требует выдать беглых. Круг спорит, Савва предлагает спрятать детей «внизу».'
    location_ref: location.rib_forest_spine_path
    npc_refs: [creature.npc_prokhor, creature.npc_savva, creature.child_runaway]
  - name: Обряд слушания
    text: Лиса зовёт героев на обряд. Каждый обряд двигает часы пробуждения, и Ольха просит его сорвать.
    location_ref: location.rib_forest_skull_chapel
    npc_refs: [creature.npc_lisa, creature.npc_olkha]
    do:
    - {op: clock, clock_ref: clock.carcass_awakening, delta: 1, note: каждый проведённый обряд}
  - name: Листовка
    text: Прасковье нужен курьер в Старую Мать с копией Протокола.
    npc_refs: [creature.npc_praskovya]
    route_ref: location.route_old_mother_rib_forest
  awakening:
    clock_ref: clock.carcass_awakening
    start: 1
    signs:
    - {at: 0, text: 'Просто кости и грибы.'}
    - {at: 1, text: 'Грибница светится в такт, раз в сутки. Звери обходят лес.'}
    - {at: 2, text: 'Между рёбрами натягиваются новые волокна. Позвоночная тропа меняет форму за ночь.'}
    - {at: 3, text: 'Санитары ремонта уносят всё чужое из канала. На костях нарастает хитин.'}
    - {at: 4, text: 'Рёбра сходятся, дома в дуплах трещат. Лес начинает «дышать».'}
    - {at: 5, text: 'Перелом: скелет встаёт. Лес поднимается на ноги, жители падают с рёбер.', pivot: true}
  pivots:
  - name: Облава удалась
    changes: 'Круг рассеян, подполье уходит. Лес пустеет, в нём остаются только Савва и зов.'
  - name: Савва победил
    changes: 'Лес — тайное гнездо. Сломленные уходят в канал.'
    becomes: swarm_nest
    hazard_refs_add: [hazard.swarm_nest]
    ruler_faction_ref: faction.resonance
  - name: Пилот разбужен
    changes: 'Кормчий в лесу. Лиса становится Безмолвной. Лес — первая союзная или враждебная база экипажа.'
    faction_refs_add: [faction.helmsmen]
  - name: Протокол раскрыт отсюда
    secret_ref: secret.protocol_silence
    changes: 'Лес становится символом подполья. Синдикаты шлют войска.'
  - name: Преображение
    changes: 'Грибница становится Цветением первой. Лес — сад, куда приходят лечиться от Скверны.'
    hazard_refs_add: [hazard.bloom]

