# Четыре опорные туши (location_type: hulk) и их районы (location_type: district, parent_ref на тушу).
# Источник: locations.md#2. Часы пробуждения — clock.carcass_awakening (state туши, 0–5).
# awakening.signs — что мастер описывает на каждом значении; приложение двигает часы.
# pivots — как место меняется после переломов (living-lore.md#7, pivot_templates).
# becomes: swarm_nest — локация меняет шаблон на «гнездо роя» (hazard.swarm_nest).
kind: location_template
items:
# ================================================================ Старая Мать
- id: location.old_mother
  name: Старая Мать
  description: 'Столица Синдикатов на спине самого большого корабля материка: 7 миль от морды до хвоста, спина на 1200 футов над равниной. Верхний город на позвоночнике, трущобы в рёбрах, биржа ФК в черепе.'
  status: proposal
  canon_parts: [Старая Мать — столица Синдикатов (canon.md#7), Правит Совет трёх Домов]
  doc: locations.md#2.1; canon.md#7
  tags: [hulk, anchor, city, capital]
  location_type: hulk
  belt: middle_belt
  parent_ref: location.belt_middle
  distance_from_rim_miles: 220
  direction: запад
  size: {length_miles: 7, height_ft: 1200}
  population: 400000
  ruler: 'Совет трёх Домов. Лимфатическая компания — магистрат, банк и Сердце; Кострищевы — Утроба, железная дорога и Хвост; Дом Ликвора — Череп и всё ниже биржи. Церковь — три храма и больница для бедных, Гильдия — клиники и школа эхолокаторщиков, подполье — в слободах.'
  faction_ref: faction.syndicates
  faction_refs: [faction.house_kostrishchev, faction.house_liquor, faction.lymph_company, faction.church, faction.guild, faction.miners_underground]
  district_refs: [location.old_mother_spine, location.old_mother_skull, location.old_mother_rib_slums, location.old_mother_womb, location.old_mother_heart, location.old_mother_tail]
  adjacency:
  - [location.old_mother_spine, location.old_mother_skull]
  - [location.old_mother_spine, location.old_mother_rib_slums]
  - [location.old_mother_spine, location.old_mother_tail]
  - [location.old_mother_rib_slums, location.old_mother_womb]
  - [location.old_mother_womb, location.old_mother_heart]
  - [location.old_mother_womb, location.old_mother_tail]
  - [location.old_mother_skull, location.old_mother_heart]
  hazard_refs: [hazard.corpse_gas, hazard.infected_blood, hazard.parasite_nest, hazard.titan_meat]
  encounter_table_ref: encounter.old_mother
  encounter_check: {every_hours: 4, on_d6: [1], deep_zones: {district_refs: [location.old_mother_womb], every_hours: 4, on_d6: [1, 2]}}
  npc_refs: [creature.npc_agrafena_kostrishcheva, creature.npc_miron_lad, creature.npc_efrosinya_velk, creature.npc_ulita_krivaya, creature.npc_pavel_rovny, creature.npc_eldest]
  secret_refs: [secret.old_mother_brood_ship]
  lore_refs: [lore.loc_old_mother_tide_heart, lore.loc_old_mother_quiet_floor]
  hooks:
  - name: Норма
    text: 'В жиле обвал, артель Улиты заперта. Синдикат не станет копать, пока не посчитает убытки. Герои спасают детей или берут контракт Кострищевых на «зачистку жилы» от санитаров.'
    location_ref: location.old_mother_womb
    npc_refs: [creature.npc_ulita_krivaya, creature.child_miner]
  - name: Фальшивый флакон
    text: Героям платят флаконами, которые оказываются лимфой. След ведёт в хранилище Лимфатической компании.
    npc_refs: [creature.npc_efrosinya_velk]
    secret_ref: secret.npc_efrosinya_diluted_reserves
  - name: Шум под биржей
    text: Во время прилива из Тихого этажа слышен стук изнутри. Мирон Лад нанимает героев вынести «оборудование», и это кокон.
    location_ref: location.old_mother_skull
    npc_refs: [creature.npc_miron_lad]
  awakening:
    clock_ref: clock.carcass_awakening
    start: 1
    signs:
    - {at: 0, text: 'Туша молчит. Прилив едва заметен.'}
    - {at: 1, text: 'Прилив раз в сутки, шахты закрывают на час. В слободах качаются короба.'}
    - {at: 2, text: 'Прилив дважды в сутки. Санитаров в жилах вдвое больше. На бирже падают бокалы.'}
    - {at: 3, text: 'Стук из Тихого этажа. Сердце бьётся слышно на весь город. Санитары-стражи выходят к жилым кварталам.'}
    - {at: 4, text: 'Опоры под брюхом скребут землю. Рвутся рельсы Хребтовой магистрали. Паника, бегство из Утробы.'}
    - {at: 5, text: 'Перелом: Старая Мать поднимается. Город на спине рушится.', pivot: true}
  pivots:
  - name: Протокол Тишины раскрыт
    secret_ref: secret.protocol_silence
    changes: 'Бунты в слободах. Совет Домов раскалывается. Подполье выходит на улицы.'
    encounter_changes: ['+ строка «толпа» (Commoner ×10, srd)', 'Патрули удваиваются (строка 1–2: count ×2)']
  - name: Дом пал (любой)
    changes: 'Район павшего Дома переходит к другим Домам или подполью. NPC Дома — в бегах или в тюрьме.'
  - name: Туша проснулась, экипаж
    changes: 'Город сползает со спины. Хребет — руины, Утроба закрыта. Кормчие требуют «тишины»: гудки запрещены.'
    ruler_faction_ref: faction.helmsmen
  - name: Туша проснулась, Резонанс
    changes: 'Старшая становится матерью. Утроба — гнездо, город — фронт.'
    becomes: swarm_nest
    hazard_refs_add: [hazard.swarm_nest, hazard.blight]
    ruler_faction_ref: faction.resonance
  - name: Падение черты (резонанс 10)
    changes: 'Старая Мать — последний большой бастион. Беженцы с Кольца, военное положение.'
  - name: Преображение
    changes: 'Сердце перестаёт биться для насосной. В Утробе прорастает Цветение. Биржа пустеет.'
    hazard_refs_add: [hazard.bloom]

