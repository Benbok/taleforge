  hooks:
  - name: Дышащая мощь
    text: Демьян просит героев тайно вскрыть витрину. Внутри — кокон, и в нём кто-то живой.
    location_ref: location.whisperer_reliquary
    npc_refs: [creature.npc_demyan_skala]
  - name: Список Малаши
    text: 'Семеро детей ушли в Хоры за месяц. Герои спускаются в слуховые каналы и находят следы Глубинных, которые кого-то зовут. Дети — NPC: их выводят и прячут, в бою они не участвуют.'
    location_ref: location.whisperer_choirs
    npc_refs: [creature.npc_malasha, creature.child_runaway]
  - name: Великое возвышение
    text: Иоаким объявляет праздник и зовёт паломников со всего Кольца. Кантор Филипп знает, что в этот день хор должен замолчать.
    npc_refs: [creature.npc_ioakim, creature.npc_filipp_cantor]
  awakening:
    clock_ref: clock.carcass_awakening
    start: 2
    start_reason: мозг «шумит»
    signs:
    - {at: 0, text: 'Череп молчит, хор поёт в пустоту.'}
    - {at: 1, text: 'Череп гудит в тишине.'}
    - {at: 2, text: 'Паломники видят одинаковые сны о холоде и тишине. Причастие действует слабее.'}
    - {at: 3, text: 'Стекло Ковчега запотевает изнутри. Хор сбивается, в пении слышен чужой ритм.'}
    - {at: 4, text: 'Глазницы черепа светятся. Шейные позвонки скрипят, кельи трескаются.'}
    - {at: 5, text: 'Перелом: Шепчущий поднимает голову. Собор рушится или оказывается на высоте 2000 футов.', pivot: true}
  pivots:
  - name: Иоаким раскрыт или убит
    changes: 'Капитул раскалывается. Низшее духовенство и Малаша берут Собор. Возвышение запрещено.'
    ruler_faction_ref: faction.church_lower_clergy
  - name: Иоаким стал матерью
    changes: 'Собор — гнездо. Паломники становятся ходоками.'
    becomes: swarm_nest
    hazard_refs_add: [hazard.swarm_nest]
    ruler_faction_ref: faction.resonance
  - name: Спящие разбужены
    changes: 'Кормчие в Соборе. Церковь делится: одни падают на колени перед «ангелами», другие видят чужаков.'
    faction_refs_add: [faction.helmsmen]
  - name: Туша проснулась, Резонанс
    changes: 'Корабль уходит к кратеру и становится самой большой матерью у кромки.'
    ruler_faction_ref: faction.resonance
  - name: Падение черты
    changes: 'Шепчущий — первый город на пути волн. Паломничий тракт — дорога беженцев.'
  - name: Преображение
    changes: 'Хор поёт тише, и в тишине слышен Отклик. Паперть зарастает Цветением.'
    hazard_refs_add: [hazard.bloom]

