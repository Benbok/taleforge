# ================================================================ Утопленник
- id: location.drowned
  name: Утопленник
  description: 'Корабль длиной 4 мили, выходивший из моря, когда флот застыл. Голова на берегу южного побережья, хвост уходит под воду к разлому Пасть. Порт контрабандистов и батискафщиков.'
  status: proposal
  canon_parts: [Утопленник наполовину в море (canon.md#7)]
  doc: locations.md#2.2; canon.md#7
  tags: [hulk, anchor, port, coast]
  location_type: hulk
  belt: old_lands
  parent_ref: location.belt_old_lands
  distance_from_rim_miles: 800
  direction: юг, берег
  size: {length_miles: 4, above_water_miles: 2}
  population: 30000
  ruler: 'Официально — концессия Дома Ликвора (голова и шахта). На деле порт держит Капитанская управа — совет капитанов и контрабандистов. Гильдия держит станцию батискафов. Кордона нет. Местный князь берёт пошлину и не вмешивается.'
  faction_ref: faction.house_liquor
  faction_refs: [faction.guild, faction.guild_listeners, faction.islanders]
  near_ref: location.hook_maw_rift
  district_refs: [location.drowned_lighthouse, location.drowned_throat, location.drowned_rib_harbor, location.drowned_flooded_womb, location.drowned_surf_vertebrae, location.drowned_abyss_tail]
  adjacency:
  - [location.drowned_lighthouse, location.drowned_throat]
  - [location.drowned_throat, location.drowned_rib_harbor]
  - [location.drowned_rib_harbor, location.drowned_flooded_womb]
  - [location.drowned_rib_harbor, location.drowned_surf_vertebrae]
  - [location.drowned_flooded_womb, location.drowned_abyss_tail]
  - [location.drowned_surf_vertebrae, location.drowned_abyss_tail]
  hazard_refs: [hazard.parasite_nest, hazard.infected_blood, hazard.corpse_gas]
  encounter_table_ref: encounter.drowned
  encounter_check: {every_hours: 6, on_d6: [1], deep_zones: {district_refs: [location.drowned_flooded_womb, location.drowned_abyss_tail], every_hours: 1, on_d6: [1, 2]}}
  npc_refs: [creature.npc_varvara_mel, creature.npc_taras_gorky, creature.npc_yan_kroha, creature.npc_ida_islands, creature.npc_salt_mother]
  secret_refs: [secret.drowned_relay]
  lore_refs: [lore.loc_drowned_tide, lore.loc_drowned_wet_liquor]
  hooks:
  - name: Мокрый ликвор
    text: Тарас нанимает героев сопроводить батискаф в Затопленную утробу. Там стражи клапанов, и они ведут себя слишком организованно.
    location_ref: location.drowned_flooded_womb
    npc_refs: [creature.npc_taras_gorky]
  - name: Пароход «Терпение»
    text: Варвара ищет охрану для рейса на острова. На борту беглецы, в трюме — чей-то кокон.
    npc_refs: [creature.npc_varvara_mel]
    route_ref: location.route_salt_hook_islands
  - name: Валик Яна
    text: Ян пропал, валик у героев. Его хотят Дом Ликвора, Гильдия и Кордон.
    npc_refs: [creature.npc_yan_kroha]
    secret_ref: secret.npc_yan_answer
  awakening:
    clock_ref: clock.carcass_awakening
    start: 2
    start_reason: затопленная половина не выработана
    signs:
    - {at: 0, text: 'Туша молчит.'}
    - {at: 1, text: 'Прилив сильнее морского. Рыба уходит из бухты.'}
    - {at: 2, text: 'Вода в утробе тёплая. Эхолокаторы ловят обрывки сигналов из хвоста.'}
    - {at: 3, text: 'Косатки и крабы-санитары выходят к причалам. Хвост шевелится под водой, волны без ветра.'}
    - {at: 4, text: 'Резонатор гудит так, что лопаются стёкла маяка. На Рифовой спине в море открываются глаза.'}
    - {at: 5, text: 'Перелом: Утопленник вытаскивает себя на берег или уходит в море. Сигнал уходит к флоту.', pivot: true}
  pivots:
  - name: Хвост взорван
    changes: 'Порт затоплен наполовину. Дом Ликвора уходит.'
    roll: 'Сигнал: бросок по сценарию — услышал флот или нет.'
    secret_ref: secret.npc_taras_charges
  - name: Солёная мать убита
    changes: 'Стражи клапанов бегут в море. Затопленная утроба открыта, мокрый ликвор дешевеет.'
    encounter_changes: ['Строки 5 и «резонанс ≥4» (стражи клапанов) убираются']
  - name: Туша проснулась, экипаж
    changes: 'Флот поднимается из разломов (большой перелом кампании). Побережье под властью Кормчих.'
    secret_ref: secret.fleet_signal
    ruler_faction_ref: faction.helmsmen
  - name: Туша проснулась, Резонанс
    changes: 'Солёная мать — хозяйка корабля. Берег становится новым фронтом, налёт идёт из моря.'
    becomes: swarm_nest
    hazard_refs_add: [hazard.swarm_nest, hazard.blight]
    ruler_faction_ref: faction.resonance
  - name: Путь к островам открыт
    changes: 'Острова — новая локация. Ида ведёт переговоры.'
    unlocks_ref: location.islands
  - name: Преображение
    changes: 'Бухта светлеет. Рыба возвращается. Острова открывают порты.'
    hazard_refs_add: [hazard.bloom]

