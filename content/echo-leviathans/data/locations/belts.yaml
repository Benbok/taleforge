# ---------------------------------------------------------------- Кольцо Паломников
- id: location.belt_pilgrim_ring
  name: Кольцо Паломников
  description: Десятки кораблей, стоящих плотно, мордами к кратеру. Больше всего ликвора и Глубинных; туши ближе всего к пробуждению.
