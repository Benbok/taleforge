# Пояса материка, море и острова, малые места-зацепки внутри поясов.
# Источник: locations.md#1 (главный), canon.md#7. Расстояния — в милях от кромки кратера.
# location_type: region (пояс), strip (полоса внутри пояса), hook (место-зацепка).
# Зацепки появляются через create_location только в границах своего пояса (parent_ref).
kind: location_template
items:
# ---------------------------------------------------------------- Старые земли
- id: location.belt_old_lands
  name: Старые земли и прибрежье
  description: 'Самый большой и самый пустой пояс: остатки королевств, поглощённые провинции с мёртвой почвой, порты и рыбацкие деревни у мёртвого моря.'
  status: proposal
  canon_parts: [Пояс и его содержание (canon.md#7), Прибрежье — часть Старых земель]
  doc: locations.md#1.3; canon.md#7
  tags: [region, belt, old_lands]
  location_type: region
  belt: old_lands
  distance_from_rim_miles: [400, 850]
  transport:
    roads: Старые королевские тракты, местами разбитые тушами 352 года назад
    rail: 'Две ветки Синдикатов: Береговая (Старая Мать → Утопленник) и Лесная (до Рёберного леса)'
