# ---------------------------------------------------------------- Средний пояс
- id: location.belt_middle
  name: Средний пояс
  description: Больше всего людей и туш-городов. Города Синдикатов на спинах туш, железные дороги вдоль хребтов, заводы на желе.
  status: proposal
