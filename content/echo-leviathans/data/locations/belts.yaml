  tags: [region, belt, pilgrim_ring]
  location_type: region
  belt: pilgrim_ring
  distance_from_rim_miles: [3, 60]
  overlaps_ref: location.belt_ash_line
  transport:
    roads: Паломничий тракт Церкви и шахтёрские тропы по тушам
    rail: Кончаются на станции Последний перрон, в 50 милях от кромки. Дальше — вагонетки внутри туш
    telegraph: Держится на ретрансляторах с ликворными лампами. Телеграфисты «тихнут» (Перемена)
    airships: Курьеры Синдикатов, редко. Над кратером они — цель летающих выводков
  dangers: [Глубинные, Шёпот, Пробуждение туш, Прорвавшиеся волны, Спасброски против Скверны тяжелее]
  ruler: Концессии Домов, прежде всего Дома Ликвора. Церковь владеет Шепчущим и трактом.
  faction_ref: faction.house_liquor
  faction_refs: [faction.church]
  hazard_refs: [hazard.whisper_colony, hazard.parasite_nest, hazard.sleeper_cocoon, hazard.corpse_gas]
  encounter_table_ref: encounter.pilgrim_ring
  note: 'Сложность спасбросков против Скверны здесь растёт с резонансом — правило в clock.resonance_power (location_belt: pilgrim_ring).'

