  doc: locations.md#1.3; canon.md#7
  tags: [region, belt, middle_belt]
  location_type: region
  belt: middle_belt
  distance_from_rim_miles: [60, 400]
  transport:
    roads: Мощёные тракты между тушами, мосты-позвонки над лимфатическими болотами
    rail: Густая сеть. Хребтовая магистраль идёт от Старой Матери к Кольцу по спинам туш
    rail_route_refs: [location.route_old_mother_whisperer]
    telegraph: Везде, узлы в каждом городе
    airships: Регулярные рейсы Синдикатов, грузовые баржи с хитином и желе
  dangers: [Заводской смог, Банды трущоб, Долговое рабство, Ломка, Глашатаи в толпе, Прорывы стоков с кровяными медузами]
  ruler: Три Дома Синдикатов. Каждый город-туша — концессия одного из Домов.
