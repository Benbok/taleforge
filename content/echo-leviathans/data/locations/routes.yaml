  description: 'Общая мера пути через весь материк: от кромки кратера до моря. Служит для оценки любых дальних переходов.'
  status: proposal
  canon_parts: ['Материк размером с Европу; до берега несколько недель пешком или пара дней поездом']
  doc: locations.md#1.1; canon.md#7
  tags: [route, scale]
  location_type: route
  belt: crater
  from_ref: location.belt_crater
  to_ref: location.belt_old_lands
  distance_miles: [750, 900]
  speeds:
    foot_road_miles_per_day: 20
    foot_offroad_or_carcass_miles_per_day: 12
    train_mph_avg: 20
    airship_mph: 45
  travel:
    foot: {weeks: [6, 7]}
    train: {hours: 45}
    airship: {hours: 20}

