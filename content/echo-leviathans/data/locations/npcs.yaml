- id: creature.npc_eldest
  name: Старшая
  description: 'Глубинная, ушедшая в жилы около 70 лет назад. Взрослая. Растёт в коконе у Сердца, чтобы стать матерью и забрать тушу.'
  status: proposal
  doc: locations.md#2.1
  tags: [npc, unique, echoed, caste_deep, adult_only, future_mother, boss, old_mother]
  base_ref: creature.deepkin_elder
  srd_ref: {type: monster, name: Ghast}
  cr: 2
  transforms_to_ref: creature.mother_human
  transform_when: 'Туша проснулась на стороне Резонанса, или кокон дозрел (решает мастер по сценарию)'
  behavior: {profile: capturer, nonlethal: true, flee_threshold: 0.2}
  faction_ref: faction.resonance
  location_ref: location.old_mother_heart
  goal: Вырасти в мать и забрать тушу.
  secret_ref: secret.old_mother_brood_ship
  note: 'В locations.md шаблон Ghast (ПО 2), у base_ref creature.deepkin_elder основа Ghoul (ПО 3). После перерождения — Aboleth (ПО 10), creature.mother_human.'

