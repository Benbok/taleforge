# Вторая раса поверх человеческого происхождения (lineage_overlay), получаемая только через Порог с сохранением личности.
# Канон: трансформация с сохранением личности даёт преимущества обеих рас (open-questions #10). Числа — предложение.
kind: lineage
items:
  - id: lineage.kept_self
    name: Сохранивший себя
    description: Перерождённый Отзвучный, удержавший сознание на испытании Порога. Сохраняет класс, уровень, характеристики, все черты человеческого происхождения и эхо.
    status: canon
    doc: rules.md#3.4
    tags: [lineage, swarm, threshold]
    overlay: true
    keeps: [class, level, abilities, origin_features, echo, swarm_gifts]
    gained_via_ref: effect.threshold_trial
    variants:
      - {id: rupture, name: Разрыв, note: "связь с матерью оборвана, шкалы Зова роя нет"}
      - {id: kept_self, name: Сохранил себя, note: "есть шкала Зова роя (stat.hive_call)"}
    # Каста — какое желание чуть не поглотило героя на Пороге (таблица «Раскол», rules.md#3.4). Выбирается один раз
    # при переходе, даёт одну черту поверх общих. Каста Глубинных — только дети-шахтёры, героям недоступна.
    castes:
      - id: herald
        name: Глашатай
        desire: власть, ложь
        description: Голод поймал вас на жажде власти. Вы по-прежнему чувствуете, чего хотят люди, и умеете говорить их голосом.
        status: proposal
        features:
          - name: Чужое лицо
            text: "Владение Обманом. Преимущество на проверки Проницательности: вы слышите желания собеседника."
            modifiers:
              - {op: proficiency, kind: skill, value: deception}
              - {op: advantage, "on": check, skill: insight}
      - id: warrior
        name: Воитель
        desire: месть, гнев
        description: Голод вырос из вашей ярости. Хитин лёг на вас толще, чем на других, а тело помнит штурм.
        status: proposal
        features:
          - name: Панцирь воителя
            text: "+1 к КД. Владение Атлетикой."
            modifiers:
              - {op: add, target: ac, value: 1}
              - {op: proficiency, kind: skill, value: athletics}
      - id: weaver
        name: Ткач
        desire: накопление, покой
        description: Голод зацепился за жадность или тоску по своему углу. Налёт для вас — дом, и вы видите, что в нём спрятано.
        status: proposal
        features:
          - name: Кровь налёта
            text: "Сопротивление урону ядом. Владение Анализом."
            modifiers:
              - {op: resistance, damage: poison}
              - {op: proficiency, kind: skill, value: investigation}
    features:
      - name: Тело роя
        status: proposal
        text: "Природная броня: КД 13 + Лов, если нет доспехов. Все принятые дары остаются."
        modifiers:
          - {op: set, target: ac_base, value: "13 + dex_mod", if: {no_armor: true}}
      - name: Эхо-зрение
        status: proposal
        modifiers:
          - {op: sense, sense: blindsight, range: 30}
      - name: Шёпот
        status: proposal
        modifiers:
          - op: custom
            engine: dev_request
            need: "значение sense: telepathy (в enum sense только darkvision|blindsight|tremorsense)"
            text: "Телепатия 30 футов."
            draft: {op: sense, sense: telepathy, range: 30}
      - name: Без Скверны
        status: proposal
        text: "Шкала Скверны обнуляется и больше не растёт; её место занимает Зов роя."
        modifiers:
          - {op: set, target: corruption, value: 0}
          - {op: immunity, condition: effect.corruption_exposure, text: "Скверна больше не растёт (заражение телесным путём)"}
          - {op: immunity, condition: effect.corruption_exposure_mental, text: "Скверна больше не растёт (ментальный путь)"}
      - name: Слабости роя
        status: proposal
        modifiers:
          - {op: vulnerability, damage: fire}
          - {op: disadvantage, "on": attack, if: {in_zone: effect.loud_noise}}
      - name: Чужой среди своих
        status: proposal
        text: "Кордон и Церковь охотятся на таких. Выводки и Отзвучные принимают вас за своего, пока вы не нападёте (параметр treats_as_own профиля effect.behavior_captor)."
        modifiers:
          - {op: add, target: check_dc, vs: social, value: 5, if: {crowded_place: true, unmasked: true}, text: "В людном месте без маски или маскировки — сложность всех социальных проверок +5"}
      - name: Эхо роя
        status: proposal
        modifiers:
          - {op: add, target: echo_hunger_cost, value: -1, min_total: 1}
          - op: custom
            engine: dev_request
            need: "op открытия сюжета/квеста (unlock_story: <id>) и запись квеста в пакете; триггер resource_changed с if stat_gte {echo_attunement: 5} уже выразим"
            text: "При настрое +5 открывается сюжетный квест возвращения («вспомнить себя до конца»)."
            draft: {"on": resource_changed, if: {stat_gte: {echo_attunement: 5}}, do: [{op: unlock_story, story: kept_self_return}]}
      - name: Зов роя
        status: proposal
        text: "Шкала 0–3 (кроме варианта «Разрыв»). На 3 — снова испытание Порога."
        stat_ref: stat.hive_call
        modifiers: []
        note: "На 3 Зова — effect.threshold_trial: триггер resource_changed у stat.hive_call (общий для всех носителей шкалы)."
        triggers:
          - "on": long_rest
            if: {any: [{mother_within_miles: 1}, {on_hazard: hazard.blight}]}
            do: [{op: save, stat: wis, dc: 12, on_fail: [{op: resource, stat: hive_call, delta: 1}]}]
          - "on": echo_technique_used
            if: {side: hunger}
            do: [{op: resource, stat: hive_call, delta: 1}]
          - "on": long_rest
            if: {all: [{not_near: hazard.blight}, {echo_attunement_gte: 3}]}
            do: [{op: resource, stat: hive_call, delta: -1}]

  - id: lineage.kept_heart
    name: Сохранивший сердце
    description: Человек, которого ликвор перестроил почти в Кормчего, но который сохранил чувства и привязанности. Зеркало «Сохранившего себя». Сохраняет класс, уровень, характеристики, черты происхождения и эхо.
    status: canon
    doc: rules.md#3.5
    tags: [lineage, pilot, alteration, threshold]
    overlay: true
    keeps: [class, level, abilities, origin_features, echo]
    size: medium
    gained_via_ref: effect.silence_threshold_trial
    # Каста — чья память Кормчих пришла с ликвором на Пороге тишины (races.md#1.4). Выбирается один раз при переходе,
    # даёт одну черту поверх общих. Память пилотов в коконах слишком глубока: героям она недоступна.
    castes:
      - id: voice
        name: Звучащий
        role: навигация, связь, язык эха
        description: В вас осела память навигатора. Вы слышите ложь в дрожании голоса и понимаете аккорды Кормчих.
        status: proposal
        features:
          - name: Язык эха
            text: "Владение Проницательностью. Вы понимаете язык эха Кормчих и можете отвечать на нём."
            modifiers:
              - {op: proficiency, kind: skill, value: insight}
              - {op: proficiency, kind: language, value: echo_chord}
      - id: gardener
        name: Садовник
        role: корабли, паразиты, органы-механизмы
        description: В вас осела память тех, кто выращивал корабли. Живые механизмы туш для вас понятны, как свои руки.
        status: proposal
        features:
          - name: Рука садовника
            text: "Владение Медициной и Природой."
            modifiers:
              - {op: proficiency, kind: skill, value: medicine}
              - {op: proficiency, kind: skill, value: nature}
      - id: silent_guard
        name: Тихий страж
        role: охрана, охота на эхо-сущности
        description: В вас осела память охотников на эхо. Вы двигаетесь без звука и не теряете голову перед роем.
        status: proposal
        features:
          - name: Шаг без эха
            text: "Владение Скрытностью. Преимущество на спасброски против испуга."
            modifiers:
              - {op: proficiency, kind: skill, value: stealth}
              - {op: advantage, "on": save, vs: frightened}
    features:
      - name: Тело Кормчего
        status: proposal
        text: "Кожа бледная и полупрозрачная, жилы биоминерала вдоль позвоночника, размер Средний."
        modifiers: []
      - name: Эхо-зрение
        status: proposal
        modifiers:
          - {op: sense, sense: blindsight, range: 30, if: {not: {in_zone: effect.loud_noise}}, text: "в зоне сильного шума слепое зрение не работает (Слабости Кормчих)"}
          - {op: disadvantage, "on": check, skill: perception, vs: sight_only}
      - name: Тишина разума
        status: proposal
        text: "Дары роя принимать нельзя."
        modifiers:
          - {op: advantage, "on": save, vs: charmed}
          - {op: advantage, "on": save, vs: corruption}
          - {op: set, target: swarm_gifts_allowed, value: false, text: "Дары роя принимать нельзя (stat.swarm_gifts)"}
      - name: Ликвор свой
        status: proposal
        text: "Перемена обнуляется и больше не растёт, зависимости нет. Доза ликвора восстанавливает ячейку без спасброска (спасбросок против Перемены снят иммунитетом к effect.alteration_exposure)."
        modifiers:
          - {op: set, target: alteration, value: 0}
          - {op: immunity, condition: effect.alteration_exposure, text: "Перемена больше не растёт"}
          - {op: set, target: dependency, value: 0}
      - name: Порт
        status: proposal
        modifiers:
          - {op: proficiency, kind: language, value: ship_liquor, text: "Порт: подключение к ликвору корабля — разговор с кораблём и Спящими в рубках (ключ к экипажам)"}
      - name: Слабости Кормчих
        status: proposal
        modifiers:
          - {op: vulnerability, damage: cold}
          - {op: disadvantage, "on": attack, if: {in_zone: effect.loud_noise}}
      - name: Чужой среди своих
        status: proposal
        modifiers:
          - op: custom
            engine: dev_request
            need: "op отношения фракции к носителю (attitude: {faction_ref, value}) — чисел в rules.md#3.5 нет, только настрой"
            text: "Церковь видит «ангела», Синдикаты — собственность, Кордон не доверяет; проснувшиеся Кормчие считают полезным зверем."
      - name: Тяга тишины
        status: proposal
        text: "Шкала 0–3. На 3 — снова Порог тишины, провал делает героя Безмолвным."
        stat_ref: stat.silence_pull
        modifiers: []
        note: "На 3 Тяги — effect.silence_threshold_trial: триггер resource_changed у stat.silence_pull."
        triggers:
          # Рост Тяги считается в hazard.sleeper_cocoon (отдых у кокона) и spell_note.silence_pull_high_circle (заклинания 5+), здесь не дублируется.
          - "on": key_deed_emotional
            do: [{op: resource, stat: silence_pull, delta: -1}]
