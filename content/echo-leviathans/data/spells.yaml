# Как заклинания SRD 5.1 подаются в мире «Эхо Левиафанов». Сами заклинания не копируются — только правила подачи.
# Источник: canon.md#1.6 (магия), rules.md#1, #3.5, #6.3, #7.0–7.4. Списки своих классов/подклассов —
# в data/classes/diagnost.yaml (spell_list) и data/classes/subclasses.yaml (bonus/domain/expanded spells).
kind: spell_note
items:
  # ---------- Общие правила ----------
  - id: spell_note.no_ninth_circle
    name: 9-й круг людям недоступен
    description: Заклинания 9-го круга — сила матерей и Кормчих, не людей. Потолок 15 уровня делает недостижимыми и остальные умения 16–20 уровней SRD.
    status: canon
    doc: rules.md#1
    tags: [spell_rule, level_cap]
    applies_to: all_player_characters
    modifiers:
      - {op: set, target: max_spell_level_cap, value: 8, scope: [slots, spells_known, scrolls, items], text: "Герои не получают и не могут творить заклинания 9-го круга, даже через свитки и предметы. У NPC-шаблонов (матери, Кормчие) 9-й круг разрешён — на них запись не действует (applies_to: all_player_characters)"}
    forbidden_spell_refs: [spell.astral_projection, spell.foresight, spell.gate, spell.imprisonment, spell.mass_heal, spell.meteor_swarm, spell.power_word_kill, spell.prismatic_wall, spell.shapechange, spell.storm_of_vengeance, spell.time_stop, spell.true_polymorph, spell.true_resurrection, spell.weird, spell.wish]

  - id: spell_note.no_magic_before
    name: Ликвор — единственный источник магии
    description: До Левиафанов магии у людей не было. Любая магия эпохи — это ликвор, канал связи Кормчих с кораблями; она пахнет медью, озоном и мокрым камнем, а маги стоят на границе Скверны.
    status: canon
    doc: canon.md#1.6
    tags: [spell_rule, flavor]

  - id: spell_note.echo_is_not_magic
    name: Эхо — не магия ликвора
    description: Техники эха (Голод и Отклик) не являются заклинаниями. «Рассеивание магии» и «Антимагическое поле» на них не действуют.
    status: canon
    doc: rules.md#6.3
    tags: [spell_rule, echo]
    modifiers:
      - {op: set, target: echo_technique.is_magic, value: false, text: "Заклинания из unaffected_by_spell_refs не взаимодействуют с техниками эха (echo_technique)"}
    unaffected_by_spell_refs: [spell.dispel_magic, spell.antimagic_field, spell.counterspell, spell.detect_magic]

  - id: spell_note.liquor_high_circle_alteration
    name: Перемена от сильных заклинаний
    description: Заклинатели ликвора (волшебник, жрец, паладин, чародей, диагност) после заклинания 5-го круга и выше совершают спасбросок против Перемены со сложностью 10 + круг.
    status: canon
    doc: rules.md#3.5
    tags: [spell_rule, alteration, liquor_caster]
    applies_to_class_refs: [class.wizard, class.cleric, class.paladin, class.sorcerer, class.diagnost]
    triggers:
      - "on": spell_cast
        if: {spell_level_gte: 5, caster_tag: liquor_caster}
        do:
          - op: save
            stat: con
            vs: alteration
            dc: "10 + spell_level"
            on_fail:
              - {op: resource, stat: alteration, delta: 1}
            on_fail_by_5:
              - {op: resource, stat: alteration, delta: 2}

  - id: spell_note.liquor_withdrawal_top_slot
    name: Ломка и ячейки
    description: При ломке на Перемене 3 и выше заклинатель ликвора не может тратить ячейку самого высокого доступного круга. «Капля» с чёрного рынка снимает ломку, но ячейку не восстанавливает.
    status: canon
    doc: rules.md#3.5
    tags: [spell_rule, alteration, addiction]
    modifiers:
      - op: set
        target: highest_available_slot_usable
        value: false
        if: {all: [{stat_gte: {alteration: 3}}, {any: [{has_effect: effect.liquor_withdrawal_1}, {has_effect: effect.liquor_withdrawal_2}, {has_effect: effect.liquor_withdrawal_3}]}]}
        text: "При ломке на Перемене 3+ нельзя тратить ячейку наивысшего доступного круга"
      - {op: disadvantage, "on": save, vs: concentration, when: withdrawal_and_alteration_gte_3}

  - id: spell_note.alteration_floor_for_casters
    name: Перемена не падает ниже 1 у практикующих
    description: Снизить Перемену ниже 1 у заклинателя ликвора, который продолжает колдовать, нельзя.
    status: canon
    doc: rules.md#3.5
    tags: [spell_rule, alteration, liquor_caster]
    modifiers:
      - {op: set, target: alteration_min, value: 1, if: {all: [{caster_tag: liquor_caster}, {cast_spell_since_last_cure: true}]}}

  - id: spell_note.greater_restoration_alteration
    name: «Высшее восстановление» и Перемена
    description: «Высшее восстановление» снижает Перемену на 1.
    status: canon
    doc: rules.md#3.5
    tags: [spell_rule, alteration, healing]
    srd_ref: {type: spell, name: Greater Restoration}
    spell_refs: [spell.greater_restoration]
    modifiers:
      - {op: resource, stat: alteration, delta: -1}

  - id: spell_note.silence_pull_high_circle
    name: Тяга тишины от сильных заклинаний
    description: У «Сохранившего сердце» каждое заклинание 5-го круга и выше — спасбросок Харизмы, сл. 12, провал — +1 Тяга тишины. Доза ликвора восстанавливает ему ячейку без спасброска.
    status: canon
    doc: rules.md#3.5
    tags: [spell_rule, silence_pull, lineage]
    triggers:
      - "on": spell_cast
        if: {spell_level_gte: 5, lineage: kept_heart}
        do:
          - op: save
            stat: cha
            dc: 12
            on_fail:
              - {op: resource, stat: silence_pull, delta: 1}

  - id: spell_note.hunger_domain_corruption
    name: Домен голода — Скверна за каждое заклинание
    description: Жрец Домена голода после каждого заклинания 1-го круга и выше совершает спасбросок против Скверны, сл. 8 + круг. Каждое использование «Божественного канала» сдвигает настрой эха на 1 к Голоду.
    status: canon
    doc: rules.md#7.3
    tags: [spell_rule, corruption, hunger_domain]
    subclass_ref: subclass.hunger_domain
    # Механика — triggers в subclass.hunger_domain; здесь не дублируется.

  - id: spell_note.resonance_patron_corruption
    name: Покровитель «Резонанс» — Скверна за сильные заклинания
    description: Колдун Резонанса начинает с 1 очком Скверны и совершает спасбросок против Скверны, сл. 10, после каждого заклинания 3-го круга и выше.
    status: canon
    doc: rules.md#7.4
    tags: [spell_rule, corruption, resonance_patron]
    subclass_ref: subclass.resonance_patron
    # Механика — triggers в subclass.resonance_patron; здесь не дублируется.

  - id: spell_note.renamed_spells
    name: Переименования заклинаний
    description: Некоторые заклинания SRD в мире называются иначе. Числа не меняются.
    status: canon
    doc: rules.md#7.1
    tags: [spell_rule, rename]
    renames:
      - {srd: Stoneskin, spell_ref: spell.stoneskin, name: Хитиновая кожа}
      - {srd: Commune, spell_ref: spell.commune, name: Песня туши, note: "только у Эхолокатора, собеседник — спящий Левиафан"}

  # ---------- Источники силы по классам ----------
  - id: spell_note.source_liquor_formulae
    name: "Источник: формулы ликвора (волшебник)"
    description: Волшебник-ликворовед расшифровывает в ликворе «формулы» — застывшие команды и знания экипажей Кормчих. Книга заклинаний — тетрадь расшифровок.
    status: canon
    doc: canon.md#1.6
    tags: [spell_source, liquor_caster]
    source_code: liquor_formulae
    class_refs: [class.wizard]

  - id: spell_note.source_liquor_sleepers_dreams
    name: "Источник: причастие и сны Спящих (жрец, паладин)"
    description: Жрецы и рыцари Церкви пьют ликвор на причастии и черпают силу из снов Кормчих, спящих в рубках, веря, что это благодать. Богов нет.
    status: canon
    doc: canon.md#1.6
    tags: [spell_source, liquor_caster]
    source_code: liquor_sleepers_dreams
    class_refs: [class.cleric, class.paladin]
    modifiers:
      - op: grant_action
        name: Причастие
        action: free
        uses: {count: 1, per: long_rest, cooldown_days: 7}
        text: "Причастие раз в неделю: спасбросок против Перемены, сл. 10 (rules.md#3.5)"
        do:
          - op: save
            stat: con
            vs: alteration
            dc: 10
            on_fail: [{op: resource, stat: alteration, delta: 1}]
            on_fail_by_5: [{op: resource, stat: alteration, delta: 2}]

  - id: spell_note.source_resonance_hunger
    name: "Источник: голод Резонанса (верхушка Церкви)"
    description: Верхушка Церкви отдалась голоду Резонанса и берёт силу прямо из Скверны. Это тайная магия, похожая на благодать, только злее.
    status: canon
    doc: canon.md#1.6
    tags: [spell_source, corruption]
    source_code: resonance_hunger
    subclass_refs: [subclass.hunger_domain]

  - id: spell_note.source_liquor_blood
    name: "Источник: ликвор в крови (чародей)"
    description: Чародей — человек, в чьей крови ликвор с рождения или с детской шахты. Заклинание — выброс собственного ликвора.
    status: canon
    doc: canon.md#1.6
    tags: [spell_source, liquor_caster]
    source_code: liquor_blood
    class_refs: [class.sorcerer]

  - id: spell_note.source_pact
    name: "Источник: договор из глубины (колдун)"
    description: Колдун заключил договор с тем, кто ответил из глубины — со Спящим из рубки или с Резонансом через осколок эхолита.
    status: canon
    doc: canon.md#1.6
    tags: [spell_source]
    source_code: pact
    class_refs: [class.warlock]
    subclass_refs: [subclass.sleeper, subclass.resonance_patron]

  - id: spell_note.source_sound_resonance
    name: "Источник: звук и резонанс (бард)"
    description: Звонарь творит магию через звук и резонанс туш и колоколов. Звонари Кордона — наследники колокольных крепостей.
    status: canon
    doc: rules.md#7.0
    tags: [spell_source]
    source_code: sound_resonance
    class_refs: [class.bard]

  - id: spell_note.source_parasite_herding
    name: "Источник: паразиты (друид)"
    description: Пастух паразитов черпает силу из живой плоти туш и паразитов; дикий облик — временная мутация тела.
    status: canon
    doc: rules.md#7.0
    tags: [spell_source]
    source_code: parasite_herding
    class_refs: [class.druid]

  - id: spell_note.source_stalker_lore
    name: "Источник: знание троп (следопыт)"
    description: Сталкер Глубинных троп пользуется выученным знанием туш и паразитов.
    status: canon
    doc: rules.md#7.0
    tags: [spell_source]
    source_code: stalker_lore
    class_refs: [class.ranger]

  - id: spell_note.source_liquor_reagents
    name: "Источник: реагенты и препараты (диагност)"
    description: Диагност творит заклинания SRD как препараты на основе ликвора; фокус — инструменты алхимика.
    status: canon
    doc: rules.md#7.1
    tags: [spell_source, liquor_caster]
    source_code: liquor_reagents
    class_refs: [class.diagnost]

  # ---------- Что закрыто миром ----------
  - id: spell_note.no_other_planes
    name: Иных планов нет
    description: Мир замкнут на одной планете — Эфира, Астрала и чужих планов нет. Заклинания, которые держатся на них, убраны из списков героев. «Мерцание», «Эфирная» часть «Видения невидимого» и подобные эффекты подаются как короткий уход «в изнанку эха» без выхода за пределы мира.
    status: canon
    doc: items.md#6.3
    tags: [spell_rule, cosmology]
    applies_to: all_player_characters
    forbidden_spell_refs: [spell.plane_shift, spell.gate, spell.astral_projection, spell.etherealness, spell.planar_ally, spell.planar_binding]

  # ---------- Подача: как заклинание выглядит в мире ----------
  # Только описание, числа SRD не меняются (items.md#6.1). Показывается в карточке заклинания курсивом.
  - id: spell_note.lore_flavor
    name: Как заклинания выглядят в мире
    description: Подача заклинаний SRD под мир «Эхо Левиафанов». Любое заклинание ликвора пахнет медью и озоном, у мага на миг чернеют вены; в толпе это выдаёт колдующего.
    status: canon
    doc: items.md#6.1
    tags: [spell_rule, flavor]
    flavors:
      # заговоры
      spell.acid_splash: Плевок едкой лимфы туши — шипит на металле и оставляет зелёные потёки.
      spell.chill_touch: Холодная ладонь Спящего — на коже цели проступает иней, и раны перестают затягиваться.
      spell.dancing_lights: Светляки из светлой лимфы, как в фонарях шахтёров, кружат вокруг и гаснут, если отойти.
      spell.druidcraft: Шёпот бортовых организмов — плесень на стене расцветает, паразит в щели замирает.
      spell.eldritch_blast: Сгусток чужой воли из глубины бьёт с хрустом, будто лопается хитин.
      spell.fire_bolt: Капля горящего ликвора срывается с пальцев и пахнет палёной медью.
      spell.guidance: Короткая подсказка во сне наяву — голос Спящего называет верный шаг.
      spell.light: Предмет начинает светиться ровным медным светом, как иллюминатор рубки.
      spell.mage_hand: Невидимая хватка ликвора — так Кормчие двигали рычаги, не касаясь их.
      spell.mending: Трещина стягивается медной нитью, будто её заварили изнутри.
      spell.message: Эхо-шёпот по металлу и камню — слышит только тот, кому он адресован.
      spell.minor_illusion: Морок ликвора — образ чуть дрожит, как марево над котлом.
      spell.poison_spray: Облако спор из горсти ликвора — пахнет гнилым мясом туши.
      spell.prestidigitation: Мелкий фокус, которым маги ям развлекают толпу за медяк.
      spell.produce_flame: На ладони загорается лимфа — горит, не обжигая хозяина.
      spell.ray_of_frost: Луч холода, какой бывает в брюхе мёртвой туши, — на цели выступает изморозь.
      spell.resistance: Короткая молитва Спящему — тело на миг становится твёрже.
      spell.sacred_flame: Сияние снов Спящих падает на цель — белое, без тепла и без тени.
      spell.shillelagh: Дубина прорастает жилами паразита-симбионта и бьёт, как живая.
      spell.shocking_grasp: Разряд по нервам, как у паровоза на старте, — металл на враге искрит.
      spell.spare_the_dying: Сшивание на грани — пульс возвращается, рана затягивается медной плёнкой.
      spell.thaumaturgy: Малое знамение — дрожит палуба, гудят колокола, пламя гаснет само.
      spell.true_strike: Холодная ясность Спящего — на миг видно, куда враг откроется.
      spell.vicious_mockery: Колкость звонаря с резонансом в голосе — слова звенят в черепе, как колокол.
      # 1-й круг
      spell.bless: Причастие на ходу — капля ликвора на лбу, и руки перестают дрожать.
      spell.burning_hands: Выброс горящего ликвора веером из ладоней.
      spell.charm_person: Голос мага звучит в чужой голове как голос давнего друга.
      spell.cure_wounds: "Сшивание: ткани стягиваются, остаётся шрам с медным блеском."
      spell.healing_word: "Сшивание на расстоянии: одно слово, и рана стягивается, оставляя медный блеск."
      spell.detect_magic: Запах меди и озона становится видимым — ликвор светится сквозь одежду и стены.
      spell.disguise_self: Морок ликвора ложится на лицо, как вторая кожа.
      spell.faerie_fire: Цель покрывается светящейся плесенью туши — прятаться бесполезно.
      spell.false_life: Ликвор качает кровь вместо сердца — тепло, но чужое.
      spell.feather_fall: Воздух под ногами густеет, как лимфа.
      spell.find_familiar: Мелкий паразит-симбионт или механическая птица из мастерской — глаза и уши мага.
      spell.fog_cloud: Пар из разорванной жилы туши заволакивает всё вокруг.
      spell.guiding_bolt: Столп света из снов Спящих — цель ещё мерцает, и её видно всем.
      spell.hellish_rebuke: Ответный жар Скверны — обидчик вспыхивает изнутри.
      spell.hunters_mark: Сталкер «слышит» добычу по запаху её крови.
      spell.inflict_wounds: Касание, от которого плоть темнеет и гниёт, как мясо мёртвой туши.
      spell.mage_armor: Невидимая плёнка ликвора твердеет от удара, как хитин.
      spell.magic_missile: Три медные искры — команды Кормчих — бьют без промаха.
      spell.protection_from_evil_and_good: Защита от роя и Спящих — аберрации не могут коснуться.
      spell.sanctuary: Мир на миг забывает о цели — рука врага сама отворачивает.
      spell.shield: Хитиновая пластина из ликвора вспыхивает на пути удара и тает.
      spell.shield_of_faith: Мерцающий ореол причастия отводит удары.
      spell.sleep: Сонное дыхание Спящих — ближние засыпают, как в рубке.
      spell.thunderwave: Удар колокольной волны — звон отбрасывает всех вокруг.
      spell.command: Слово-команда Кормчих — тело подчиняется раньше, чем разум понимает.
      # 2-й круг
      spell.darkness: Тьма из брюха туши — густая, пахнущая мокрым камнем.
      spell.hold_person: Ликвор в нервах цели застывает — она не может шевельнуться.
      spell.invisibility: Маг сливается с дрожью воздуха, как Кормчий в тёмной рубке.
      spell.misty_step: Шаг сквозь эхо — маг исчезает с медной вспышкой и появляется рядом.
      spell.scorching_ray: Три струи горящего ликвора.
      spell.shatter: Резонанс, от которого трескается хитин и лопается стекло.
      spell.silence: Тишина, в которой слышно только собственное сердце, — Кормчие здесь слепнут.
      spell.spiritual_weapon: Призрачный клинок из света снов Спящих.
      spell.web: Липкая сеть паразитов-прядильщиков.
      spell.lesser_restoration: Ликвор выжигает яд и хворь — остаётся лёгкий медный привкус.
      spell.suggestion: Мысль, вложенная так тихо, что кажется своей.
      spell.spike_growth: Из земли и плоти туши лезут хитиновые шипы.
      # 3-й круг и выше
      spell.revivify: "Разряд: ток по нервам, как у паровоза на старте."
      spell.fireball: Выброс горящего ликвора — шар раскрывается с рёвом котла.
      spell.lightning_bolt: Молния из ликвора бьёт линией, запах озона держится ещё минуту.
      spell.counterspell: Встречная команда — чужая формула рассыпается медной пылью.
      spell.dispel_magic: Ликвор гасит ликвор — на эхо это не действует.
      spell.conjure_animals: Бортовые организмы, поднятые из стен туши.
      spell.spirit_guardians: Вокруг жреца кружат тени Спящих, жаля врагов.
      spell.sending: Эхо-речь кораблей сквозь камень.
      spell.speak_with_dead: Ликвор ненадолго заводит мёртвые нервы — труп отвечает чужим голосом.
      spell.haste: Ликвор разгоняет сердце — движения рвутся вперёд, а потом приходит опустошение.
      spell.fly: Лёгкость, будто тело наполнили газом из пузырей туши.
      spell.mass_healing_word: Одно слово — и у всех вокруг раны затягиваются медным блеском.
      spell.commune: Разговор со Спящим. Отвечает Кормчий, и отвечает правду, но в своих целях.
      spell.stoneskin: Кожа покрывается хитином, как у выводка.
      spell.mass_cure_wounds: "Большое сшивание: волна ликвора стягивает раны у всех вокруг."
      spell.raise_dead: Долгий разряд и капля ликвора в сердце — мёртвый возвращается с медью в глазах.
      spell.heal: Ликвор перестраивает тело заново — от шрамов не остаётся и следа.
