    epithet: Пастух паразитов
    badge: Паразиты
    summary: Черпает силу из живой плоти туш; облик зверя — временная мутация тела.
    highlights:
      - Заклинания на Мудрости из плоти туш и паразитов
      - Дикий облик (2 ур.) — мутация, а не превращение
      - Не носит металлических доспехов
    description: Пастух паразитов. Облик зверя — временная мутация тела.
    status: canon
