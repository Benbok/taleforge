# Классы SRD 5.1 в мире «Эхо Левиафанов»: записи-обёртки. Числа и умения — по SRD (levels: srd),
# меняются только имя в мире, описание и источник силы. Источник: rules.md#1, rules.md#7.0, canon.md#1.6.
# Потолок 15 [Канон, open-questions #21, #25]: умения 16–20 и заклинания 9-го круга недостижимы.
# max_spell_level — наивысший круг ячеек, доступный на 15-м уровне по таблицам SRD.
# spell_source — код источника силы (расшифровка в data/spells.yaml, spell_note.source_*).
kind: class
items:
  - id: class.barbarian
    name: Варвар
    description: Боец на мутагенах. Ярость — это инъекция стимулятора, а не очки Скверны.
    status: canon
    doc: rules.md#7.0
    tags: [class, srd, martial]
    srd_ref: {type: class, name: Barbarian}
    world_role: Боец на мутагенах; ярость — инъекция.
    hit_die: d12
    levels: srd
    level_cap: 15
    max_spell_level: 0
    spell_source: none
    subclass_refs: [subclass.blood_tide]
    notes:
      - Ярость не даёт и не требует очков Скверны (corruption).

  - id: class.bard
    name: Бард (звонарь)
    description: Звонарь и эхолокатор — магия через звук и резонанс. Звонари Кордона — прямые наследники колокольных крепостей.
    status: canon
    doc: rules.md#7.0
    tags: [class, srd, caster, full_caster]
    srd_ref: {type: class, name: Bard}
    world_role: Звонарь, эхолокатор; звонари Кордона наследуют колокольные крепости.
    hit_die: d8
    levels: srd
    level_cap: 15
    max_spell_level: 8
    spell_source: sound_resonance
    subclass_refs: [subclass.college_of_echo]

  - id: class.cleric
    name: Жрец Церкви Исполинов
    description: Служитель Церкви Исполинов. Пьёт ликвор на причастии и черпает силу из снов спящих Кормчих, веря, что это благодать; богов нет.
    status: canon
    doc: rules.md#7.0
    tags: [class, srd, caster, full_caster, liquor_caster]
    srd_ref: {type: class, name: Cleric}
    world_role: Служитель Церкви Исполинов; верхушка Церкви — Домен голода.
    hit_die: d8
    levels: srd
    level_cap: 15
    max_spell_level: 8
    spell_source: liquor_sleepers_dreams
    subclass_refs: [subclass.domain_of_communion, subclass.hunger_domain]
    notes:
      - «Божественное вмешательство» работает как обращение к Спящим, а не к богу (богов нет, canon.md#1.6).

