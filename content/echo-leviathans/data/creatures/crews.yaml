- id: creature.helmsman_pilot_awakened
  name: Проснувшийся пилот
  description: Кормчий-пилот, вышедший из кокона. Слаб, мёрзнет, не выносит шума, но помнит, как вести корабль, и знает о Резонансе больше всех людей вместе взятых. Сюжетное событие, не рядовой враг.
