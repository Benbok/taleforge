  loot_hint: нет; сам по себе — главный сюжетный ресурс
  status: proposal
- id: creature.sleeper_cocoon
  name: Кокон Спящего
  description: Нарост, похожий на кресло, в желудочке-рубке. Внутри в анабиозе спит Кормчий, живущий за счёт ликвора. Часть коконов пуста.
  status: canon
  doc: canon.md#1.2; races.md#1.6
  tags: [helmsman, cocoon, object]
  cr: 0
  behavior: {profile: defender, flee_threshold: 0.0, mobile: false}
  modifiers:
  - {op: set, target: ac, value: 15}
  - {op: set, target: hp_max, value: 40}
  - {op: run, ref: hazard.sleeper_cocoon, note: долгое пребывание рядом — спасбросок против Перемены сл. 13 (rules 3.5)}
  abilities:
  - {name: Сны, kind: passive, text: 'Через Шёпот сны Спящего просачиваются в шахтёров, Сломленных и колдунов «Спящего».'}
  loot_hint: нет; вскрытие — поступок с пометкой echo и событие для state туши
- id: creature.organism_sanitar
  name: Санитар
