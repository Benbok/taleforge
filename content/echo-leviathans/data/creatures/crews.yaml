# Кормчие и бортовые организмы кораблей
# Часть пакета «Эхо Левиафанов». Основа — SRD 5.1 (srd_ref); модификаторы — язык из README.
# behavior.profile: aggressive | cowardly | defender | capturer (Захватчик, rules.md#6.5) | noncombatant; flee_threshold — доля хитов.
kind: creature_template
items:
- id: creature.helmsman_sounding
  name: Звучащий
  description: Кормчий-навигатор и связист, знаток языка эха. Самый вероятный собеседник людей. Поёт заклинания щелчками и аккордами.
  doc: races.md#1.4; races.md#1.7
  tags: [helmsman, crew]
  srd_ref: {type: monster, name: Mage}
  cr: 6
  behavior: {profile: cowardly, label: Звучащий, flee_threshold: 0.5, note: 'избегает шума, отступает к кораблю'}
  modifiers:
  - {op: set, target: size, value: small}
  - {op: sense, sense: blindsight, range: 60}
  - {op: set, target: vision, value: blindsight_only, note: 'Эхо-зрение: за пределами слепого зрения 60 футов слепы'}
  - op: custom
    engine: dev_request
    text: В абсолютной тишине почти слепы
    need: канон не даёт числа для «почти слепы» и не задаёт зону «абсолютной тишины» (нужен эффект/hazard тишины и величина штрафа)
  - {op: advantage, 'on': save, vs: charmed, note: Тишина разума}
  - {op: advantage, 'on': save, vs: corruption, note: Тишина разума}
  - op: custom
    engine: dev_request
    text: 'Тишина разума: иммунитет к «приглашению» — Резонанс не может пригласить их на расстоянии'
    need: immunity к эффекту пакета по ссылке (effect_ref), а не только к состоянию SRD; эффекта «приглашение» в пакете нет
  - {op: condition, condition: blinded, if: {in_area: effect.loud_noise}, note: Хрупкий слух}
  - {op: disadvantage, 'on': attack, if: {in_area: effect.loud_noise}, note: Хрупкий слух}
  gm_note: 'Заклинания — эхом, а не словами: вербальный компонент — песня (щелчки и аккорды); язык людей не нужен'
  triggers:
  - 'on': scene_end
    if: {outside_ship_hours_gte: 8}
    do:
    - {op: condition, condition: exhaustion, note: 'Холод поверхности: 1 степень за каждые 8 часов вне корабля'}
  abilities: []
  loot_hint: кристалл ликворного «архива», биоминеральные резонаторы
  status: proposal
- id: creature.helmsman_gardener
  name: Садовник
  description: Кормчий, выращивающий корабли, паразитов и органы. Вместо лечения — власть над бортовыми организмами. Мог бы отозвать нитевиков у Резонанса.
  doc: races.md#1.4; races.md#1.7
  tags: [helmsman, crew]
  srd_ref: {type: monster, name: Priest}
  cr: 2
  behavior: {profile: cowardly, flee_threshold: 0.5}
  modifiers:
  - {op: set, target: size, value: small}
  - {op: sense, sense: blindsight, range: 60}
  - {op: set, target: vision, value: blindsight_only, note: 'Эхо-зрение: за пределами слепого зрения 60 футов слепы'}
  - op: custom
    engine: dev_request
    text: В абсолютной тишине почти слепы
    need: канон не даёт числа для «почти слепы» и не задаёт зону «абсолютной тишины» (нужен эффект/hazard тишины и величина штрафа)
  - {op: advantage, 'on': save, vs: charmed, note: Тишина разума}
  - {op: advantage, 'on': save, vs: corruption, note: Тишина разума}
  - op: custom
    engine: dev_request
    text: 'Тишина разума: иммунитет к «приглашению» — Резонанс не может пригласить их на расстоянии'
    need: immunity к эффекту пакета по ссылке (effect_ref), а не только к состоянию SRD; эффекта «приглашение» в пакете нет
  - {op: condition, condition: blinded, if: {in_area: effect.loud_noise}, note: Хрупкий слух}
  - {op: disadvantage, 'on': attack, if: {in_area: effect.loud_noise}, note: Хрупкий слух}
  - op: custom
    engine: dev_request
    text: 'Лечащие заклинания Жреца заменены управлением бортовыми организмами: те же ячейки, цели — паразиты туши'
    need: 'замена заклинаний SRD-шаблона на действие с оплатой ячейками заклинаний (grant_action не умеет cost: spell_slot) и цель target_tag: ship_organism'
  triggers:
  - 'on': scene_end
    if: {outside_ship_hours_gte: 8}
    do:
    - {op: condition, condition: exhaustion, note: 'Холод поверхности: 1 степень за каждые 8 часов вне корабля'}
  abilities:
  - name: Отзыв организмов
    kind: action
    text: Бортовой организм в 60 футах (не перехваченный матерью) перестаёт быть враждебным. Перехваченного нитевика — спасбросок Мдр сл. 13 от матери.
  loot_hint: семенные капсулы бортовых организмов, инструменты из живого хитина
  status: proposal
- id: creature.helmsman_silent_guard
  name: Тихий страж
  description: Кормчий-штурмовик и охотник на сгустки эха. Большая часть ушла в кратер и стала чужими матерями; немногие спят в рубках.
