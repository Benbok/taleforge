  loot_hint: хитиновые наросты с жилами меди, кусок ликворной жилы
- id: creature.hidden_human
  name: Скрытый (человек)
  description: Шахтёр, вернувшийся из смены «каким-то спокойным». Внешне прежний, хитин под кожей, не мёрзнет, пахнет медью и озоном.
  status: proposal
  doc: races.md#2.7; rules.md#6.4
  tags: [echoed, hidden, mimic, humanoid_form]
  srd_ref: {type: monster, name: Commoner}
  cr: 0
  stage: 1
  behavior: {profile: cowardly, label: Разведчик, flee_threshold: 0.9, note: 'избегает боя, наблюдает'}
  modifiers: []
  triggers:
  - 'on': hit_by
    if: {source_tag: liquor}
    do:
    - op: run
      ref: effect.liquor_silence
      note: '«Ликвор — яд»: +2d6 яда даже при иммунитете к яду; спасбросок Тел сл. 13, провал — «Тишина» до конца следующего хода (нет «Связи резонансом» и «Раскрытия»)'
    - {op: set, target: disguised, value: false, note: проба ликвором раскрывает стадию I–II без проверки}
  - 'on': enter_area
    if: {in_area: effect.loud_noise}
    do:
    - op: save
      stat: con
      dc: 12
      on_fail:
      - {op: set, target: disguised, value: false}
      note: 'проба звоном: провал — вздрагивает, это видят все, кто смотрел'
  abilities:
  - name: Мимикрия
    kind: passive
    text: 'Выглядит как исходный вид. Раскрытие: Мудрость (Проницательность) против Харизмы (Обман) после минуты разговора; «Диагностика»; проба звоном (спасбросок Тел сл. 12, провал — вздрагивает); проба
      ликвором раскрывает без проверки. Сломленные и «Чуткость роя» — с преимуществом.'
    modifiers:
    - op: check
      stat: wis
      skill: insight
      dc: 'opposed: cha (deception)'
      adv_if: {any: [{origin: origin.slomlenny}, {has_effect: effect.gift_swarm_sense}]}
      outcomes:
      - result: success
        do:
        - {op: set, target: disguised, value: false}
      note: проверку делает наблюдатель после разговора хотя бы в минуту; «Диагностика» Диагноста раскрывает автоматически
  - name: Связь с матерью
    kind: passive
    text: 'Всё, что видит и слышит существо, знает его мать: приложение пишет событие «разведка» и ставит матери флаг знаний об отряде.'
  - name: Раскрытие
    kind: bonus
    text: Сбрасывает облик. Если цель не знала, что это рой, она застигнута врасплох; первая атака в этот ход с преимуществом и +1d6 урона за стадию.
    modifiers:
    - {op: extra_damage, dice: 1d6, damage_type: same, when: reveal_first_attack_per_stage}
  loot_hint: ничего; вещи хозяина, если был человеком
