- id: creature.colossus_worm
  name: Колосс-роющий
  description: Осадный колосс, который идёт под землёй и роет ходы под башни. Приходит только при высоком резонансе.
  status: canon
  doc: canon.md#3.3
  tags: [brood, colossus, wave, siege, digger]
  srd_ref: {type: monster, name: Purple Worm}
  cr: 16
  stage: 3
  size_class: осадный колосс
  behavior:
    profile: capturer
    label: Захватчик
    target_priority: [tower, walker]
    kill_first: [flamethrower_bearer, ringer, attunement_response_3_plus]
    nonlethal: true
    carry_captives: true
    retreat_when: captives_taken
    flee_threshold: 0.0
  modifiers:
  - {op: sense, sense: blindsight, range: 30}
  - {op: immunity, condition: blinded}
  - {op: immunity, condition: charmed}
  - {op: immunity, condition: frightened}
  - {op: vulnerability, damage: fire}
  - {op: disadvantage, 'on': attack, if: {in_area: effect.loud_noise}, note: Сбитый ритм}
  gm_note: 'Угроза масштаба сюжета (ПО выше потолка уровней 15): прямой бой — только с колоколами, шагоходами и гарнизоном'
  triggers:
  - 'on': hit
    if: {attack_name: [bite, claw]}
    do:
    - op: save
      stat: con
      dc: 10
      on_fail:
      - {op: resource, stat: corruption, delta: 1}
      note: Поглощающий укус
  - 'on': hit_by
    if: {source_tag: liquor}
    do:
    - op: run
      ref: effect.liquor_silence
      note: '«Ликвор — яд»: +2d6 яда даже при иммунитете к яду; спасбросок Тел сл. 13, провал — «Тишина» до конца следующего хода (нет «Связи резонансом» и «Раскрытия»)'
  abilities: []
  loot_hint: ничего, что можно унести; его туша — новое месторождение хитина
- id: creature.deepkin
  name: Глубинный
  description: 'Взрослое существо, которое десятилетия назад было ребёнком-шахтёром и ушло вглубь артерий. Сросся с хитином, видит вибрациями. Трагический враг: иногда бормочет обрывки детских слов.'
  status: canon
  doc: canon.md#3.2; races.md#2.3
  tags: [echoed, caste_deep, adult_only]
  srd_ref: {type: monster, name: Troglodyte}
  cr: 1
  stage: 3
  behavior:
    profile: capturer
    label: Захватчик
    target_priority: [loner, wounded, broken_origin, high_corruption, hunger_attunement]
    kill_first: [flamethrower_bearer, ringer, attunement_response_3_plus]
    nonlethal: true
    carry_captives: true
    retreat_when: captives_taken
    flee_threshold: 0.3
  modifiers:
  - op: advantage
    'on': attack
    if: {all: [{ally_brood_within_5ft_of_target: true}, {not: {in_area: effect.loud_noise}}]}
    note: Связь резонансом; в зоне сильного шума теряется («Сбитый ритм»), под «Тишиной» — см. effect.liquor_silence
  - {op: immunity, condition: charmed}
  - {op: immunity, condition: frightened}
  - {op: vulnerability, damage: fire}
  - {op: disadvantage, 'on': attack, if: {in_area: effect.loud_noise}, note: Сбитый ритм}
  - {op: sense, sense: blindsight, range: 60}
  - {op: resistance, damage: poison}
  gm_note: 'Только взрослые: мутация прошла десятилетия назад. Живые дети в бою не появляются никогда'
  triggers:
  - 'on': hit
    if: {attack_name: [bite, claw, chitin_weapon]}
    do:
    - op: save
      stat: con
      dc: 13
      on_fail:
      - {op: resource, stat: corruption, delta: 1}
      note: Поглощающий укус
  - 'on': hit_by
    if: {source_tag: liquor}
    do:
    - op: run
      ref: effect.liquor_silence
      note: '«Ликвор — яд»: +2d6 яда даже при иммунитете к яду; спасбросок Тел сл. 13, провал — «Тишина» до конца следующего хода (нет «Связи резонансом» и «Раскрытия»)'
  abilities:
  - name: Эхо детства
    kind: passive
    text: Сломленный рядом слышит обрывки его детства; проверка Убеждения сл. 15 может остановить Глубинного на раунд.
  loot_hint: хитиновое оружие Глубинного (кислотный вариант), старый шахтёрский жетон
