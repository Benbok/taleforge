# Выводки, Отзвучные, матери (рой Резонанса)
# Часть пакета «Эхо Левиафанов». Основа — SRD 5.1 (srd_ref); модификаторы — язык из README.
# behavior.profile: aggressive | cowardly | defender | capturer (Захватчик, rules.md#6.5) | noncombatant; flee_threshold — доля хитов.
kind: creature_template
items:
- id: creature.brood_swarm_rats
  name: Крысиный рой выводка
  description: Серая шевелящаяся масса крыс, растворённых налётом и собранных заново. Разведка и заражение, лезет в щели шахт и подвалов.
  status: canon
  doc: canon.md#3.3; rules.md#6.2
  tags: [brood, swarm, small_fry]
  srd_ref: {type: monster, name: Swarm of Rats}
  cr: 1
  stage: 3
  size_class: мелочь
  behavior:
    profile: capturer
    label: Захватчик
    target_priority: [loner, wounded, broken_origin, high_corruption, hunger_attunement]
    kill_first: [flamethrower_bearer, ringer, attunement_response_3_plus]
    nonlethal: true
    carry_captives: true
    retreat_when: captives_taken
    flee_threshold: 0.0
  modifiers:
  - op: advantage
    'on': attack
    if: {all: [{ally_brood_within_5ft_of_target: true}, {not: {in_area: effect.loud_noise}}]}
    note: Связь резонансом; в зоне сильного шума теряется («Сбитый ритм»), под «Тишиной» — см. effect.liquor_silence
  - {op: sense, sense: blindsight, range: 30}
  - {op: immunity, condition: blinded}
  - {op: immunity, condition: charmed}
  - {op: immunity, condition: frightened}
  - {op: vulnerability, damage: fire}
  - {op: disadvantage, 'on': attack, if: {in_area: effect.loud_noise}, note: Сбитый ритм}
  triggers:
  - 'on': hit
    if: {attack_name: [bite, claw]}
    do:
    - op: save
      stat: con
      dc: 10
      on_fail:
      - {op: resource, stat: corruption, delta: 1}
      note: Поглощающий укус
  - 'on': hit_by
    if: {source_tag: liquor}
    do:
    - op: run
      ref: effect.liquor_silence
      note: '«Ликвор — яд»: +2d6 яда даже при иммунитете к яду; спасбросок Тел сл. 13, провал — «Тишина» до конца следующего хода (нет «Связи резонансом» и «Раскрытия»)'
  abilities: []
  loot_hint: 'почти ничего: горсть хитиновой чешуи, иногда крошка эхолита в сгустке роя'
