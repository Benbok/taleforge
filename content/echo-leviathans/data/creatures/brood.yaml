- id: creature.mother_human
  name: Человеческая мать
  description: 'Первая мать с Отзвучной горы или та, что выросла из верхушки Церкви: огромная, почти неподвижная, сросшаяся с налётом. Хитрый политик роя, ведёт глашатаев.'
  status: canon
  doc: canon.md#1.3; races.md#2.4
  tags: [echoed, mother, boss]
  srd_ref: {type: monster, name: Aboleth}
  cr: 10
  stage: 4
  behavior: {profile: defender, label: Мать, flee_threshold: 0.0, guards: lair, uses_minions: true}
  modifiers:
  - op: custom
    engine: dev_request
    text: 'Без водной привязки: «Слизистая оболочка» и подводные способности Аболета заменены связью с налётом (в налёте — те же бонусы)'
    need: 'переопределить условие SRD-черт Аболета («под водой» → in_area: hazard.blight); канон не уточняет, какие именно бонусы переносятся'
  - {op: vulnerability, damage: fire}
  triggers:
  - 'on': hit_by
    if: {source_tag: liquor}
    do:
    - {op: extra_damage, dice: 1d6, damage_type: poison, note: матери получают половину урона «Ликвор — яд»}
    - op: save
      stat: con
      dc: 13
      on_fail:
      - op: custom
        engine: dev_request
        text: '«Тишина» до конца следующего хода: выводки в 60 футах от матери теряют «Связь резонансом»'
        need: 'наложение подавления эффекта (effect.brood_resonance_link) на союзных выводков в радиусе 60 футов на 1 раунд: у run/condition нет area + фильтра целей и длительности'
  abilities:
  - {name: Логово в налёте, kind: lair, text: 'Логовные действия Аболета, привязанные к налёту вместо воды.'}
  - name: Адаптация роя
    kind: passive
    text: До 3 адаптаций в state (rules 6.4). Смерть матери обнуляет адаптации её роя и гасит налёт в её зоне.
  - {name: Порабощение, kind: action, text: '«Порабощение» Аболета — это приглашение: провал даёт ещё и очко Скверны.'}
  loot_hint: 'ядро матери: осколок эхолита размером с голову; вещи её прежней жизни'
