  # --- Ликвор (rules.md 5.2, 3.5) ---
  - id: item.liquor_purified
    name: Очищенный ликвор
    description: Ампула прозрачного ликвора с лицензией Дома Ликвора. Возвращает ячейку до 3-го круга ценой Перемены.
    status: proposal
    doc: rules.md#5.2
    tags: [liquor, spell_slot]
    category: consumable
    source: liquor
    index_group: liquor
    legality: license
    price: {fk: 400, range: [300, 500]}
    weight: 0.5
    rarity: rare
    modifiers:
      - op: choose
        when: use
        if: {caster_tag: liquor_caster}
        text: "Заклинатель ликвора: одна потраченная ячейка до 3-го круга"
        options:
          - [{op: resource, stat: spell_slot_1, delta: 1}]
          - [{op: resource, stat: spell_slot_2, delta: 1}]
          - [{op: resource, stat: spell_slot_3, delta: 1}]
      - {op: set, target: temp_hp, value: "1d4 + level", if: {not: {caster_tag: liquor_caster}}, text: "Не-заклинатель"}
      - op: save
        stat: con
        dc: 15
        vs: alteration
        on_fail: [{op: resource, stat: alteration, delta: 1}]
      - {op: remove_condition, any_of: [effect.liquor_withdrawal_1, effect.liquor_withdrawal_2, effect.liquor_withdrawal_3]}
      - {op: set, target: last_liquor_dose_day, value: today}
  - id: item.liquor_dirty
    name: Грязный ликвор
    description: Мутный ликвор с паразитами. Восстанавливает ячейку 1-го или 2-го круга (1d2).
    status: proposal
    doc: rules.md#5.2
    tags: [liquor, spell_slot]
    category: consumable
    source: liquor
    index_group: liquor
    price: {fk: 50}
    weight: 0.5
    rarity: common
    modifiers:
      - {op: resource, stat: spell_slot, slot_level: "1d2", delta: 1, if: {caster_tag: liquor_caster}, text: "Заклинатель ликвора: ячейка круга 1d2"}
      - {op: set, target: temp_hp, value: "1d4 + level", if: {not: {caster_tag: liquor_caster}}, text: "Не-заклинатель"}
      - op: save
        stat: con
        dc: 15
        vs: corruption
        on_fail: [{op: resource, stat: corruption, delta: 1}]
      - op: save
        stat: con
        dc: 12
        vs: alteration
        on_fail: [{op: resource, stat: alteration, delta: 1}]
