# Оружие: свойства мира (хитиновый сплав, «Шумное»), хитиновые варианты SRD, новое холодное оружие,
# огнестрел, оружие против роя и Резонанса.
# Источник: rules.md#5.3, #5.5, #5.6; items.md#2.
# Поля: category, weapon_type, damage {dice, type}, properties, range {normal, long} (футы), price {fk}, weight (фунты),
# rarity, source (chitin|blood|liquor|echolith|relic|tech), legality (legal|cordon_pass|cordon_only|outlaw), proficiency.
# Веса новых образцов не заданы в тексте — это предложение.
kind: item_template
items:
  # --- Свойства и варианты ---
  - id: item.property_chitin_alloy
    name: Хитиновый сплав (вариант оружия)
    description: Любое оружие SRD в хитиновом варианте за цену ×10. Всегда наносит дополнительно 1d4 ядом или кислотой (выбирается при изготовлении). Не портится и не трескается, чинится как обычное.
    status: canon
    doc: rules.md#5.3
    tags: [property, variant, chitin]
    category: weapon
    weapon_type: variant
    source: chitin
    rarity: common
    price: {multiplier: 10, of: base_weapon}
    alloy_damage_choice: [poison, acid]
    modifiers:
      - {op: extra_damage, dice: 1d4, damage_type: chosen, choice: [poison, acid], choice_at: crafting, stored_in: instance, when: hit}
    # Вид доп. урона выбирается при изготовлении и хранится в экземпляре. Счётчиков свежести и трещин нет [Канон, вопрос 20].
    # Паразиты и Глубинные устойчивы к яду — для глубин нужен кислотный вариант.

  - id: item.property_noisy
    name: Шумное (свойство оружия)
    description: Атака этим оружием выдаёт стрелка и создаёт сильный шум в 10 футах до начала его следующего хода.
    status: proposal
    doc: items.md#2.1
    tags: [property, noise]
    category: weapon
    weapon_type: property
    source: tech
    price: {fk: 0}
    effect_ref: effect.loud_noise
    triggers:
      - "on": attack
        do:
          - {op: set, target: can_hide, value: false, duration: {until: turn_end}, text: "До конца хода атакующий не может быть скрыт"}
          - {op: run, ref: effect.loud_noise, area: {shape: sphere, radius: 10, center: self}, duration: {until: next_turn_start}, text: "Выводки теряют «Связь резонансом» — по эффекту"}
          - {op: condition, condition: blinded, if: {target_tag: helmsman}, area: {shape: sphere, radius: 10, center: self}, duration: {until: next_turn_start}, text: "Кормчие слепнут"}
          - {op: disadvantage, "on": check, skill: perception, vs: hearing, target: allies_in_area, area: {shape: sphere, radius: 10, center: self}, duration: {until: next_turn_start}}

