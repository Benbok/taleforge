# Источник: items.md#1.4 (общий шаблон item.liquor_formula), #6.1. Движок: use_item → cast_spell без ячейки,
# сложность и бонус атаки — по кругу формулы (SRD: 1–2-й круг сл. 13 / +5, 3–4-й — сл. 15 / +7).
# Прочесть может заклинатель, у которого заклинание в списке класса; круг выше доступного — проверка
# заклинательной характеристики, сл. 10 + круг, провал — ампула пропала. Цены — по item.liquor_formula.
