# Чем фракции благодарят и мстят отряду (последствия поступков, инструмент record_deed).
# Отношение к отряду — ступени −3…+3, как attitude между фракциями; сдвигает его сервер по поступкам героев.
# Когда отношение уходит на новую ступень, фракция готовит ответ: строки gratitude или revenge с tier не выше
# текущей ступени. Механика — только ссылками: creature_refs → spawn_entity (бюджет встречи), item_refs → give_item,
# effect_refs → apply_effect. Дочерняя фракция без своей таблицы берёт таблицу родителя (parent_ref).
kind: standing_table
items:
- id: standing.syndicates
  name: Синдикаты Крови
  status: proposal
  doc: canon.md#5.1
  tags: [standing]
  faction_ref: faction.syndicates
  gratitude:
  - {tier: 1, text: 'Пропуска без лишних вопросов, стража смотрит сквозь пальцы'}
  - {tier: 2, text: 'Контракт и аванс: работа на Дом, билет на поезд за счёт Синдиката', item_refs: [item.service_train_coupe]}
  - {tier: 3, text: 'Покровитель в Совете: вексель, охрана, доступ к Старой Матери', creature_refs: [creature.syndicate_enforcer]}
  revenge:
  - {tier: 1, text: 'Цены выше, двери закрыты, «пропуск недействителен»'}
  - {tier: 2, text: 'Метка Дома: знают, где герои, в их городах всё втридорога', effect_refs: [effect.house_mark]}
  - {tier: 2, text: 'Донос: розыск по линии стражи', creature_refs: [creature.syndicate_guard]}
  - {tier: 3, text: 'Наёмники и агент Дома по следу, награда за головы', creature_refs: [creature.syndicate_enforcer, creature.house_agent]}
