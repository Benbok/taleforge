  resources: ['Железные дороги, телеграф, дирижабли', Банк ФК, Шахты и Указ о малых руках, Наёмники и стража]
  relations:
  - {faction_ref: faction.ash_cordon, attitude: 0, note: 'держат Кордон ровно на грани: чтобы черта не пала и не победила'}
  - {faction_ref: faction.church, attitude: 1, note: контракты на ликвор причастия}
  - {faction_ref: faction.guild, attitude: 1, note: покупают всё у прагматиков}
  - {faction_ref: faction.miners_underground, attitude: -3, note: саботаж шахт}
  - {faction_ref: faction.broken, attitude: -1, note: хотят как проводников}
