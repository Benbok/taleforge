kind: faction
items:
- id: faction.syndicates
  name: Синдикаты Крови
  description: Совет трёх Домов, делящих Средний пояс. Для людей — спасители, для тех, кто поймёт, — те, кто сделал войну бесконечной.
  status: canon
  doc: canon.md#5.1
  tags: [faction]
  goal: 'Сохранить власть и вечный спрос на субстанции: добыча во внутренних тушах не должна прекращаться никогда (Протокол Тишины).'
  seat_ref: location.old_mother_skull
  knows:
  - Туши живы и шевелятся, когда добыча стихает
