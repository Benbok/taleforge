# Тайны атласа: ключевых лиц, новых городов и великих объектов. Источник: atlas.md#3–4.
# Формат как в locations/secrets_locations.yaml. Раскрытие — через reveal_knowledge.
kind: campaign_secret
items:
# ---------------------------------------------------------------- Объекты
- id: secret.registry_protocol_copy
  name: Копия Реестра с пометками
  status: proposal
  doc: atlas.md#1.2
  tags: [secret, registry, protocol]
  location_ref: location.old_mother_skull
  text: 'У Совета Домов есть своя копия Реестра туш. В ней против Р-001, Р-017, Р-044, Р-112 и ещё десятка номеров стоит пометка «под Протоколом»: добыча там не должна стихать никогда. Эта копия — единственный документ, который прямо связывает Дома с Протоколом Тишины.'
  known_by_refs: [creature.npc_agrafena_kostrishcheva, creature.npc_matvey_peregudov, creature.npc_efrosinya_velk, creature.npc_miron_lad]
  reveal_hints: ['В открытом Реестре у некоторых туш странные пропуски в графе «состояние»', 'Секретарь Совета переписывает том по ночам', 'Лука Кострищев никогда не видел копию матери']
  consequences: 'Обнародованная копия раскрывает Протокол Тишины и бьёт по всем трём Домам сразу.'
  related_secret_refs: [secret.protocol_silence]
- id: secret.nameless_half_awake
  name: Сторож проснулся наполовину
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, cockpit, helmsmen, nameless]
  location_ref: location.hook_nameless
  text: 'Кормчий в рубке Безымянной проснулся наполовину. Он слышит, кто пьёт его ликвор, и узнаёт Перегудова по вкусу эха. Если рубку оставить без ликвора, он умрёт; если дать ему ликвора вдоволь, Безымянная начнёт просыпаться.'
  known_by_refs: [creature.npc_matvey_peregudov]
  reveal_hints: ['Щелчки из-за ворот Безымянной в тишине прилива', 'Носильщики кокона слышат во сне пение', 'Ликвор Кубовой чище, чем бывает']
  consequences: 'Первый Кормчий, с которым можно договориться. Или первая туша, которая проснётся на памяти людей.'
  related_secret_refs: [secret.sleeping_crews, secret.waking_choice]
# ---------------------------------------------------------------- Синдикаты
- id: secret.npc_matvey_drinks_sleeper
  name: Перегудов пьёт Спящего
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, liquor, helmsmen]
  location_ref: location.city_kubovaya
  text: 'Матвей Перегудов годами пьёт ликвор прямо из коконов и теперь из рубки Безымянной. Ликвор медленно перестраивает его в Кормчего: он бледнеет, слепнет, слышит корабль. Он уверен, что корабль послушает его, когда проснётся.'
  known_by_refs: []
  reveal_hints: ['Перегудов не выносит яркого света', 'Он щёлкает языком, когда думает', 'Его личный запас ликвора не проходит через Кубы']
  consequences: 'Если туша проснётся при нём, Перегудов станет первым человеком, которого экипаж признает своим, или первым, кого он съест.'
  related_secret_refs: [secret.liquor_to_helmsmen]
- id: secret.npc_luka_deal
  name: Сделка Луки
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, syndicate, cordon]
  location_ref: location.city_gornilo
  text: 'Лука Кострищев договаривается с Маршалом Гарем: отдать Кордону топливо почти даром и вместе свалить мать и Совет Домов. О Протоколе Тишины Лука не знает, Аграфена ему не сказала.'
  known_by_refs: [creature.npc_erofey_gar]
  reveal_hints: ['Составы с желе уходят из Горнила сверх подряда', 'Офицер Кордона в Верхнем боку', 'Аграфена велела следить за сыном']
  consequences: 'Если сделка удастся, Кордон получит топливо, а Дом Кострищевых расколется. Узнав о Протоколе, Лука может стать союзником героев или его хранителем.'
  related_secret_refs: [secret.war_as_market, secret.npc_agrafena_sold_towers]
- id: secret.npc_gordey_true_flasks
  name: Настоящие флаконы Гордея
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, bank]
  location_ref: location.landmark_treasury
  text: 'Гордей Вельк знает, что сестра разбавила резервы Казны. Он тайно копит настоящие флаконы и договорился с капитаном «Терпения» об уходе на острова.'
  known_by_refs: []
  reveal_hints: ['Ящик с пометкой «лимфа» весит как кровь', 'Гордей спрашивает у мореходов про острова', 'Счёт в книге Солёного Крюка']
  consequences: 'Бегство хранителя обрушит курс ФК быстрее любого пересчёта.'
  related_secret_refs: [secret.npc_efrosinya_diluted_reserves]
# ---------------------------------------------------------------- Гильдия
- id: secret.npc_serafima_tuning_fork
  name: Декан — Камертон
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, guild, listeners]
  location_ref: location.city_svetlitsa
  text: 'Декан Серафима Орт и есть Камертон, тайная глава Слушателей. Она уже расшифровала, что туши переговариваются, и подозревает, что в рубках кто-то спит. Она не решила, кому это рассказать: Кордону, Совету или никому.'
  known_by_refs: [creature.npc_yan_kroha, creature.npc_filipp_cantor]
  reveal_hints: ['Валики Яна Крохи уходят в Коллегию без описи', 'Регент Филипп пишет письма без адреса', 'Декан ночует в архиве эхолокаторов']
  consequences: 'Если Орт заговорит, Гильдия станет силой, которая знает обе половинки правды.'
  related_secret_refs: [secret.half_truths, secret.sleeping_crews]
- id: secret.npc_kessel_volunteers
  name: Привитые слышат корабль
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, guild, reformers]
  location_ref: location.hook_hospital_mercy
  text: 'Добровольцы, которых Людвиг Кессель «привил» кровью титана, начинают слышать корабль. Двое ушли в протоки ближайшей туши и не вернулись. Кессель скрывает это, чтобы не закрыли его опыт.'
  known_by_refs: []
  reveal_hints: ['В журнале госпиталя вырваны две страницы', 'Привитые напевают одну и ту же мелодию', 'Паразиты не трогают привитых']
  consequences: 'Путь реформаторов работает, но делает людей ближе к Кормчим, чем к людям.'
  related_secret_refs: [secret.liquor_to_helmsmen]
- id: secret.npc_shtol_elixir
  name: Эликсир возвышения
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, guild, church]
  location_ref: location.city_svetlitsa
  text: 'Аптеки Аркадия Штоля поставляют верхушке Церкви «эликсир возвышения», в который подмешана кровь из гнездовых террас кратера. Штоль знает, что это такое, и берёт за это втрое.'
  known_by_refs: [creature.npc_ioakim]
  reveal_hints: ['Ящики из Светлых рядов идут в Шепчущий под печатью Церкви', 'Поставщик Штоля ходит к Спуску', 'Возвысившиеся пахнут налётом']
  consequences: 'Доказательство, что верхушка Церкви приглашена, и что Гильдия ей помогает.'
  related_secret_refs: [secret.church_top_invited]
# ---------------------------------------------------------------- Кордон
- id: secret.npc_erofey_one_season
  name: Топлива на один сезон
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, cordon]
  location_ref: location.city_oplot
  text: 'У Кордона топлива на один сезон. Маршал Гарь скрывает это даже от своих офицеров, чтобы черта не дрогнула.'
  known_by_refs: []
  reveal_hints: ['Огнемёты заправляют наполовину', 'Пустые обозы списывают как «недостачу в пути»', 'Гарь встречается с Лукой Кострищевым']
  consequences: 'Если правда выйдет наружу, молодые офицеры потребуют ликвора и союза со Сломленными, а старая гвардия может сдать черту.'
  related_secret_refs: [secret.war_as_market]
- id: secret.npc_velimira_letters
  name: Письма Звоновой
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, cordon, broken]
  location_ref: location.hook_unceasing
  text: 'Велимира Звонова тайно переписывается с Лисой Сновидицей. Она знает, что Сломленные слышат корабли, и хочет использовать их как проводников для общего звона.'
  known_by_refs: [creature.npc_lisa]
  reveal_hints: ['Звонарь Неумолчной ездит на Лесную ветку', 'У Звоновой лист с рисунком Черепа-Молельни', 'Сломленных пускают в Неумолчную']
  consequences: 'Союз Кордона и Сломленных — опора Третьего пути. Старая гвардия сочтёт его изменой.'
  related_secret_refs: [secret.third_path_price]
- id: secret.npc_kirill_gate
  name: Башня 17 — ворота
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, cordon, invited]
  location_ref: location.hook_tower_17
  text: 'Весь гарнизон Башни 17 — приглашённые. Их не трогают волны, потому что они свои. В нужную ночь Кирилл Тишь погасит огонь, остановит колокол и оборвёт пролёт Нити.'
  known_by_refs: []
  reveal_hints: ['Гарнизон не теряет людей год', 'Колокол Семнадцатой звонит на полтона ниже', 'Обрывы Нити всегда рядом с Семнадцатой']
  consequences: 'Прорыв черты у Семнадцатой, как в 38 году. Сила Резонанса растёт скачком.'
  related_secret_refs: [secret.church_top_invited]
- id: secret.npc_molchan_ban
  name: Почему Обитель запрещали
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, bells, church]
  location_ref: location.hook_bell_monastery
  text: 'Отец Молчан знает, почему Церковь сто лет назад запретила Обитель: старый обряд звона будил голоса в высших жрецах и показывал, кто из них приглашён.'
  known_by_refs: []
  reveal_hints: ['В Обители хранят грамоту о запрете с печатью Шепчущего', 'Возвысившиеся не заходят за ограду Обители', 'Молчан пишет мелом одно слово: «звон проверяет»']
  consequences: 'Старый обряд — способ найти приглашённых, в том числе верхушку Церкви и гарнизон Семнадцатой.'
  related_secret_refs: [secret.church_top_invited]
- id: secret.npc_nestor_report_40
  name: Донесение сорокового года
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, archive, helmsmen]
  location_ref: location.hook_league_archive
  text: 'В Архиве Лиги лежит донесение выжигателя из 40 года: «боги» ростом с ребёнка, без глаз, спускались в кратер и пели. Это первое свидетельство о Кормчих, и его никто не читал триста лет.'
  known_by_refs: [creature.npc_nestor]
  reveal_hints: ['Нестор любит рассказывать про «странные журналы»', 'Опись Архива обрывается на 40 годе', 'Рисунок на полях журнала']
  consequences: 'Кордон узнаёт вторую половинку правды: «боги» живые и маленькие, как те, кто спит в рубках.'
  related_secret_refs: [secret.half_truths, secret.sleeping_crews]
# ---------------------------------------------------------------- Старые земли, острова, перрон
- id: secret.npc_vseslav_league_right
  name: Право созыва
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, league, vyshegrad]
  location_ref: location.landmark_veche_bell
  text: 'По подлиннику Устава Лиги князь Вышеграда — последний законный князь Лиги и может созвать её заново ударом Вечевого колокола. Созыв обязывает Кордон и все вольные города встать под его знамя. Всеслав знает это и боится этого права.'
  known_by_refs: [creature.npc_vseslav]
  reveal_hints: ['Список Устава у Кордона короче подлинника', 'Синдикаты хотят выкупить Кремль вместе с долгами', 'В Книжной слободе переписывают Устав']
  consequences: 'Созыв Лиги — политическая опора Третьего пути. Синдикаты сделают всё, чтобы его не было.'
  related_secret_refs: [secret.third_path_price]
- id: secret.npc_vedana_quiet_word
  name: Обычай тихого слова
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, islands, transformation]
  location_ref: location.city_zatishye
  text: 'Острова хранят обычай тихого слова: это не магия, а уклад, при котором злое не копится. Обиды проговаривают вслух на общем совете, долги прощают раз в семь лет, никто не ест один. Ведана понимает, что именно поэтому эхо на островах спит, и боится, что материк это испортит.'
  known_by_refs: [creature.npc_vedana, creature.npc_ida_islands]
  reveal_hints: ['Раз в семь лет на островах прощают долги', 'Сорок дней на Пристани — не карантин, а обучение', 'Ида говорит «проговорить», а не «простить»']
  consequences: 'Живой образец Преображения. Перенести его на материк труднее всего на свете.'
  related_secret_refs: [secret.transformation_possible]
- id: secret.npc_zinovy_wagons
  name: Пропавшие вагоны
  status: proposal
  doc: atlas.md#4.2
  tags: [secret, npc, smuggler, liquor]
  location_ref: location.hook_last_platform
  text: 'Вагоны с ликвором на Узле Шов крадёт Зиновий Кран. Ликвор он продаёт Кордону и Сломленным дешевле Дома.'
  known_by_refs: []
  reveal_hints: ['Звонари Кордона платят ликвором, которого им не выдавали', 'Кран всегда знает расписание', 'Пломбы на пустых вагонах целые']
  consequences: 'Дом Ликвора ищет вора, Кордон его прикрывает.'
  related_secret_refs: []
# ---------------------------------------------------------------- Матери
- id: secret.mother_stingy_origin
  name: Кем была Скупая
  status: proposal
  doc: atlas.md#1.6
  tags: [secret, mother, resonance]
  location_ref: location.hook_echolite_heart
  text: 'Скупая — купчиха горного города, которая в голодный год до горы не отдала хлеб. Она поддалась первой в час Сгущения и срослась с эхолитом. Пока она жива, Сердце эхолита не расколоть.'
  known_by_refs: []
  reveal_hints: ['Хлебная печать горного города в Архиве Лиги', 'Скупая предлагает сделки, а не угрожает', 'Выводки Скупой собирают всё блестящее']
  consequences: 'Главная мать Третьего пути.'
  related_secret_refs: [secret.mothers_echolite, secret.third_path_price]
- id: secret.mother_imperious_origin
  name: Кем была Властная
  status: proposal
  doc: atlas.md#1.6
  tags: [secret, mother, resonance]
  location_ref: location.hook_nest_terraces
  text: 'Властная — наместница горного города. Она держит выводки строем и первой учит рой воевать, как люди: адаптация роя идёт от неё.'
  known_by_refs: []
  reveal_hints: ['Волны с севера идут колоннами', 'Отзвучные с террас носят обрывки мундиров', 'Властная говорит приказами']
  consequences: 'Без неё рой теряет строй, и черта получит передышку.'
  related_secret_refs: [secret.mothers_echolite]
- id: secret.mother_vengeful_origin
  name: Кем была Мстительная
  status: proposal
  doc: atlas.md#1.6
  tags: [secret, mother, resonance]
  location_ref: location.belt_crater
  text: 'Мстительная — вдова, чью семью Лига казнила по подозрению в Войну налёта. Она ушла за вал сама. Её волны бьют в башни, стоящие на месте крепостей, где казнили её родных.'
  known_by_refs: []
  reveal_hints: ['Журналы казней Лиги в Архиве', 'Одни и те же башни под ударом триста лет', 'Мстительная называет Кордон «Лигой»']
  consequences: 'Единственная мать, с которой можно говорить о прощении. Это ключ для Преображения и ловушка для остальных путей.'
  related_secret_refs: [secret.transformation_possible]
