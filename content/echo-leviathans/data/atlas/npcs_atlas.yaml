# Ключевые лица атласа: главы сил и хозяева новых городов, матери кратера. Источник: atlas.md#4.
# Как в locations/npcs.yaml: base_ref — шаблон пакета, srd_ref — шаблон SRD 5.1, secret_ref — тайна (видит мастер).
# Тег unique — ключевое лицо мира: архитектор кампании видит его цель и тайну и может взять его в каркас.
kind: creature_template
