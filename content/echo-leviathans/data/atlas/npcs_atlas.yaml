  base_ref: creature.guild_listener
  srd_ref: {type: monster, name: Mage}
  cr: 6
  alteration: 3
  behavior: {profile: cowardly, flee_threshold: 0.6, note: 'в бой вступает только загнанным; охрана — наёмники Синдиката'}
