  location_type: landmark
  belt: crater
  parent_ref: location.belt_crater
  distance_from_rim_miles: 0
  adjacent_refs: [location.hook_silent_guard_cocoons, location.hook_echolite_heart]
  lore_refs: [lore.loc_stormtrooper_descent, lore.atlas_mothers_names]
  secret_refs: [secret.alien_mothers]
  ending_paths: [third_path, crews]

- id: location.landmark_cordon_thread
  name: Нить Кордона
  description: 'Телеграфная линия вдоль всех 64 башен черты, медный провод на столбах и ретрансляторы на ликворных лампах. Главная нить фронта: по ней Оплот видит всю черту. Рой учится её рвать.'
  status: proposal
  canon_parts: [Нить Кордона — главная линия фронта (locations.md#1.3)]
  doc: atlas.md#3.2; locations.md#1.3
  tags: [landmark, atlas, cordon, telegraph, ash_line]
  keywords: телеграф провод связь фронт башни пролёт ретранслятор телеграфисты звон
  location_type: landmark
  belt: ash_line
  parent_ref: location.belt_ash_line
  lore_refs: [lore.loc_cordon_thread, lore.atlas_cordon_thread_spans, lore.atlas_common_ring]
  ending_paths: [third_path]
  hooks:
  - {name: Обрыв на пролёте, text: 'Между двумя башнями снова оборван провод, и обрыв аккуратный, как ножом.'}

