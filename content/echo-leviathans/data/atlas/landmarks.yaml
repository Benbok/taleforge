# Великие объекты атласа, которых ещё нет среди мест поясов и туш. Источник: atlas.md#3.
# Уже есть в данных: Сердце эхолита (hook_echolite_heart), Пасть (hook_maw_rift), Рифовая спина,
# Башня 17, Неумолчная, Архив Лиги, Безымянная, Тихий этаж (лор Старой Матери).
# ending_paths — к каким финалам канона объект даёт опору (canon.md#6): order, stop_mining, crews, hunger,
# third_path, transformation. Объект не толкает к финалу, он делает путь выполнимым в мире.
kind: location_template
items:
- id: location.landmark_fire_wall
  name: Огненный вал
  description: 'Кольцо руин великой стены Пепельной лиги вокруг Кольца Паломников: рвы, где горело масло, и колокольные крепости через каждые несколько миль. На руинах стоят 64 башни черты.'
  status: proposal
  canon_parts: [Руины Огненного вала и колокольных крепостей (canon.md#2.1)]
  doc: atlas.md#3; canon.md#2.1
  tags: [landmark, atlas, league, ruins, ash_line]
  keywords: вал руины лига крепости рвы склады подземелья выжигатели история
  location_type: landmark
  belt: ash_line
  parent_ref: location.belt_ash_line
  distance_from_rim_miles: [35, 45]
  hazard_refs: [hazard.blight]
  lore_refs: [lore.fire_wall, lore.wall_fell, lore.atlas_towers]
  ending_paths: [third_path]
  hooks:
  - {name: Склад Лиги, text: 'Под обвалившейся крепостью нашли целый склад масла и колоколов, запечатанный в 38 году.'}
  - {name: Тихий налёт, text: 'В старом рву под пеплом что-то шевелится во время прилива.'}

