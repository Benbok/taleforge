  description: 'Ход в склоне кратера, прорезанный «богами» в 40 году. Единственная дорога вниз. Рядом — брошенное снаряжение и пустые коконы.'
  status: proposal
  canon_parts: [Спуск штурмовиков (locations.md#1.3)]
