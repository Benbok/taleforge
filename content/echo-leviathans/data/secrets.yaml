# Тайны кампании по умолчанию (скрытый уровень канона). known_by_refs — кто знает с начала кампании.
kind: campaign_secret
items:
- id: secret.protocol_silence
  name: Протокол Тишины
  status: canon
  doc: canon.md#5.1
  tags: [secret]
  text: 'Около 330 года Дом Ликвора выяснил, что туши живы, а в рубках кто-то спит. Совет Домов постановил: добыча во внутренних тушах не должна прекращаться никогда, какой бы ни была цена, включая детей.'
  known_by_refs: [faction.syndicates, faction.house_liquor, faction.house_kostrishchev, faction.lymph_company]
  reveal_hints: [Архив Совета в Старой Матери, Агент Дома Ликвора под давлением, Приказы о «непрерывной смене»]
  consequences: 'Раскрытие — решающий перелом: Синдикаты теряют легитимность, начинаются бунты.'
- id: secret.carcasses_alive
  name: Туши живы
  status: canon
  doc: canon.md#1.5; canon.md#4.2
  tags: [secret]
  text: 'Туши не мертвы: это оглушённые корабли. Добыча (ликвор, нервы, костный мозг) держит их неподвижными. Прилив — слабый пульс парализованного Левиафана.'
  known_by_refs: [faction.syndicates, faction.house_liquor]
  reveal_hints: ['Туша шевелится, когда добыча стихает', 'Прилив сильнее там, где шахта закрыта']
  consequences: Остановка добычи двигает часы пробуждения туши.
- id: secret.sleeping_crews
  name: Спящие экипажи
  status: canon
  doc: canon.md#1.2
  tags: [secret]
  text: В рубках в коконах спят Кормчие, живущие за счёт того самого ликвора, который выкачивают люди. Часть коконов уже пуста.
  known_by_refs: [faction.house_liquor]
  reveal_hints: [Коконы-«кресла» в рубках, Сны через Шёпот, Расшифровки Слушателей]
  consequences: Проснувшийся Кормчий — перелом кампании.
- id: secret.fleet_signal
  name: Сигнал флоту
  status: canon
  doc: canon.md#1.1
  tags: [secret]
  text: Корабли на суше — передовая волна. Основной флот спит в разломах под морем и ждёт сигнала. Если экипажи на суше проснутся и подадут его, поднимется весь флот.
  known_by_refs: []
  reveal_hints: [Эхо-речь из разломов, Разломный страж, Сны Звучащих]
  consequences: 'Сигнал — большой перелом: поверхность под угрозой власти Кормчих.'
- id: secret.resonance_nature
  name: Природа Резонанса
  status: canon
  doc: canon.md#1.3
  tags: [secret]
  text: Резонанс — бессознательный сгусток голода из эха помыслов, прежде всего худших человеческих желаний, накопленного эхолитом за тысячелетия. Люди создали его всей своей историей.
  known_by_refs: []
  reveal_hints: [Эхолит и старые храмовые плиты, 'Отзвучные, говорящие голосами мёртвых', Архивы Лиги]
  consequences: Открывает пути Третий и Преображение.
- id: secret.mines_feed_resonance
  name: Шахты кормят Резонанс
  status: proposal
  doc: canon.md#5.1
  tags: [secret]
  text: Страх и боль детей в шахтах, жадность Синдикатов и голод трущоб — свежее эхо, которое кормит Резонанс. Протокол, держащий корабли неподвижными, откармливает другого врага.
  known_by_refs: []
  reveal_hints: [Налёт темнеет рядом с шахтами Кольца, Глубинные идут к шахтам]
  consequences: 'Главная дилемма мира: порядок, спасение детей и пробуждение туш связаны.'
- id: secret.mothers_echolite
  name: Матери и эхолит
  status: canon
  doc: canon.md#1.3
  tags: [secret]
  text: Без матерей и без эхолита сгусток рассеется. Матери понимают это и охраняют кратер.
  known_by_refs: [faction.ash_cordon]
  reveal_hints: [Смерть матери гасит налёт в её зоне, Матери не покидают логова]
  consequences: Убийство матерей — стратегическая цель, а не просто босс.
- id: secret.third_path_price
  name: Цена Третьего пути
  status: canon
  doc: canon.md#6
  tags: [secret]
  text: Эхолит раскалывается, если все колокола черты звонят разом, а в кратер заливают ликвор. Тот, кто спустится к эхолиту, впитает всё эхо и станет новым сгустком — одиноким и безопасным, но навсегда потерянным для себя.
  known_by_refs: []
  reveal_hints: [Архивы колокольных крепостей, Обитель Звона]
  consequences: Без жертвы героя или NPC путь не пройти.
- id: secret.church_top_invited
  name: Возвышение — приглашение
  status: canon
  doc: canon.md#5.3
  tags: [secret]
  text: «Возвышение» высших жрецов — это приглашение Резонанса; их сила — из голода и Скверны. Некоторые на пути к тому, чтобы стать матерями.
  known_by_refs: [faction.church_top]
  reveal_hints: [Проба ликвором на жреце, Ангельский гнев пахнет не ликвором]
  consequences: Верхушка Церкви готовит новую мать (фронт акта II).
- id: secret.communion_keeps_sleep
  name: Причастие держит ангелов во сне
  status: canon
  doc: canon.md#5.3
  tags: [secret]
  text: Выпивая ликвор на причастии, Церковь сама держит своих «ангелов» во сне.
  known_by_refs: []
  reveal_hints: ['Коконы пустеют там, где больше причастия']
  consequences: Удар по вере низшего духовенства.
- id: secret.alien_mothers
  name: Чужие матери
  status: canon
  doc: canon.md#1.2; races.md#2.4
  tags: [secret]
  text: Тихие стражи Кормчих ушли в кратер и стали чужими матерями. Именно они научили Резонанс перехватывать нитевиков. Рядом с такой матерью проснувшийся корабль может достаться рою.
  known_by_refs: []
  reveal_hints: [Биоминеральный клинок в логове, 'Санитары, подчинённые рою']
  consequences: Туша у чужой матери выберет Резонанс.
- id: secret.deepkin_are_children
  name: Глубинные — наши дети
  status: canon
  doc: canon.md#3.2
  tags: [secret]
  text: Глубинные — дети-шахтёры, согласившиеся на зов вглубь. Самые сильные станут новыми матерями. Внутри они помнят обрывки детства.
  known_by_refs: [faction.broken]
  reveal_hints: [Шахтёрские жетоны на Глубинных, Сломленные слышат их детство]
  consequences: Трагедия, а не просто чудовища.
- id: secret.waking_choice
  name: Кого послушает корабль
  status: canon
  doc: canon.md#1.5
  tags: [secret]
  text: 'Если добыча прекратится, корабли начнут оживать, и никто не знает, кого корабль послушает: проснувшийся экипаж или Резонанс.'
  known_by_refs: []
  reveal_hints: [Шевеление туш у закрытых шахт]
  consequences: Победа подполья может оживить корабли.
- id: secret.war_as_market
  name: Война как рынок
  status: canon
  doc: canon.md#5.1
  tags: [secret]
  text: 'Синдикатам выгодна не победа, а сама война: Дома держат Кордон ровно на грани, чтобы черта не пала и не победила.'
  known_by_refs: [faction.syndicates]
  reveal_hints: [Поставки топлива Кордону режут перед каждой волной, Цены растут с кризисами]
  consequences: Кордон может порвать с Синдикатами.
- id: secret.liquor_to_helmsmen
  name: Ликвор перестраивает в Кормчих
  status: canon
  doc: canon.md#1.6; rules.md#3.5
  tags: [secret]
  text: Ликвор меняет любого, кроме Кормчих, в их сторону; Безмолвные принимают цели Кормчих — разбудить Спящих и навести тишину.
  known_by_refs: []
  reveal_hints: [Старые маги похожи на Спящих]
  consequences: Безмолвные — пятая колонна спящих экипажей.
- id: secret.half_truths
  name: Половинки правды
  status: canon
  doc: canon.md#5.6
  tags: [secret]
  text: 'Синдикаты знают, что туши живы; Кордон знает, что Резонанс жив. Вместе это значит: добыча держит корабли и кормит новую армию Резонанса. Сложить половинки могут только герои.'
  known_by_refs: []
  reveal_hints: [Документы обеих сторон]
  consequences: Ключ к акту II «Половинки правды».
- id: secret.transformation_possible
  name: Преображение возможно
  status: canon
  doc: canon.md#6; canon.md#7
  tags: [secret]
  text: 'Если доброго эха станет больше, Резонанс станет отражением добрых помыслов: Цветение вместо налёта, матери — сады-хранители. Острова — живое доказательство.'
  known_by_refs: []
  reveal_hints: [Светлые отзвуки у старых храмов милосердия, Жизнь островитян]
  consequences: Открывает путь Преображения (часы Цветения).
