# Таблицы добычи (items.md 7). В SRD 5.1 таблиц сокровищ нет — все числа свои (предложение).
# Строка: roll (диапазон d20), item_refs (+ qty в том же порядке), fk (число или формула), text (для мастера).
# choose: one — выдать один из item_refs; by_scenario: true — только если сценарий/перелом разрешает (реликвии).
# Живые люди — не добыча: строки npc: true порождают NPC для спасения (spawn_entity), а не give_item.
# Если выпал предмет сверх бюджета яруса (loot_table.treasure_budget), приложение заменяет его на ФК
# по нижней границе полосы редкости (price_index.rarity_bands).
kind: loot_table
items:
  # --- Бюджет сокровищ (items.md 7.1) ---
  - id: loot_table.treasure_budget
    name: Бюджет сокровищ по ярусам
    description: Потолок для give_item вне таблиц добычи, на отряд из 4 героев (для другого размера — пропорционально). Импланты считаются постоянными предметами; реликвий — не больше 3 за кампанию.
    status: proposal
    doc: items.md#7.1
    tags: [treasure, budget]
    dice: null
    rows:
      - {tier: "1-4", fk_per_party_level: 200, consumables_per_level: [4, 6], consumable_max_rarity: uncommon, permanent: {uncommon: 4, rare: 1}, rare_min_level: 4}
      - {tier: "5-10", fk_per_party_level: 800, consumables_per_level: [4, 6], consumable_max_rarity: rare, permanent: {uncommon: 6, rare: 5, very_rare: 1}, very_rare_min_level: 9}
      - {tier: "11-15", fk_per_party_level: 3000, consumables_per_level: [4, 6], consumable_max_rarity: very_rare, permanent: {rare: 3, very_rare: 4, relic: 1}, relic_only_via: [pivot, scenario]}
    campaign_limits: {relics_max: 3, nest_share_max_in_pilgrim_ring: 0.5}

  # --- Уровни 1–4 ---
  - id: loot_table.tier1_carcass
    name: Добыча 1–4, туша и шахта
    description: Бросок d20 при обыске туши или шахты на уровнях 1–4.
    status: proposal
    doc: items.md#7.2
    tags: [treasure, tier1, carcass]
    tier: "1-4"
    place: carcass
    dice: d20
    rows:
      - {roll: "1-4", fk: 2d6, item_refs: [item.trade_raw_chitin], qty: [1d4], text: "2d6 ФК и 1d4 фунта сырого хитина"}
      - {roll: "5-8", item_refs: [item.trade_lymph, item.miner_cleaver], qty: [1d4, 1], text: "1d4 колбы лимфы и тесак шахтёра"}
      - {roll: "9-11", item_refs: [item.liquor_dirty], qty: [1], text: "1 доза грязного ликвора"}
      - {roll: "12-14", item_refs: [item.blood_serum, item.filter_mask], qty: [1, 1]}
      - {roll: "15-17", item_refs: [item.jelly_grenade, item.lymph_lamp], qty: [2, 1]}
      - {roll: "18-19", item_refs: [item.vein_boots], qty: [1], text: "Необычный: мягкие боты жилолаза"}
      - {roll: "20", fk: 100, reveal_knowledge: {level: initiated, count: 1}, text: "Архив-осколок: один слух (lore_facts уровня «посвящённые») и 100 ФК"}
  - id: loot_table.tier1_nest
    name: Добыча 1–4, гнездо и налёт
    description: Бросок d20 при обыске гнезда или налёта на уровнях 1–4.
    status: proposal
    doc: items.md#7.2
    tags: [treasure, tier1, nest]
    tier: "1-4"
    place: nest
    dice: d20
    rows:
      - {roll: "1-4", fk: 1d6, text: "Снаряжение пропавших: простое оружие (любое простое SRD) и 1d6 ФК"}
      - {roll: "5-8", item_refs: [item.trade_echolith_grain], qty: [1], text: "1 крупица эхолита (вне закона)"}
      - {roll: "9-11", item_refs: [item.blood_serum], qty: [1d2]}
      - {roll: "12-14", npc: true, not_loot: true, creature_refs: [creature.cocoon], count: 1, text: "Кокон стадии I с человеком — NPC для спасения, не добыча. Награда — репутация и деньги от семьи или фракции"}
      - {roll: "15-17", fk: 25, fk_from: cordon, text: "Жетон погибшего выжигателя: Кордон платит 25 ФК, если вернуть"}
      - {roll: "18-19", item_refs: [item.implant_sanitar_eye], qty: [1], text: "Необычный имплант «Глаз санитара» (нужно вживить)"}
      - {roll: "20", lead_item_ref: item.relic_hunger_compass, text: "Наводка на Компас голода (сюжетная зацепка, не сам предмет)"}
  - id: loot_table.tier1_syndicate
    name: Добыча 1–4, Синдикаты
    description: Склад, сейф или курьер Синдикатов на уровнях 1–4.
    status: proposal
    doc: items.md#7.2
    tags: [treasure, tier1, syndicate]
    tier: "1-4"
    place: syndicate
    dice: d20
    rows:
      - {roll: "1-4", fk: "3d6*5", text: "3d6 × 5 ФК в ампулах крови"}
      - {roll: "5-8", fk: 50, promissory: {house_bound: true, other_house_factor: 0.5}, text: "Вексель на 50 ФК (в городах другого Дома — половина)"}
      - {roll: "9-11", item_refs: [item.blood_serum, item.injector], qty: [2, 1]}
      - {roll: "12-14", item_refs: [item.cats_eye, item.smelling_salts], qty: [1, 3], choose: one, text: "Кошачий глаз или нюхательная соль × 3"}
      - {roll: "15-17", item_refs: [item.scattergun, item.ammo_buckshot], qty: [1, 2], text: "Картечница и 20 зарядов"}
      - {roll: "18-19", item_refs: [item.liquor_weapon_1], qty: [1], text: "Необычный: оружие ликворной закалки +1"}
      - {roll: "20", item_refs: [item.relic_protocol_seal], qty: [1], by_scenario: true, text: "Печать Протокола (5.7)"}

  # --- Уровни 5–10 ---
