      - {roll: "15-17", item_refs: [item.relic_herald_mask], qty: [1], by_scenario: true, text: "Маска Глашатая (5.10)"}
      - {roll: "18-19", item_refs: [item.implant_nerve_shunt], qty: [1], text: "Редкий имплант «Нервный шунт»"}
      - {roll: "20", item_refs: [item.relic_silent_guard_blade], qty: [1], by_scenario: true, creature_refs: [creature.helmsman_silent_guard], text: "Очень редкий: Клинок тихого стража у тела матери-стража"}
  - id: loot_table.tier2_syndicate
    name: Добыча 5–10, Синдикаты
