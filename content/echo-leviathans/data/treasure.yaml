    tier: "5-10"
    place: syndicate
    dice: d20
    rows:
      - {roll: "1-4", fk: "2d6*50"}
      - {roll: "5-8", item_refs: [item.lymph_ward, item.antitoxin], qty: [2, 2]}
      - {roll: "9-11", item_refs: [item.revolver_six, item.ammo_steam_bullets], qty: [1, 3], text: "Револьвер «Шестёрка» и 30 пуль"}
      - {roll: "12-14", fk: 500, promissory: {house_bound: true}, on_cash: {effect: house_mark}, text: "Вексель на 500 ФК и «Метка Дома», если его обналичить"}
      - {roll: "15-17", item_refs: [item.pleura_cloak, item.vertebra_ring], qty: [1, 1], choose: one, text: "Редкий: плащ из плевры или кольцо из позвонка"}
      - {roll: "18-19", item_refs: [item.discharge_wand], qty: [1], text: "Редкий: жезл разряда"}
      - {roll: "20", story: true, lead_item_ref: item.relic_protocol_seal, text: "Приказ по Протоколу Тишины (сюжетный документ, пара к Печати)"}

