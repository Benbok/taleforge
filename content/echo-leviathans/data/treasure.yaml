      - {roll: "15-17", item_refs: [item.burner_carapace, item.bathysphere_armor], qty: [1, 1], choose: one}
      - {roll: "18-19", item_refs: [item.relic_archive_crystal], qty: [1], by_scenario: true, text: "Редкий: Архив-кристалл (5.6)"}
