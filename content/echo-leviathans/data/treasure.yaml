  # --- Разделка (items.md 7.3) ---
  - id: loot_table.butchering
    name: Разделка туш и существ
    description: 1 час, инструменты или тесак. Проверка Мдр (Выживание) или Инт (Медицина), сл. 12. Провал — половина выхода; провал на 5+ — ещё и спасбросок против Скверны, сл. 10. Выход — сырьё, его надо переработать.
    status: proposal
    doc: items.md#7.3
    tags: [treasure, butchering]
    dice: by_source
    check: {time: {unit: hour, value: 1}, skill_options: [{stat: wis, skill: survival}, {stat: int, skill: medicine}], dc: 12, requires_any_refs: [item.miner_cleaver, item.surgeon_tools]}
    on_fail: {yield_factor: 0.5}
    on_fail_by_5:
      - {op: save, stat: con, dc: 10, vs: corruption, on_fail: [{op: resource, stat: corruption, delta: 1}]}
    rows:
      - {source: Санитар, creature_refs: [creature.organism_sanitar, creature.organism_sanitar_large], item_refs: [item.trade_raw_chitin, item.trade_sanitar_gland], qty: [1d4, 1]}
      - {source: Кровяная медуза, creature_refs: [creature.organism_blood_jelly, creature.organism_blood_jelly_small], item_refs: [item.trade_lymph], qty: [1d4]}
      - {source: Нитевики, creature_refs: [creature.organism_threadworm_swarm], text: "Ничего полезного. Сжечь"}
      - {source: Шёпот, creature_refs: [creature.organism_whisper], item_refs: [item.trade_whisper_gland], qty: [1], text: "Вне закона: сырьё для шлемов и масок"}
      - {source: Выводок (любой), item_refs: [item.trade_raw_chitin], qty: [1d4], infected: true, text: "Хитин выводка заражён: переработка только через сожжение, иначе у кузнеца спасбросок против Скверны, сл. 10"}
      - {source: Штамм стадии III, creature_refs: [creature.strain_ram, creature.strain_shellback, creature.strain_spiker], item_refs: [item.trade_raw_chitin], qty: [2d4], infected: true, fk: "50-200", text: "Хитин ×2 и органы штамма (сюжет для Гильдии, 50–200 ФК)"}
      - {source: Мать, creature_refs: [creature.mother_human, creature.mother_alien], item_refs: [item.trade_echolith_grain, item.trade_raw_chitin], qty: [2d6, 4d10], text: "Наросты эхолита и хитин. Сердцевина матери — сюжетный предмет"}
      - {source: "Туша-Левиафан, смена в шахте", fk: "1d6*10", fk_as_goods: true, item_refs: [item.trade_blood, item.trade_lymph, item.trade_marrow_fuel, item.trade_raw_chitin], choose: by_mine_type, text: "1d6 × 10 ФК в крови, лимфе, мозге или хитине по типу шахты. Ликвор — только в желудочках"}
